---
# Task reutilizável: garante que os segredos do Vault existem ANTES de qualquer
# operação destrutiva ou de provisionamento.
#
# Motivo: antes desta validação, cada consumidor usava `{{ var | default('...') }}`.
# Como `group_vars/all/vault.yml` não era carregado, o default era sempre o valor
# efetivo — o playbook provisionava o Portainer com uma senha publicada no repo e
# reportava sucesso. Falhar aqui é o comportamento correto.
#
# Uso, nos `pre_tasks` de cada play que consome segredo:
#   pre_tasks:
#     - name: Validar segredos do Vault
#       ansible.builtin.include_tasks: "../tasks/validate_vault.yml"
#       vars:
#         required_secrets: [portainer_admin_password, cloudflare_api_token]
#
# `required_secrets` é uma lista com os NOMES das variáveis exigidas por aquele
# play — só o que ele usa de fato, para que um playbook isolado não exija o vault
# inteiro.

- name: Verificar se a lista de segredos exigidos foi informada
  ansible.builtin.assert:
    that:
      - required_secrets is defined
      - required_secrets | length > 0
    fail_msg: >-
      validate_vault.yml foi incluído sem `required_secrets`.
      Informe a lista de variáveis que este play consome.
    quiet: true

- name: Exigir que cada segredo esteja definido e não vazio
  ansible.builtin.assert:
    that:
      - item in vars
      - vars[item] is string
      - vars[item] | length > 0
    fail_msg: >-
      Segredo '{{ item }}' ausente ou vazio.
      Crie/edite o Vault do ambiente em uso e rode novamente:
        cd ansible/
        cp inventories/vault.yml.example inventories/prod/group_vars/all/vault.yml   # ou dev/, se ainda não existir
        ansible-vault edit inventories/prod/group_vars/all/vault.yml                 # ou dev/
      Nunca reintroduza `| default('...')` para contornar este erro.
    success_msg: "Segredo '{{ item }}' presente."
    quiet: true
  loop: "{{ required_secrets }}"
  # SEM no_log aqui: o NOME da variável (`item`) não é segredo — só o VALOR é
  # (censurado pelo `loop_control.label` abaixo). Sem isso, o operador não sabe
  # QUAL das chaves de `required_secrets` faltou quando o assert falha.
  loop_control:
    label: "{{ item }}"

# Motivo desta task: a anterior só recusa AUSENTE ou VAZIO. Um placeholder como
# `TROCAR-psk-main` está definido e não é vazio — passava aprovado, e o
# `02-openwrt-setup.yml` reescrevia as senhas de Wi-Fi da casa para a string
# literal do exemplo. A forma é detectada, não uma lista de nomes de variável:
# prefixo `TROCAR-` (convenção deste repositório, ver vault.yml.example),
# `SUBSTITUIR` (mesmo arquivo, usado onde não há um prefixo natural),
# `<CHANGEME>`/`<CHANGE-ME>`/`<CHANGE_ME>` (convenção comum fora deste repo,
# para quando alguém colar um vault de outro projeto), valor inteiro embrulhado em
# `<...>` ou `${...}` (placeholder de template/env não expandido) e string
# vazia disfarçada de espaços.
#
# SEM no_log aqui: o NOME da variável (`item`) precisa aparecer no erro para o
# operador saber qual segredo trocar. O fail_msg abaixo nunca ecoa
# `vars[item]` — só compara o valor contra o padrão e nomeia a variável.
# `quiet: true` (como nas tasks vizinhas) evita que o Ansible reimprima o
# resultado do assert; a condição em si nunca contém o valor literal do
# segredo, então não há necessidade de `no_log` para não vazar nada.
- name: Recusar segredo com valor de placeholder ainda não trocado
  ansible.builtin.assert:
    that:
      - not (vars[item] is search(vault_placeholder_pattern, ignorecase=true))
    fail_msg: >-
      Segredo '{{ item }}' ainda está com valor de placeholder (prefixo
      TROCAR-/SUBSTITUIR, <CHANGEME>, valor embrulhado em <...> ou ${...}, ou
      string em branco) — não é o segredo real.
      Edite o Vault do ambiente em uso e defina o valor real antes de aplicar:
        cd ansible/
        ansible-vault edit inventories/prod/group_vars/all/vault.yml   # ou dev/
      Nunca aplique um playbook com placeholder no lugar de segredo real.
    success_msg: "Segredo '{{ item }}' não tem forma de placeholder."
    quiet: true
  vars:
    vault_placeholder_pattern: '^\s*$|TROCAR|SUBSTITUIR|CHANGE[-_]?ME|^<.*>$|^\$\{.*\}$'
  loop: "{{ required_secrets }}"
  loop_control:
    label: "{{ item }}"

# Continuação natural da task anterior: aquela recusa placeholder pela FORMA
# (prefixo TROCAR-, <...>, etc); os 4 SSID de exemplo do template
# (Homelab-Main/IoT/Media/Guest, ver vault.yml.example) NÃO têm essa forma —
# são strings normais e passariam. Sem este gate, aplicar 02-openwrt-setup.yml
# com o vault ainda no exemplo reescreveria os SSID da casa para os nomes
# publicados no repositório. A comparação é contra a lista fixa de nomes de
# exemplo (case-insensitive): só uma variável de SSID conteria um desses
# valores, então não é preciso filtrar por nome de variável.
#
# SEM no_log aqui, mesma justificativa da task de placeholder acima: o NOME da
# variável (`item`) precisa aparecer no erro para o operador saber qual SSID
# trocar; o fail_msg nunca ecoa `vars[item]`, só compara contra a lista fixa e
# nomeia a variável. A condição em si não contém o literal do segredo.
- name: Recusar SSID ainda igual a um dos nomes de exemplo do template
  ansible.builtin.assert:
    that:
      - vars[item] | lower not in vault_example_ssids
    fail_msg: >-
      Segredo '{{ item }}' ainda está com um SSID de exemplo do template
      (Homelab-Main/IoT/Media/Guest) — não é o SSID real da rede.
      Edite o Vault do ambiente em uso e defina o SSID real antes de aplicar:
        cd ansible/
        ansible-vault edit inventories/prod/group_vars/all/vault.yml   # ou dev/
      Nunca aplique 02-openwrt-setup.yml com SSID de exemplo: ele reescreveria
      os SSID da casa para os nomes publicados no repositório.
    success_msg: "Segredo '{{ item }}' não é SSID de exemplo."
    quiet: true
  vars:
    # ⚠️ Lista fixa, sem vínculo automático com vault.yml.example: se os SSID de
    # exemplo mudarem lá (wifi_*_ssid), espelhe a mudança aqui — senão o gate
    # deixa de reconhecer o novo nome de exemplo. Sincronizar por script seria
    # over-engineering para 4 valores; a duplicação é intencional e manual.
    vault_example_ssids:
      - homelab-main
      - homelab-iot
      - homelab-media
      - homelab-guest
  loop: "{{ required_secrets }}"
  loop_control:
    label: "{{ item }}"

- name: Exigir comprimento mínimo da senha de admin do Portainer
  ansible.builtin.assert:
    that:
      - portainer_admin_password | length >= 16
    fail_msg: >-
      portainer_admin_password tem menos de 16 caracteres.
      O Portainer monta o socket do Docker: esta senha é root-equivalente nos dois
      nós do Swarm. Gere uma nova com `openssl rand -base64 32`.
    quiet: true
  when: "'portainer_admin_password' in required_secrets"
  no_log: true

- name: Exigir comprimento mínimo da chave de assinatura do Paperless
  ansible.builtin.assert:
    that:
      - paperless_secret_key | length >= 32
    fail_msg: >-
      paperless_secret_key tem menos de 32 caracteres. Ela assina sessões e tokens
      de reset de senha do Django. Gere com `openssl rand -hex 32`.
    quiet: true
  when: "'paperless_secret_key' in required_secrets"
  no_log: true

- name: Exigir comprimento mínimo da senha de admin do Grafana
  ansible.builtin.assert:
    that:
      - grafana_admin_password | length >= 16
    fail_msg: >-
      grafana_admin_password tem menos de 16 caracteres.
      Sem essa var o Grafana sobe com o login admin/admin exposto pelo Traefik.
      Gere uma nova com `openssl rand -base64 32`.
    quiet: true
  when: "'grafana_admin_password' in required_secrets"
  no_log: true

- name: Exigir formato válido da chave pública SSH
  ansible.builtin.assert:
    that:
      - >-
        ssh_public_key.startswith('ssh-ed25519 AAAA')
        or ssh_public_key.startswith('ssh-rsa AAAA')
        or ssh_public_key.startswith('ssh-ecdsa AAAA')
      - ssh_public_key | length > 80
    fail_msg: >-
      ssh_public_key não parece uma chave pública SSH válida: precisa começar com
      "ssh-ed25519 AAAA", "ssh-rsa AAAA" ou "ssh-ecdsa AAAA" e ter mais de 80
      caracteres. O valor anterior em main.yml era um placeholder truncado que
      nunca instalou chave nenhuma.
    quiet: true
  when: "'ssh_public_key' in required_secrets"
  no_log: true

- name: Exigir que homelab_domain seja um domínio real, não um placeholder
  ansible.builtin.assert:
    that:
      - "'.' in homelab_domain"
      - not homelab_domain.startswith('TROCAR')
    fail_msg: >-
      homelab_domain inválido: precisa conter um ponto (domínio real) e não pode
      começar com "TROCAR" (placeholder de exemplo). Edite o Vault e defina o
      domínio real de produção.
    quiet: true
  when: "'homelab_domain' in required_secrets"
  no_log: true
