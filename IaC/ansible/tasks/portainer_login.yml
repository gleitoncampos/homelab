---
# Task reutilizável para autenticação na API do Portainer
#
# `portainer_admin_password` vem do Ansible Vault
# (inventories/<env>/group_vars/all/vault.yml).
# Não use `| default(...)` aqui: a task abaixo CRIA a conta de admin no primeiro
# boot, então um default transformaria "vault ausente" em "Portainer provisionado
# com senha pública". A presença da variável é validada nos `pre_tasks` do play
# via tasks/validate_vault.yml.
#
# `no_log: true` em toda task que carrega a senha ou o JWT: o ansible.cfg usa
# `stdout_callback = yaml`, que imprime o body completo da requisição em falha
# ou com -v.

- name: Tentar autenticação de admin na API do Portainer
  ansible.builtin.uri:
    url: "http://localhost:9000/api/auth"
    method: POST
    body_format: json
    body:
      username: "admin"
      password: "{{ portainer_admin_password }}"
    status_code: [200, 422, 400, 404]
  register: portainer_auth_try
  no_log: true

# Portainer 2.39+ sem admin só aceita o /api/users/admin/init com o
# X-Setup-Token que ele registra no log ao subir (`setup_token=...`); sem o
# cabeçalho o init falhava (13/10/2026). O restart abre janela de init nova (o
# Portainer a fecha minutos depois de subir) e gera token novo. Só roda sem
# admin — Portainer já inicializado não é tocado.
- name: Reiniciar o Portainer para abrir a janela de criação do admin
  ansible.builtin.command: docker service update --force --detach=false portainer_portainer
  when: portainer_auth_try.status != 200
  changed_when: true

- name: Aguardar a API do Portainer depois do restart
  ansible.builtin.uri:
    url: "http://localhost:9000/api/status"
    status_code: 200
  register: _portainer_pos_restart
  until: _portainer_pos_restart.status == 200
  retries: 24
  delay: 5
  when: portainer_auth_try.status != 200

# Log da TASK em execução, não do serviço: `docker service logs` do serviço
# mistura container antigo e novo sem garantir ordem, e o token antigo não vale.
- name: Ler o setup token do log do Portainer
  ansible.builtin.shell: |
    set -o pipefail
    tarefa=$(docker service ps portainer_portainer -q --filter desired-state=running | head -1)
    docker service logs --no-trunc --raw "$tarefa" 2>&1 \
      | sed -E 's/\x1b\[[0-9;]*m//g' | grep -oE 'setup_token=[^ ]+' | tail -1 | cut -d= -f2
  args:
    executable: /bin/bash
  register: _portainer_setup_token
  changed_when: false
  failed_when: _portainer_setup_token.stdout | length == 0
  when: portainer_auth_try.status != 200
  no_log: true

- name: Inicializar senha de admin se for o primeiro boot do Portainer
  ansible.builtin.uri:
    url: "http://localhost:9000/api/users/admin/init"
    method: POST
    headers:
      X-Setup-Token: "{{ _portainer_setup_token.stdout | default('') }}"
    body_format: json
    body:
      username: "admin"
      password: "{{ portainer_admin_password }}"
    status_code: [200, 409]
  when: portainer_auth_try.status != 200
  no_log: true

- name: Obter token JWT do Portainer
  ansible.builtin.uri:
    url: "http://localhost:9000/api/auth"
    method: POST
    body_format: json
    body:
      username: "admin"
      password: "{{ portainer_admin_password }}"
    status_code: 200
  register: portainer_login
  no_log: true

- name: Definir cabeçalho JWT de Autenticação
  ansible.builtin.set_fact:
    portainer_jwt: "{{ portainer_login.json.jwt }}"
    portainer_headers:
      Authorization: "Bearer {{ portainer_login.json.jwt }}"
  no_log: true

- name: Obter ID do Endpoint Swarm no Portainer
  ansible.builtin.uri:
    url: "http://localhost:9000/api/endpoints"
    method: GET
    headers: "{{ portainer_headers }}"
    status_code: 200
  register: portainer_endpoints

- name: Definir Endpoint ID do Swarm
  ansible.builtin.set_fact:
    endpoint_id: "{{ portainer_endpoints.json[0].Id }}"
