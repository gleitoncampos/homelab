---
# ==============================================================================
# node_exporter — métricas de sistema operacional do host
# ==============================================================================
# Task reutilizável. Hoje incluída por playbooks/00-proxmox-setup.yml.
#
# ⚠️ Pelo PACOTE do Debian, e não pelo binário do GitHub. A diferença não é de
# gosto — o NAS tem a versão manual, e o garimpo de 25/08/2026 mostrou o que ela
# custa: o binário foi baixado para /usr/local/bin com `wget`, ficou pertencendo
# ao usuário de compartilhamento Samba (que tem shell), e a unit escrita à mão o
# executa como root. Qualquer um que entre por aquele usuário troca o binário e
# ganha root no próximo restart do serviço.
#
# O pacote resolve os três de uma vez: binário de root, unit empacotada com as
# proteções de systemd que o mantenedor mantém, e execução sob o usuário
# `prometheus` sem privilégio. Some também o trabalho de fixar checksum e
# acompanhar release, que é o que a regra de versão fixada existe para evitar.
#
# ⚠️ Sem versão fixada, de propósito, pelo mesmo motivo dos plugins do OMV: a
# suíte da distribuição já limita a linha, e cravar o patch quebraria no
# primeiro `apt upgrade`. A regra de tag fixa do CLAUDE.md é sobre imagem
# Docker, não sobre pacote apt.

# ==============================================================================
# Remoção de instalação MANUAL pré-existente
# ==============================================================================
# ⚠️ Isto APAGA arquivo, e é o mecanismo, não um efeito colateral: enquanto a
# instalação manual existir, o pacote não consegue subir (os dois disputam a
# 9100) e a vulnerabilidade continua no ar.
#
# O caso real, confirmado ao vivo em 02/09/2026 no NAS:
#
#   796 root root /usr/local/bin/node_exporter          <- processo roda como ROOT
#   -rwxr-xr-x 1 smb 1002 /usr/local/bin/node_exporter  <- binário é do usuário SMB
#   node_exporterd.service: ExecStart=... (sem User=)
#   smb:x:1001:100::/home/smb:/usr/bin/sh               <- e o SMB tem shell
#
# Quem escrever como `smb` troca o binário e ganha root no próximo restart. Não
# precisa de exploit — é sobrescrever um arquivo que o dono pode sobrescrever.
#
# A ORDEM aqui não é negociável: para o serviço velho ANTES de instalar o
# pacote (senão a porta está ocupada e o pacote sobe morto), e remove os
# arquivos DEPOIS de o pacote estar de pé (senão uma falha do apt deixa o host
# sem coleta nenhuma).
- name: Detectar instalação manual do node_exporter
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/node_exporter
    - /etc/systemd/system/node_exporterd.service
  register: node_exporter_manual

- name: Parar e desabilitar o serviço da instalação manual
  ansible.builtin.systemd_service:
    name: node_exporterd
    enabled: false
    state: stopped
  when: node_exporter_manual.results[1].stat.exists

# `update_cache` aqui, e não só no playbook que inclui: esta task passou a ser
# endereçável por tag (`--tags node_exporter`), e nesse caminho a atualização de
# cache do playbook não roda. Sem isso o `apt` falharia com "No package matching"
# num host cujo cache esteja velho — e a mensagem manda investigar o pacote, não
# o cache. `cache_valid_time` evita repetir a atualização a cada execução.
- name: Instalar o node_exporter a partir do repositório da distribuição
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: node_exporter_pacote

# ⚠️ Em `--check` num host que ainda NÃO tem o pacote, a unidade não existe e
# esta task morre com "Could not find the requested service". Isso tornava o
# `--check` inútil como pré-voo justamente no caso que interessa — o host novo.
# A condição pula a task só nessa combinação: modo simulação E pacote que teria
# sido instalado agora. Com o pacote já presente, ela roda normalmente em check
# e continua reportando divergência de `enabled`/`state`.
- name: Garantir o node_exporter ativo e habilitado no boot
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: not (ansible_check_mode and node_exporter_pacote is changed)

# A verificação é contra a porta respondendo, e não contra o `state: started`
# da task acima. Um serviço pode estar "ativo" e não ter conseguido abrir a
# porta — e o sintoma disso, do outro lado, é um alvo em `up=0` no Prometheus
# que ninguém associa a este playbook.
# Só depois de o pacote estar servindo é que os arquivos antigos saem. Falha do
# apt acima aborta o play e deixa o host com a instalação velha — insegura, mas
# coletando — em vez de sem nada.
- name: Remover os arquivos da instalação manual
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/node_exporter
    - /etc/systemd/system/node_exporterd.service
  when: node_exporter_manual.results | selectattr('stat.exists') | list | length > 0

# ⚠️ INCONDICIONAL, e não `when: ... is changed`. Um handler seria o idiomático,
# mas handler declarado em arquivo incluído por `include_tasks` não é alcançável
# pelos playbooks que incluem — e a alternativa condicional é exatamente o que o
# `no-handler` do ansible-lint reprova. Recarregar o systemd é idempotente e
# barato; `changed_when: false` mantém o relatório honesto, porque a operação em
# si não altera estado nenhum quando não há unit nova ou removida.
- name: Recarregar o systemd depois de mexer em unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false

- name: Conferir que o node_exporter responde em 9100
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port | default(9100) }}/metrics"
    # `default(9100)` porque esta task passou a ser incluída por DOIS
    # playbooks e só o do Proxmox declarava a variável. 9100 é a porta
    # bem-conhecida do exporter, não identidade nem segredo — a regra de
    # "nunca reintroduza default" vale para valor que, errado, passa
    # despercebido; aqui um valor errado derruba a sonda na hora.
    return_content: false
    status_code: 200
  register: node_exporter_probe
  retries: 5
  delay: 3
  until: node_exporter_probe is succeeded
  when: not ansible_check_mode
