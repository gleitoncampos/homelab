---
# Regras na chain DOCKER-USER.
#
# Por que não UFW: o publish de porta do Docker faz DNAT em nat/PREROUTING, que
# roda ANTES da chain filter onde o UFW atua. Uma regra `ufw deny 9000` parece
# aplicada e não tem efeito nenhum sobre porta publicada — modo de falha
# silencioso, já documentado em docker/portainer/swarm/compose.yml:34-40.
#
# DOCKER-USER é a chain que o Docker cria e NÃO limpa entre reinícios, e é
# consultada antes das regras que ele gera. As regras moram no
# /etc/ufw/after.rules (templates/ufw_docker_user.rules.j2), que o UFW carrega
# no boot antes do dockerd. Antes eram gravadas pelo iptables-persistent, que
# conflita com o ufw no Debian: instalar um removia o outro (13/10/2026).
#
# Espera: `mgmt_allowed_cidrs` (LISTA; o `make bootstrap` gera em
# group_vars/all/99-local.yml). Lista porque o syslog vem do firewall e do NAS
# (VLAN 20) e do Proxmox (LAN), e o operador está na LAN: uma faixa só fechava
# a porta a alguém (13/10/2026).

- name: "Abortar se mgmt_allowed_cidrs não estiver definida"
  ansible.builtin.assert:
    that:
      - mgmt_allowed_cidrs is defined
      - mgmt_allowed_cidrs is not string
      - mgmt_allowed_cidrs | length > 0
    fail_msg: >-
      mgmt_allowed_cidrs não definida (ou não é lista). Sem ela estas regras
      bloqueariam TODO acesso às portas administrativas, inclusive o seu.
      Rode `make bootstrap`, que a gera em group_vars/all/99-local.yml.

# O iptables-persistent removia o ufw (conflito de pacote no Debian) e o
# reinstalar do ufw removia o iptables-persistent: gangorra a cada execução.
# Quem persiste agora é o UFW.
- name: Remover o iptables-persistent, que conflita com o ufw
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent

- name: Garantir o ufw (o iptables-persistent o removia)
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Gravar as regras DOCKER-USER no /etc/ufw/after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} homelab DOCKER-USER (Ansible: tasks/docker_user_rules.yml)"
    block: "{{ lookup('ansible.builtin.template', '../templates/ufw_docker_user.rules.j2') }}"
    insertafter: EOF
    backup: true
  register: _after_rules

# Não é handler de propósito: handler roda no fim do play, e a conferência
# logo abaixo precisa da chain JÁ recarregada.
- name: Recarregar o UFW para aplicar o DOCKER-USER  # noqa: no-handler
  ansible.builtin.command: ufw reload
  when: _after_rules is changed
  changed_when: true

# `ufw reload` sai 0 mesmo quando o after.rules tem linha que o
# iptables-restore recusa — o bloco some calado. A conferência é na chain
# carregada, não no arquivo.
- name: Ler a chain DOCKER-USER carregada
  ansible.builtin.command: iptables -S DOCKER-USER
  register: _docker_user
  changed_when: false

- name: Conferir que todo RETURN autorizado vem antes dos DROP
  vars:
    _linhas: "{{ _docker_user.stdout_lines | select('match', '^-A DOCKER-USER') | list }}"
    _drops: "{{ _linhas | select('search', '-j DROP$') | list }}"
    _rets: "{{ _linhas | select('search', '-j RETURN$') | list }}"
  ansible.builtin.assert:
    that:
      - _drops | length == 3
      - _rets | length == (mgmt_allowed_cidrs | length) * 3
      - _linhas.index(_drops[0]) > _linhas.index(_rets[-1])
    fail_msg: >-
      DOCKER-USER carregada fora do esperado ({{ _rets | length }} RETURN,
      {{ _drops | length }} DROP). Confira `iptables -S DOCKER-USER` e o bloco
      homelab no /etc/ufw/after.rules.
