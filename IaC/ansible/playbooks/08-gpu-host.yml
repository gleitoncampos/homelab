---
# =============================================================================
# 08 - hulk: servidor de GPU sob demanda
# =============================================================================
# Spec: Frentes/homelab/spec-2026-11-15-hulk-gpu-sob-demanda.md (fora do repo).
#
# FORA do site.yml DE PROPÓSITO: host sob demanda, aplicado explicitamente.
#   ansible-playbook playbooks/08-gpu-host.yml --limit gpu,homelab_managers
#
# FASES:
#   A (hulk ainda na VLAN 30, IP do DHCP): tudo, com gpu_rede_estatica=false.
#   B (migração para a VLAN 20): gpu_rede_estatica=true grava o netplan SEM
#     aplicar; a mudança de porta no switch e o reboot são manuais.
#   ⚠️ O Ansible nunca roda `netplan apply`: o IP novo cortaria a própria
#   conexão e, com a porta ainda na VLAN 30, deixaria o hulk inalcançável.
#
# ⚠️ O MAC (`gpu_mac`) vive só no 99-local.yml: o hook de commit barra MAC em
# arquivo versionado. Sem ele este play aborta.
# =============================================================================

- name: "08 - hulk: base, GPU, Docker, ferramentas e monitor de ociosidade"
  hosts: gpu
  become: true
  vars:
    gpu_netplan_arquivo: /etc/netplan/60-hulk.yaml
    gpu_netplan_teste: /tmp/hulk-netplan-root
  pre_tasks:
    # `always`: sem a tag, `--tags rede` (a rodada que grava o netplan) pulava
    # o assert do MAC e o vault.
    - name: Validar segredos do Vault exigidos por este play
      ansible.builtin.include_tasks: "../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - ssh_public_key
      tags: [always]

    - name: Exigir o MAC real, em minúsculas, e que ele seja de uma placa do hulk
      vars:
        _macs_do_host: >-
          {{ ansible_facts.interfaces | map('replace', '-', '_') | map('extract', ansible_facts)
             | selectattr('macaddress', 'defined') | map(attribute='macaddress') | list }}
      ansible.builtin.assert:
        that:
          - gpu_mac is defined
          - gpu_mac | lower == gpu_mac
          - gpu_mac is match('^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
          - gpu_mac in _macs_do_host
        fail_msg: >-
          gpu_mac ausente, fora do formato ou de nenhuma placa deste host.
          Defina o MAC real, em minúsculas, em group_vars/gpu/99-local.yml.
          WoL para MAC errado não dá erro: só nunca acorda nada, e um MAC
          errado no netplan deixa o hulk sem interface casada no reboot.
        quiet: true
      tags: [always]

    # O monitor de ociosidade desligaria o hulk no meio de um dpkg ou de um
    # `docker pull` (rede, CPU e GPU baixas). O lock vive em /run (tmpfs): se
    # a execução falhar, ele fica até o próximo boot — falha fechada, sem
    # desligamento. O monitor ainda o ignora depois de 4 h (TTL).
    - name: Segurar o desligamento por ociosidade durante a execução
      ansible.builtin.file:
        path: /run/hulk-keepalive
        state: touch
        mode: "0644"
      changed_when: false
      tags: [always]

  tasks:
    # --------------------------------------------------------------- base --
    - name: Atualizar o cache do APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [base]

    - name: Instalar pacotes base
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, ufw, unattended-upgrades, python3]
        state: present
      tags: [base]

    - name: Definir o hostname
      ansible.builtin.hostname:
        name: hulk
      tags: [base]

    - name: Instalar a chave pública do administrador
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ ssh_public_key }}"
      tags: [base]

    # Primeira execução precisa de `-K` (o usuário do instalador ainda pede
    # senha no sudo); depois deste drop-in, o Ansible não pede mais.
    - name: Sudo sem senha para o usuário de automação
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ansible
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [base]

    - name: Fechar o SSH para login por senha
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          PasswordAuthentication no
          PermitRootLogin no
          KbdInteractiveAuthentication no
        owner: root
        group: root
        mode: "0644"
      register: _sshd_conf
      tags: [base]

    - name: Recarregar o sshd  # noqa: no-handler
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when: _sshd_conf is changed
      tags: [base]

    - name: Conferir no sshd efetivo que a senha está fechada
      ansible.builtin.command: sshd -T
      register: _sshd_t
      changed_when: false
      failed_when: "'passwordauthentication no' not in _sshd_t.stdout"
      tags: [base]

    - name: Atualizações de segurança automáticas
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"
      tags: [base]

    # ----------------------------------------------------------- firewall --
    - name: Liberar o SSH só para os clientes autorizados
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ gpu_clientes_cidrs }}"
      tags: [base]

    - name: Ativar o UFW negando entrada por padrão
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
      tags: [base]

    # ---------------------------------------------------------------- GPU --
    - name: Instalar o driver NVIDIA open
      ansible.builtin.apt:
        name: "{{ gpu_driver_pkg }}"
        state: present
      register: _driver
      tags: [gpu]

    - name: Reiniciar para carregar o driver  # noqa: no-handler
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: _driver is changed
      tags: [gpu]

    - name: Conferir que o nvidia-smi enxerga a GPU
      ansible.builtin.command: nvidia-smi --query-gpu=name --format=csv,noheader
      register: _smi
      changed_when: false
      failed_when: "'5060' not in _smi.stdout"
      tags: [gpu]

    # ------------------------------------------------------------- Docker --
    - name: Instalar Docker e Compose do Ubuntu
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
      tags: [docker]

    - name: Colocar o usuário no grupo docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      tags: [docker]

    - name: Garantir o diretório de chaves do APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags: [docker]

    - name: Baixar a chave do repositório do nvidia-container-toolkit
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: "0644"
      tags: [docker]

    - name: Declarar o repositório do nvidia-container-toolkit
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.sources
        content: |
          Types: deb
          URIs: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
          Suites: /
          Signed-By: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: "0644"
      register: _repo_nv
      tags: [docker]

    - name: Atualizar o cache depois do repositório novo  # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
      when: _repo_nv is changed
      tags: [docker]

    - name: Instalar o nvidia-container-toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
      tags: [docker]

    - name: Registrar o runtime nvidia no Docker
      ansible.builtin.shell: |
        set -e
        grep -q '"nvidia"' /etc/docker/daemon.json 2>/dev/null && exit 0
        nvidia-ctk runtime configure --runtime=docker
        echo MUDOU
      args:
        executable: /bin/bash
      register: _nvctk
      changed_when: "'MUDOU' in _nvctk.stdout"
      tags: [docker]

    - name: Reiniciar o Docker  # noqa: no-handler
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when: _nvctk is changed
      tags: [docker]

    - name: Garantir o Docker ativo (o daemon sobe no boot; as stacks não, são restart "no")
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
      tags: [docker]

    - name: Provar a GPU dentro de um container
      ansible.builtin.command: >-
        docker run --rm --gpus all ubuntu:24.04 nvidia-smi --query-gpu=name --format=csv,noheader
      register: _smi_ct
      changed_when: false
      failed_when: "'5060' not in _smi_ct.stdout"
      tags: [docker]

    # ----------------------------------------------------------- ociosidade --
    - name: Instalar o script do monitor de ociosidade  # noqa: no-relative-paths
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/gpu/hulk-idle-check.py"
        dest: /usr/local/sbin/hulk-idle-check
        mode: "0755"
      tags: [idle]

    - name: Instalar a unit do monitor  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/gpu/hulk-idle.service.j2"
        dest: /etc/systemd/system/hulk-idle.service
        mode: "0644"
      tags: [idle]

    - name: Instalar o timer do monitor  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/gpu/hulk-idle.timer.j2"
        dest: /etc/systemd/system/hulk-idle.timer
        mode: "0644"
      tags: [idle]

    - name: Habilitar e iniciar o timer de ociosidade
      ansible.builtin.systemd:
        name: hulk-idle.timer
        state: started
        enabled: true
        daemon_reload: true
      tags: [idle]

    # -------------------------------------------------------- ferramentas --
    - name: Criar as pastas das ferramentas
      ansible.builtin.file:
        path: "{{ gpu_dir }}/{{ item.0 }}/{{ item.1 }}"
        state: directory
        mode: "0755"
      loop:
        - [ollama, dados]
        - [whisper, modelos]
      tags: [tools]

    - name: Copiar o compose de cada ferramenta para gpu_dir  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/gpu/{{ item }}.compose.yml.j2"
        dest: "{{ gpu_dir }}/{{ item }}/compose.yml"
        mode: "0644"
      loop: [ollama, whisper]
      tags: [tools]

    - name: Gravar as regras DOCKER-USER das ferramentas
      ansible.builtin.blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} homelab gpu DOCKER-USER (Ansible: 08-gpu-host.yml)"
        block: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/gpu/ufw_docker_user.rules.j2') }}"
        insertafter: EOF
        backup: true
      register: _after_gpu
      tags: [tools]

    - name: Recarregar o UFW para valer a DOCKER-USER  # noqa: no-handler
      ansible.builtin.command: ufw reload
      when: _after_gpu is changed
      changed_when: true
      tags: [tools]

    # Sem pré-pull o primeiro `docker compose up` baixa GBs com CPU e GPU
    # ociosas, e o monitor desligaria o hulk no meio.
    - name: Baixar as imagens das ferramentas
      ansible.builtin.command: docker pull {{ item.value.image }}
      loop: "{{ gpu_ferramentas | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: _pull
      changed_when: "'Downloaded newer image' in _pull.stdout"
      tags: [tools]

    # `ufw reload` sai 0 mesmo quando o after.rules tem linha que o
    # iptables-restore recusa: o bloco some calado e as portas, sem
    # autenticação, ficam abertas. A conferência é na chain carregada.
    - name: Ler a chain DOCKER-USER carregada
      ansible.builtin.command: iptables -S DOCKER-USER
      register: _docker_user
      changed_when: false
      tags: [tools]

    - name: Conferir a DOCKER-USER carregada (RETURN dos clientes antes de todo DROP)
      vars:
        _linhas: "{{ _docker_user.stdout_lines | select('match', '^-A DOCKER-USER') | list }}"
        _drops: "{{ _linhas | select('search', '-j DROP$') | list }}"
        _rets: "{{ _linhas | select('search', '-j RETURN$') | list }}"
      ansible.builtin.assert:
        that:
          - _drops | length == gpu_ferramentas | length
          - _rets | length == (gpu_clientes_cidrs | length) * (gpu_ferramentas | length)
          - _linhas.index(_drops[0]) > _linhas.index(_rets[-1])
        fail_msg: >-
          DOCKER-USER carregada fora do esperado ({{ _rets | length }} RETURN,
          {{ _drops | length }} DROP). Confira `iptables -S DOCKER-USER` e o
          bloco homelab gpu no /etc/ufw/after.rules.
        quiet: true
      tags: [tools]

    # --------------------------------------------------------------- rede --
    # ⚠️ Fica DEPOIS do reboot do driver de propósito: gravar o IP da VLAN 20 e
    # reiniciar com a porta ainda na VLAN 30 deixa o hulk sem rede (só console).
    # Valida num diretório de teste ANTES de gravar em /etc/netplan: netplan
    # inválido gravado só estoura no próximo boot, com o hulk já sem rede.
    - name: Criar a árvore de teste do netplan
      ansible.builtin.file:
        path: "{{ gpu_netplan_teste }}/etc/netplan"
        state: directory
        mode: "0700"
      changed_when: false
      tags: [rede]

    - name: Renderizar o netplan estático na árvore de teste  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/gpu/netplan.yaml.j2"
        dest: "{{ gpu_netplan_teste }}/etc/netplan/60-hulk.yaml"
        mode: "0600"
      changed_when: false
      tags: [rede]

    - name: Validar o netplan com netplan generate (sem aplicar)
      ansible.builtin.command: netplan generate --root-dir {{ gpu_netplan_teste }}
      changed_when: false
      tags: [rede]

    - name: Gravar o netplan estático do hulk  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/gpu/netplan.yaml.j2"
        dest: "{{ gpu_netplan_arquivo }}"
        owner: root
        group: root
        mode: "0600"
      when: gpu_rede_estatica | bool
      register: _netplan
      tags: [rede]

    - name: Impedir o cloud-init de regenerar a rede
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"
        mode: "0644"
      when: gpu_rede_estatica | bool
      tags: [rede]

    - name: Listar os outros arquivos de netplan (instalador e cloud-init)
      ansible.builtin.find:
        paths: /etc/netplan
        patterns: "*.yaml"
        excludes: ["60-hulk.yaml"]
      register: _netplan_outros
      when: gpu_rede_estatica | bool
      tags: [rede]

    - name: Remover os outros netplans (DHCP do instalador somaria ao estático)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _netplan_outros.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when: gpu_rede_estatica | bool
      tags: [rede]

    - name: Avisar que a rede foi gravada e NÃO aplicada  # noqa: no-handler
      ansible.builtin.debug:
        msg: >-
          Netplan gravado em {{ gpu_netplan_arquivo }} e NÃO aplicado. Passo
          manual, NESTA ordem: reiniciar o hulk por SSH e, durante o boot,
          mover a porta do switch para access VLAN 20 (com a porta já movida
          o IP de DHCP deixa de existir e o SSH não conecta para o reboot).
      when: _netplan is changed
      tags: [rede]

  post_tasks:
    - name: Liberar o desligamento por ociosidade
      ansible.builtin.file:
        path: /run/hulk-keepalive
        state: absent
      changed_when: false
      tags: [always]

- name: "08 - node1: script para acordar o hulk"
  hosts: homelab_managers[0]
  become: true
  pre_tasks:
    - name: Abortar se o hulk não está no inventário
      ansible.builtin.assert:
        that: "'hulk' in groups['gpu']"
        fail_msg: "hulk fora do grupo gpu: sem MAC e IP não há como acordá-lo."
        quiet: true

  tasks:
    - name: Instalar wakeonlan e netcat
      ansible.builtin.apt:
        name: [wakeonlan, netcat-openbsd]
        state: present

    - name: Instalar o hulk-wake  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/gpu/hulk-wake.sh.j2"
        dest: /usr/local/bin/hulk-wake
        mode: "0755"
