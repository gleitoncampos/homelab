---
# Cria o usuário, a role e o token de API que o Terraform usa — em cada nó.
#
# Por que existe: era o maior passo manual do fluxo de instalação. Cinco
# comandos `pveum` digitados em DOIS shells diferentes (os hipervisores são
# independentes, não há cluster), e quatro segredos transcritos à mão da saída
# do terminal para um arquivo. O único credencial que isto pressupõe é o acesso
# root por SSH que o instalador do Proxmox já deixou pronto.
#
# ⚠️ ESTE playbook é o dono dos quatro tokens. O `make bootstrap` NÃO os
# pergunta mais: dois lugares gerando o mesmo segredo é a falha de "duas
# verdades" que os comentários do 06-backup.yml descrevem. A divisão é por
# arquivo — o bootstrap escreve `terraform.tfvars` (IPs, nomes, chave SSH), e
# este playbook escreve `tokens.auto.tfvars`, que o Terraform carrega sozinho
# por causa do sufixo `.auto.tfvars`. Nenhum dos dois toca o arquivo do outro.
#
#   ansible-playbook playbooks/00-proxmox-api-token.yml
- name: "00 - Usuário, role e token de API do Proxmox para o Terraform"
  hosts: proxmox
  # root direto: este playbook roda ANTES de existir qualquer outra credencial.
  # É o mesmo contrato do 00-node-bootstrap.yml.
  remote_user: root
  become: false
  gather_facts: false

  vars:
    tf_user: terraform@pve
    tf_token: terraform
    tf_role: TerraformProvisioner
    # Privilégios mínimos para criar e gerenciar VMs e CTs. NÃO é
    # `Administrator`: uma role embutida com tudo derrota o propósito de ter um
    # usuário dedicado. Se faltar algum, acrescente aqui — nunca troque a role.
    #
    # Os sete do fim, cada um exigido por um endpoint que o plano usa (PVE 9):
    # Sys.AccessNetwork e Datastore.AllocateTemplate — query-url-metadata e
    # download-url (ISO e templates); VM.Config.Cloudinit — ip_config e chave
    # SSH da VM do NAS; VM.GuestAgent.Audit — o provider lê o IP pelo agente;
    # Mapping.Use — hostpci só é permitido fora do root via PCI mapping;
    # VM.Audit — ler o status da VM recém-criada (sem ele o apply cria a VM e
    # falha em seguida, deixando-a `tainted` no state); Datastore.Audit — o
    # refresh lê o disco da VM no storage (local-lvm) e para em 403 sem ele.
    tf_privs: >-
      VM.Allocate VM.Config.Disk VM.Config.CPU VM.Config.Memory
      VM.Config.Network VM.Config.Options VM.Config.CDROM VM.Config.HWType
      VM.PowerMgmt VM.Console Datastore.AllocateSpace SDN.Use Sys.Audit
      Sys.AccessNetwork Datastore.AllocateTemplate VM.Config.Cloudinit
      VM.GuestAgent.Audit Mapping.Use VM.Audit Datastore.Audit
    # Escopo restrito — nunca a raiz "/". /nodes é onde o PVE checa
    # Sys.AccessNetwork; /mapping/pci, onde checa Mapping.Use.
    tf_acl_paths:
      - /vms
      - /storage
      - /sdn
      - /nodes
      - /mapping/pci
    # Os nomes são o contrato com o Terraform (`mapping =` nos blocos hostpci
    # de main.tf). Cada endereço vem da linha do nó no hosts.ini, escrito pelo
    # bootstrap; nó sem a variável não cria aquele mapping.
    tf_pci_mappings:
      - {name: opnsense-wan, path: "{{ opnsense_wan_pci_id | default('') }}"}
      - {name: opnsense-wan2, path: "{{ opnsense_wan2_pci_id | default('') }}"}
      - {name: omv-hba, path: "{{ omv_hba_pci_id | default('') }}"}

  tasks:
    # Listar-e-condicionar em vez de criar-e-engolir-o-erro. `ignore_errors`
    # aqui esconderia falha real de permissão junto com o "já existe", e o
    # CLAUDE.md só o admite quando a falha é esperada por definição.
    - name: Levantar as roles existentes
      ansible.builtin.command: "pveum role list --output-format json"
      register: pve_roles
      changed_when: false
      check_mode: false

    - name: "Criar a role de privilégio mínimo {{ tf_role }}"
      ansible.builtin.command: "pveum role add {{ tf_role }} -privs '{{ tf_privs }}'"
      when: tf_role not in (pve_roles.stdout | from_json | map(attribute='roleid') | list)
      changed_when: true

    # A role já pode existir de uma execução anterior com outra lista de
    # privilégios. `role modify` reconcilia contra o declarado aqui, que é o
    # comportamento que o repositório espera de qualquer recurso: o arquivo
    # manda, não o que está na máquina.
    - name: "Reconciliar os privilégios da role {{ tf_role }}"
      ansible.builtin.command: "pveum role modify {{ tf_role }} -privs '{{ tf_privs }}'"
      when: tf_role in (pve_roles.stdout | from_json | map(attribute='roleid') | list)
      changed_when: true

    - name: Levantar os usuários existentes
      ansible.builtin.command: "pveum user list --output-format json"
      register: pve_users
      changed_when: false
      check_mode: false

    - name: "Criar o usuário {{ tf_user }}"
      ansible.builtin.command: >-
        pveum user add {{ tf_user }} --comment 'Terraform IaC - menor privilégio'
      when: tf_user not in (pve_users.stdout | from_json | map(attribute='userid') | list)
      changed_when: true

    - name: Aplicar a role ao usuário nos escopos necessários
      ansible.builtin.command: "pveum aclmod {{ item }} -user {{ tf_user }} -role {{ tf_role }}"
      loop: "{{ tf_acl_paths }}"
      changed_when: true

    # hostpci com endereço cru só é aceito do root@pam ("only root can set
    # 'hostpciN' config for non-mapped devices", PVE::API2::Qemu). O token passa
    # pelo mapping, com Mapping.Use. Criar o mapping exige root — daqui.
    - name: Exigir endereço PCI completo (domínio:barramento:dispositivo.função)
      ansible.builtin.assert:
        that: item.path is match('^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\\.[0-7]$')
        fail_msg: >-
          {{ item.name }}: endereço "{{ item.path }}" fora do formato
          0000:05:00.0 (o sysfs não aceita a forma curta 0000:05:00).
        quiet: true
      loop: "{{ tf_pci_mappings | selectattr('path') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Descrever cada dispositivo PCI deste nó no formato de mapping
      ansible.builtin.shell: |
        set -euo pipefail
        d=/sys/bus/pci/devices/{{ item.path }}
        hex() { sed 's/^0x//' "$1"; }
        printf 'node=%s,path=%s,id=%s:%s,subsystem-id=%s:%s,iommugroup=%s\n' \
          "$(hostname)" "{{ item.path }}" "$(hex $d/vendor)" "$(hex $d/device)" \
          "$(hex $d/subsystem_vendor)" "$(hex $d/subsystem_device)" \
          "$(basename "$(readlink -f $d/iommu_group)")"
      args:
        executable: /bin/bash
      loop: "{{ tf_pci_mappings | selectattr('path') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: pci_maps
      changed_when: false
      check_mode: false

    - name: Levantar os mappings PCI existentes
      ansible.builtin.command: "pvesh get /cluster/mapping/pci --output-format json"
      register: pve_pci_maps
      changed_when: false
      check_mode: false

    - name: Criar ou reconciliar o mapping PCI
      ansible.builtin.command: >-
        pvesh {{ 'set /cluster/mapping/pci/' ~ item.item.name
                 if item.item.name in (pve_pci_maps.stdout | from_json | map(attribute='id') | list)
                 else 'create /cluster/mapping/pci --id ' ~ item.item.name }}
        --map '{{ item.stdout }}'
      loop: "{{ pci_maps.results }}"
      loop_control:
        label: "{{ item.item.name }} → {{ item.stdout }}"
      changed_when: true

    - name: Levantar os tokens já existentes do usuário
      ansible.builtin.command: "pveum user token list {{ tf_user }} --output-format json"
      register: pve_tokens
      changed_when: false
      check_mode: false

    # ⚠️ O valor do token é exibido UMA vez, na criação, e o Proxmox não tem
    # como devolvê-lo depois. Por isso a task é create-only: se o token já
    # existe, este playbook não consegue recuperá-lo, e reescrever o
    # tokens.auto.tfvars com vazio seria destruir a credencial em uso. Rotação
    # é explícita — ver o assert logo abaixo.
    - name: "Criar o token de API com privsep ligado: {{ tf_token }}"
      ansible.builtin.command: >-
        pveum user token add {{ tf_user }} {{ tf_token }} --privsep 1 --output-format json
      when: tf_token not in (pve_tokens.stdout | from_json | map(attribute='tokenid') | list)
      register: token_criado
      changed_when: true
      no_log: true

    # ⚠️ Com privsep=1 o token NÃO herda as ACLs do usuário: o efetivo é a
    # interseção das duas. Só a do usuário deixava o token com `{}` em todo
    # caminho (`pveum user token permissions`), e o primeiro `terraform apply`
    # morria em "Permission check failed". Depois da criação: aclmod -token
    # exige o token existente.
    - name: Aplicar a role ao token nos mesmos escopos
      ansible.builtin.command: >-
        pveum aclmod {{ item }} -token '{{ tf_user }}!{{ tf_token }}' -role {{ tf_role }}
      loop: "{{ tf_acl_paths }}"
      changed_when: true

    - name: Ver se o tokens.auto.tfvars já existe na máquina de controle
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../terraform/proxmox/tokens.auto.tfvars"
      register: tokens_tfvars
      delegate_to: localhost
      become: false
      run_once: true

    - name: Guardar o par id/segredo deste nó
      ansible.builtin.set_fact:
        tf_token_id: "{{ tf_user }}!{{ tf_token }}"
        tf_token_secret: "{{ (token_criado.stdout | from_json).value if not token_criado is skipped else '' }}"
      no_log: true

    # O token existia, nós não temos o segredo E o arquivo não está aqui: aí
    # falhar é o certo. Com o arquivo presente, reexecutar é o caminho normal
    # para reconciliar role e ACLs, e o arquivo simplesmente não é reescrito.
    - name: "Abortar se o token já existe e o segredo não está mais disponível"
      ansible.builtin.assert:
        that: tf_token_secret | length > 0 or tokens_tfvars.stat.exists
        fail_msg: >-
          O token {{ tf_user }}!{{ tf_token }} já existe neste nó, e o Proxmox
          só exibe o segredo no momento da criação. Se o
          tokens.auto.tfvars foi perdido, rotacione:
          `pveum user token remove {{ tf_user }} {{ tf_token }}` neste nó e rode
          este playbook de novo. Se o arquivo existe e está correto, não há
          nada a fazer aqui.
      when: tf_token_secret | length == 0

    # Um nó com token novo e o outro sem: escrever o arquivo apagaria o
    # segredo do segundo. Ou os dois foram criados agora, ou nenhum.
    - name: Abortar se só parte dos nós gerou token novo
      ansible.builtin.assert:
        that: >-
          (ansible_play_hosts | map('extract', hostvars, 'tf_token_secret') | select | list | length)
          in [0, ansible_play_hosts | length]
        fail_msg: >-
          Só parte dos nós gerou token novo nesta execução. Rotacione em todos
          (`pveum user token remove {{ tf_user }} {{ tf_token }}`) e rode de novo.
      run_once: true

    # Um arquivo só, escrito a partir dos fatos dos DOIS nós — daí o
    # `run_once` com `delegate_to`. Aqui ele é correto (ao contrário do que
    # estava no 06-backup.yml): o alvo é a máquina de controle, não um nó.
    - name: Escrever os tokens no tokens.auto.tfvars
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/terraform/tokens.auto.tfvars.j2"  # noqa: no-relative-paths
        dest: "{{ playbook_dir }}/../../terraform/proxmox/tokens.auto.tfvars"
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      when: tf_token_secret | length > 0

    - name: Confirmar
      ansible.builtin.debug:
        msg: >-
          🔑 Token de API pronto em {{ inventory_hostname }}
          ({{ tf_user }}!{{ tf_token }}, privsep=1, role {{ tf_role }}).
          {{ 'Os segredos foram escritos em' if tf_token_secret | length > 0
             else 'Token já existia; role e ACLs reconciliadas, sem tocar em' }}
          IaC/terraform/proxmox/tokens.auto.tfvars (0600, gitignorado).
