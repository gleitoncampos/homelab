---
# Cria o usuário, a role e o token de API que o Terraform usa — em cada nó.
#
# Por que existe: era o maior passo manual do fluxo de instalação. Cinco
# comandos `pveum` digitados em DOIS shells diferentes (os hipervisores são
# independentes, não há cluster), e quatro segredos transcritos à mão da saída
# do terminal para um arquivo. O único credencial que isto pressupõe é o acesso
# root por SSH que o instalador do Proxmox já deixou pronto.
#
# ⚠️ ESTE playbook é o dono dos quatro tokens. O `make bootstrap` NÃO os
# pergunta mais: dois lugares gerando o mesmo segredo é a falha de "duas
# verdades" que os comentários do 06-backup.yml descrevem. A divisão é por
# arquivo — o bootstrap escreve `terraform.tfvars` (IPs, nomes, chave SSH), e
# este playbook escreve `tokens.auto.tfvars`, que o Terraform carrega sozinho
# por causa do sufixo `.auto.tfvars`. Nenhum dos dois toca o arquivo do outro.
#
#   ansible-playbook playbooks/00-proxmox-api-token.yml
- name: "00 - Usuário, role e token de API do Proxmox para o Terraform"
  hosts: proxmox
  # root direto: este playbook roda ANTES de existir qualquer outra credencial.
  # É o mesmo contrato do 00-node-bootstrap.yml.
  remote_user: root
  become: false
  gather_facts: false

  vars:
    tf_user: terraform@pve
    tf_token: terraform
    tf_role: TerraformProvisioner
    # Privilégios mínimos para criar e gerenciar VMs e CTs. NÃO é
    # `Administrator`: uma role embutida com tudo derrota o propósito de ter um
    # usuário dedicado. Se faltar algum, acrescente aqui — nunca troque a role.
    tf_privs: >-
      VM.Allocate VM.Config.Disk VM.Config.CPU VM.Config.Memory
      VM.Config.Network VM.Config.Options VM.Config.CDROM VM.Config.HWType
      VM.PowerMgmt VM.Console Datastore.AllocateSpace SDN.Use Sys.Audit

  tasks:
    # Listar-e-condicionar em vez de criar-e-engolir-o-erro. `ignore_errors`
    # aqui esconderia falha real de permissão junto com o "já existe", e o
    # CLAUDE.md só o admite quando a falha é esperada por definição.
    - name: Levantar as roles existentes
      ansible.builtin.command: "pveum role list --output-format json"
      register: pve_roles
      changed_when: false
      check_mode: false

    - name: "Criar a role de privilégio mínimo {{ tf_role }}"
      ansible.builtin.command: "pveum role add {{ tf_role }} -privs '{{ tf_privs }}'"
      when: tf_role not in (pve_roles.stdout | from_json | map(attribute='roleid') | list)
      changed_when: true

    # A role já pode existir de uma execução anterior com outra lista de
    # privilégios. `role modify` reconcilia contra o declarado aqui, que é o
    # comportamento que o repositório espera de qualquer recurso: o arquivo
    # manda, não o que está na máquina.
    - name: "Reconciliar os privilégios da role {{ tf_role }}"
      ansible.builtin.command: "pveum role modify {{ tf_role }} -privs '{{ tf_privs }}'"
      when: tf_role in (pve_roles.stdout | from_json | map(attribute='roleid') | list)
      changed_when: true

    - name: Levantar os usuários existentes
      ansible.builtin.command: "pveum user list --output-format json"
      register: pve_users
      changed_when: false
      check_mode: false

    - name: "Criar o usuário {{ tf_user }}"
      ansible.builtin.command: >-
        pveum user add {{ tf_user }} --comment 'Terraform IaC - menor privilégio'
      when: tf_user not in (pve_users.stdout | from_json | map(attribute='userid') | list)
      changed_when: true

    # Escopo restrito: /vms, /storage e /sdn — nunca a raiz "/".
    - name: Aplicar a role nos escopos necessários
      ansible.builtin.command: "pveum aclmod {{ item }} -user {{ tf_user }} -role {{ tf_role }}"
      loop:
        - /vms
        - /storage
        - /sdn
      changed_when: true

    - name: Levantar os tokens já existentes do usuário
      ansible.builtin.command: "pveum user token list {{ tf_user }} --output-format json"
      register: pve_tokens
      changed_when: false
      check_mode: false

    # ⚠️ O valor do token é exibido UMA vez, na criação, e o Proxmox não tem
    # como devolvê-lo depois. Por isso a task é create-only: se o token já
    # existe, este playbook não consegue recuperá-lo, e reescrever o
    # tokens.auto.tfvars com vazio seria destruir a credencial em uso. Rotação
    # é explícita — ver o assert logo abaixo.
    - name: "Criar o token de API com privsep ligado: {{ tf_token }}"
      ansible.builtin.command: >-
        pveum user token add {{ tf_user }} {{ tf_token }} --privsep 1 --output-format json
      when: tf_token not in (pve_tokens.stdout | from_json | map(attribute='tokenid') | list)
      register: token_criado
      changed_when: true
      no_log: true

    - name: Guardar o par id/segredo deste nó
      ansible.builtin.set_fact:
        tf_token_id: "{{ tf_user }}!{{ tf_token }}"
        tf_token_secret: "{{ (token_criado.stdout | from_json).value if not token_criado is skipped else '' }}"
      no_log: true

    # O token existia e nós não temos o segredo. Falhar é o certo: seguir em
    # frente escreveria uma string vazia por cima de uma credencial que está
    # funcionando, e o `terraform plan` erraria em "401 authentication failure"
    # sem qualquer pista de que a causa foi este playbook.
    - name: "Abortar se o token já existe e o segredo não está mais disponível"
      ansible.builtin.assert:
        that: tf_token_secret | length > 0
        fail_msg: >-
          O token {{ tf_user }}!{{ tf_token }} já existe neste nó, e o Proxmox
          só exibe o segredo no momento da criação. Se o
          tokens.auto.tfvars foi perdido, rotacione:
          `pveum user token remove {{ tf_user }} {{ tf_token }}` neste nó e rode
          este playbook de novo. Se o arquivo existe e está correto, não há
          nada a fazer aqui.
      when: tf_token_secret | length == 0

    # Um arquivo só, escrito a partir dos fatos dos DOIS nós — daí o
    # `run_once` com `delegate_to`. Aqui ele é correto (ao contrário do que
    # estava no 06-backup.yml): o alvo é a máquina de controle, não um nó.
    - name: Escrever os tokens no tokens.auto.tfvars
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/terraform/tokens.auto.tfvars.j2"  # noqa: no-relative-paths
        dest: "{{ playbook_dir }}/../../terraform/proxmox/tokens.auto.tfvars"
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: Confirmar
      ansible.builtin.debug:
        msg: >-
          🔑 Token de API pronto em {{ inventory_hostname }}
          ({{ tf_user }}!{{ tf_token }}, privsep=1, role {{ tf_role }}).
          Os segredos foram escritos em
          IaC/terraform/proxmox/tokens.auto.tfvars (0600, gitignorado).
