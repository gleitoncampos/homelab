---
- name: "00 - Proxmox VE Host Setup, Hardening, Performance Enterprise e Exportação de Configurações"
  hosts: proxmox
  become: true
  # Handler notificado antes de uma falha some: a task que notificou já
  # reporta `ok` na reexecução. Assim o `update-grub` ficou pendente em
  # 12/10/2026 — /etc/default/grub com o IOMMU, grub.cfg sem, e o reboot
  # subiria sem IOMMU sem nada acusar.
  force_handlers: true

  vars:
    # Suíte Debian da versão alvo do Proxmox VE: PVE 9 roda sobre Debian 13
    # (trixie). Parametrizado para que o próximo salto de versão seja uma linha
    # só, e não uma caçada a literais espalhados pelas tasks de repositório.
    proxmox_debian_suite: trixie
    # Porta do node_exporter. Parametrizada porque o job do Prometheus em
    # docker/monitoring/swarm/prometheus.yml.j2 precisa concordar com ela.
    node_exporter_port: 9100

  pre_tasks:
    - name: Validar segredos do Vault exigidos por este play
      ansible.builtin.include_tasks: "../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - ssh_public_key
          - proxmox_alert_email
          - proxmox_backup_share_password

    # ------------------------------------------------------------------
    # Detecção das dependências externas
    # ------------------------------------------------------------------
    # Três coisas que este playbook configura dependem de equipamentos que
    # podem não existir ainda numa instalação do zero:
    #
    #   /etc/pve/storage.cfg      -> precisa do NAS (share CIFS de backup)
    #   /etc/network/interfaces   -> precisa do firewall (é o gateway)
    #   systemd-resolved desligado-> precisa do firewall (passa a ser o DNS)
    #
    # Em vez de exigir do operador uma ordem de execução decorada, cada bloco
    # dependente é DETECTADO e ADIADO quando a dependência não responde. O
    # resumo no fim do play diz exatamente o que ficou para trás. Rodar o mesmo
    # playbook de novo, com tudo no ar, aplica o que faltou — ele é idempotente
    # por construção, então não existe "segunda parte" a lembrar.
    #
    # ⚠️ O que NÃO se faz aqui: pular em silêncio. Foi assim que 53 falhas
    # ficaram escondidas atrás de `ignore_errors` nesta base. Um bloco adiado
    # é ruidoso por obrigação — ver a última task deste play.
    - name: "Detectar se o NAS responde (decide se o storage de backup entra nesta execução)"
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['omv'][0]].ansible_host }}"
        port: 445
        timeout: 5
      when: groups['omv'] | default([]) | length > 0
      register: nas_probe
      failed_when: false
      changed_when: false
      # `wait_for` declara `check_mode: support none`, então em `--check` ele é
      # PULADO — e a sonda pulada não devolve `state`, o que marcaria as duas
      # dependências como ausentes. O efeito seria pior que inútil: um
      # `--check --diff`, que é justamente como se revisa a mudança mais
      # perigosa deste playbook, reportaria a rede e o storage como "skipping"
      # e mostraria um diff limpo — logo antes de a execução real reescrever
      # /etc/network/interfaces. A sonda só lê uma porta; rodá-la em check mode
      # não altera nada.
      check_mode: false

    - name: "Detectar se o firewall responde (decide se rede e DNS entram nesta execução)"
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['opnsense'][0]].ansible_host }}"
        port: 443
        timeout: 5
      when: groups['opnsense'] | default([]) | length > 0
      register: firewall_probe
      failed_when: false
      changed_when: false
      check_mode: false   # mesmo motivo da sonda acima

    # `wait_for` só devolve `state: started` quando a porta de fato abriu. Com
    # `failed_when: false` o campo `failed` deixa de servir como sinal, e a
    # task pulada (grupo vazio no inventário) não devolve campo nenhum — daí o
    # `default('')`, que cobre os dois casos sem tratar ausência como sucesso.
    - name: Consolidar quais blocos dependentes entram nesta execução
      ansible.builtin.set_fact:
        nas_disponivel: "{{ (nas_probe.state | default('')) == 'started' }}"
        firewall_disponivel: "{{ (firewall_probe.state | default('')) == 'started' }}"

    # As duas alimentam `templates/proxmox/proxmox_storage.j2`, que este play
    # escreve por cima de /etc/pve/storage.cfg. Sem assert, uma variável
    # ausente vira string vazia no arquivo renderizado: o storage do NAS sai
    # com id vazio ou share vazio, o Proxmox deixa de enxergar o destino de
    # backup, e o vzdump falha toda noite — longe daqui, e sem que este
    # playbook tenha reportado erro nenhum.
    #
    # O assert é condicionado à presença do NAS, não removido: NAS ausente é
    # dependência que ainda não existe, e vira adiamento; NAS presente com
    # variável faltando é erro de configuração, e continua abortando na hora.
    - name: "Abortar se o NAS existe mas as variáveis do storage de backup não estão no inventário"
      ansible.builtin.assert:
        that:
          - backup_storage is defined
          - backup_storage | string | length > 0
          - proxmox_backup_share is defined
          - proxmox_backup_share | string | length > 0
        fail_msg: >-
          backup_storage e/ou proxmox_backup_share não estão definidos.
          `backup_storage` é o ID do storage no Proxmox (o nome que
          `pvesm status` mostra) e precisa ser o MESMO valor usado por
          playbooks/06-backup.yml — este play escreve o storage.cfg com ele, e
          o outro agenda o vzdump contra ele. `proxmox_backup_share` é o nome
          do compartilhamento CIFS no NAS (campo `share`). Defina os dois em
          [all:vars] no hosts.ini do ambiente — ver hosts.ini.example.
      when: nas_disponivel

    # `proxmox_gateway_ip` NÃO tem default, e não deriva de `vlans`: essa
    # variável vive em `group_vars/network/`, que só se aplica aos hosts do
    # grupo `network` (opnsense, openwrt). Um host do grupo `proxmox` nunca a
    # enxerga — o template de interfaces referenciava `vlans` e teria falhado
    # com "'vlans' is undefined" na primeira execução real contra um
    # hipervisor. Ver `hosts.ini.example`, seção [all:vars].
    - name: "Abortar se o firewall existe mas proxmox_gateway_ip não está no inventário"
      ansible.builtin.assert:
        that:
          - proxmox_gateway_ip is defined
          - proxmox_gateway_ip | string | length > 0
        fail_msg: >-
          proxmox_gateway_ip não está definido. É o IP do firewall na rede de
          gerência — o gateway que este play escreve em
          /etc/network/interfaces. Defina em [all:vars] no hosts.ini do
          ambiente (o `make bootstrap` já o preenche), ou remova o host do
          grupo [opnsense] se o firewall ainda não existir.
      when: firewall_disponivel

    # Redundância defensiva contra o host REAL, no momento do apply — a mesma
    # invariante que o teste de render `render_proxmox_ifaces.py` checa na CI
    # (sem host), aqui checada contra os facts do hipervisor. A deliberada
    # duplicação existe porque os dois pegam falhas diferentes: o render pega
    # divergência nas fixtures/template antes do merge; este assert pega o caso
    # em que o valor de `proxmox_gateway_ip` do inventário do ambiente cai em
    # /24 diferente do `ansible_host` deste nó específico.
    #
    # ⚠️ Sem este gate, o template escreveria em /etc/network/interfaces um
    # `gateway` fora da /24 do `address`. Este playbook não recarrega a rede: a
    # rota default só é montada quando a rede subir — no próximo reboot, ou num
    # `systemctl restart networking`. Aí o kernel recusa a rota (gateway
    # inalcançável pela interface), o acesso remoto ao hipervisor cai, e a
    # recuperação passa a ser só por console físico ou IPMI (Req 5.3, 5.4).
    #
    # A comparação é por 3 octetos e vale APENAS para /24 — por isso o `that:`
    # também exige `proxmox_lan_prefix == 24`. Com /25 dois endereços podem ter
    # os mesmos 3 octetos e ainda cair em sub-redes diferentes (falso negativo,
    # o gate viraria no-op); com /16 o oposto (falso positivo). Suportar outro
    # prefixo exige recalcular a rede de verdade (ansible.utils.ipaddr), que
    # este repositório evita depender aqui — logo, prefixo != 24 FALHA ALTO em
    # vez de desarmar o gate em silêncio.
    #
    # O `.split('/')[0]` remove um único sufixo /prefixo simples de
    # `ansible_host` (ex.: "203.0.113.10/24" -> "203.0.113.10"); não pretende
    # cobrir valor malformado.
    #
    # ⚠️ `proxmox_gateway_ip` tem que ser um IP PURO, sem /prefixo. O template
    # escreve `gateway {{ proxmox_gateway_ip }}` cru numa stanza
    # `iface ... inet static` do Debian, onde o gateway não leva prefixo — o
    # prefixo da rede vem de `proxmox_lan_prefix`, aplicado só ao `address`. Um
    # valor "192.0.2.1/24" passaria pelo `.split('/')[0]` da comparação de
    # octetos acima (o assert aprovaria), mas viraria `gateway 192.0.2.1/24`
    # literal em /etc/network/interfaces — valor inválido, vmbr0 sobe SEM rota
    # default no reboot. É a mesma classe de lockout que este gate existe para
    # impedir, por isso o `/` é rejeitado antes de chegar ao template.
    # `ansible_host` recebe a mesma checagem por defesa: vindo de fact/inventário
    # ele não costuma ter sufixo, mas se tivesse o template geraria `.../24/24`.
    - name: "Abortar se o gateway e o endereço do nó caírem em /24 diferentes"
      ansible.builtin.assert:
        that:
          - (proxmox_lan_prefix | default(24) | int) == 24
          - "'/' not in proxmox_gateway_ip"
          - "'/' not in ansible_host"
          - >-
            ansible_host.split('/')[0].split('.')[:3]
            == proxmox_gateway_ip.split('/')[0].split('.')[:3]
        fail_msg: >-
          ansible_host ({{ ansible_host }}) e proxmox_gateway_ip
          ({{ proxmox_gateway_ip }}) precisam cair na mesma /24, e
          proxmox_lan_prefix precisa ser 24. proxmox_gateway_ip deve ser um IP
          PURO, sem /prefixo: o gateway de uma stanza `iface ... inet static`
          não leva prefixo, e o template o escreve cru — um "192.0.2.1/24" iria
          literal para /etc/network/interfaces e a vmbr0 subiria sem rota
          default. O prefixo da rede vem de proxmox_lan_prefix, aplicado só ao
          address. Ou proxmox_gateway_ip/ansible_host contêm "/", ou os
          endereços divergem de /24, ou proxmox_lan_prefix != 24 (a checagem por
          3 octetos só é válida para /24; outro prefixo exige recalcular a rede
          com ansible.utils.ipaddr, hoje não suportado aqui). Aplicar assim
          escreveria em /etc/network/interfaces um gateway inválido ou fora da
          sub-rede do address; a rota default fica inalcançável quando a rede
          subir (reboot) e o acesso remoto ao hipervisor cai — recuperação só
          por console físico ou IPMI. Corrija proxmox_gateway_ip (IP puro) e, se
          for o caso, proxmox_lan_prefix em [all:vars] no hosts.ini do ambiente
          para a mesma /24 do address deste nó.
        quiet: true
      when: firewall_disponivel

    # A bridge é montada com as interfaces físicas descobertas nos facts. Zero
    # interfaces significaria escrever `bridge-ports` vazio: a bridge sobe, o
    # host perde a rede, e o arquivo continua sintaticamente válido — falha sem
    # mensagem, do tipo que só aparece depois do reboot.
    - name: "Abortar se nenhuma interface física foi descoberta para a bridge"
      ansible.builtin.assert:
        that:
          - ansible_interfaces | select('match', '^(en|eth|nic)[a-z0-9]+$')
            | reject('equalto', proxmox_wan_interface | default('')) | list | length > 0
        fail_msg: >-
          Nenhuma interface física sobrou para a bridge vmbr0 depois de excluir
          `proxmox_wan_interface`. Confira `ansible_interfaces` neste host — o
          template proxmox_interfaces.j2 escreveria uma bridge sem portas.
      when: firewall_disponivel
  tasks:
    # Coletado uma vez para condicionar as tasks que mexem em serviços que podem
    # não existir neste host. Antes elas carregavam `ignore_errors: true`, o que
    # silenciava também as falhas reais — incluindo as das tasks seguintes, que
    # dependiam delas.
    - name: Levantar os serviços presentes no host
      ansible.builtin.service_facts:

    # PVE 9 (Debian 13 trixie) adota o formato deb822 (`.sources`) e abandona
    # o `sources.list` de uma linha. Os dois formatos coexistem no apt, e é
    # justamente aí que mora a armadilha: deixar o antigo para trás com o mesmo
    # repositório declarado no novo faz o apt avisar de entrada duplicada e,
    # pior, mantém no ar uma suíte que este playbook acha que já trocou. Por
    # isso o `sources.list` é esvaziado em vez de reescrito.
    # ⚠️ TAG PRÓPRIA `repositorios`, mesmo motivo do `node_exporter` mais abaixo: o
    # playbook completo reescreve `/etc/network/interfaces` e `storage.cfg`, e
    # consertar declaração de repositório num hipervisor em produção não pode
    # exigir esse risco junto. As pre_tasks deste play não levam `tags: always`,
    # e a regra "tag não pode desarmar gate" continua valendo — os asserts do
    # topo protegem a escrita de REDE e de STORAGE, e nenhuma das duas acontece
    # sob esta tag.
    #
    # ⚠️ AS SEIS TASKS SÃO UMA UNIDADE, e a ordem entre elas não é livre. A
    # primeira ESVAZIA o `sources.list`; as três últimas é que declaram os
    # repositórios em deb822. Rodar a primeira sem as outras deixa o host SEM
    # repositório Debian nenhum. Marcar só parte do bloco com a tag produz
    # exatamente esse estado. Ao acrescentar task aqui, marque-a também.
    - name: Esvaziar o /etc/apt/sources.list legado (o formato válido no PVE 9 é deb822)
      tags: repositorios
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        content: |
          # Intencionalmente vazio — gerenciado por Ansible.
          # Os repositórios vivem em /etc/apt/sources.list.d/*.sources (deb822).
        owner: root
        group: root
        mode: '0644'

    # ORDEM, e ela não é livre: `deb822_repository` é um módulo Python que faz
    # `from debian.deb822 import Deb822`, e o pacote `python3-debian` NÃO vem
    # numa instalação limpa do Proxmox VE. Instalá-lo exige `apt update`, que
    # por sua vez falha com 401 enquanto o repositório Enterprise pago estiver
    # declarado. Daí a sequência: apagar o pago (é só remover arquivo, não
    # precisa de Python), atualizar o cache, instalar a biblioteca, e só então
    # declarar os repositórios em deb822.
    - name: Remover repositórios Enterprise e Ceph pagos, nos dois formatos
      tags: repositorios
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        # Os quatro caminhos, e não dois: um host instalado direto no PVE 9 traz
        # os `.sources`; um host migrado do PVE 8 carrega os `.list` antigos
        # junto. Remover só um dos formatos deixa o repositório pago ativo pela
        # outra metade, e o sintoma é um 401 no `apt update` que ninguém associa
        # a isto.
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.sources
        - /etc/apt/sources.list.d/proxmox.sources
        # Restos da instalação, e o motivo de entrarem aqui não é limpeza: eles
        # continuam sendo repositório declarado. Hoje estão comentados nos dois
        # nós, mas quem os comentou foi uma pessoa, não este playbook — e um
        # `pvetest` reabilitado pela GUI passaria a servir pacote de teste para
        # um hipervisor de produção sem que nada aqui percebesse. Governar é
        # apagar, não conferir. Todos ainda citam `bookworm`, o que os torna
        # inúteis mesmo se alguém os reabilitasse.
        - /etc/apt/sources.list.d/pve-test.sources
        - /etc/apt/sources.list.d/pvetest-for-beta.list
        - /etc/apt/sources.list.d/pve-install-repo.list

    - name: Instalar a biblioteca que o módulo deb822_repository exige
      tags: repositorios
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true

    - name: "Declarar os repositórios oficiais do Debian em deb822, suíte {{ proxmox_debian_suite }}"
      tags: repositorios
      ansible.builtin.deb822_repository:
        name: debian
        types: [deb]
        uris: https://deb.debian.org/debian
        suites: "{{ proxmox_debian_suite }} {{ proxmox_debian_suite }}-updates"
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: "Declarar o repositório de segurança do Debian em deb822, suíte {{ proxmox_debian_suite }}"
      tags: repositorios
      ansible.builtin.deb822_repository:
        name: debian-security
        types: [deb]
        uris: https://security.debian.org/debian-security
        suites: "{{ proxmox_debian_suite }}-security"
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    # No PVE 9 o keyring mudou de nome: era `proxmox-release-bookworm.gpg`,
    # agora é `proxmox-archive-keyring.gpg`. Apontar para o antigo faz o apt
    # rejeitar a assinatura do repositório inteiro.
    - name: Adicionar o repositório PVE No-Subscription oficial (deb822)
      tags: repositorios
      ansible.builtin.deb822_repository:
        name: pve-no-subscription
        types: [deb]
        uris: http://download.proxmox.com/debian/pve
        suites: "{{ proxmox_debian_suite }}"
        components: [pve-no-subscription]
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        state: present

    - name: Atualizar o cache do APT depois de trocar os repositórios
      tags: repositorios
      ansible.builtin.apt:
        update_cache: true

    # ⚠️ SEPARADO do bloco acima, e a separação é o ponto. Trocar a DECLARAÇÃO
    # de um repositório e ATUALIZAR o sistema inteiro são decisões diferentes,
    # com riscos diferentes: a primeira é reversível restaurando arquivo, a
    # segunda sobe `pve-manager` e reinicia serviço num hipervisor com convidado
    # em cima. Enquanto viajavam na mesma task, não havia como fazer só a
    # primeira. Continua rodando na execução completa do playbook; o que muda é
    # `--tags repositorios` não arrastar mais a atualização junto.
    - name: Atualizar os pacotes do Proxmox para a última versão da suíte
      tags: atualizar
      ansible.builtin.apt:
        upgrade: dist

    # ⚠️ Até 26/08/2026 NENHUM dos dois hipervisores publicava métrica de
    # sistema operacional. O job `pve` do Prometheus cobre convidados, storage e
    # estado do nó pela API do PVE — não cobre CPU por núcleo, memória
    # detalhada, I/O de disco, sistema de arquivos nem interface de rede. O
    # host que hospeda o NAS era, por isso, um ponto cego.
    #
    # ⚠️ TAG PRÓPRIA, e as pre_tasks deste play NÃO levam `tags: always`. A regra
    # "tag não pode desarmar gate" continua valendo — o que muda é o alcance de
    # cada gate. Os asserts do topo protegem a escrita de REDE e de STORAGE
    # (`proxmox_gateway_ip`, `backup_storage`), e nenhuma das duas acontece sob
    # esta tag: ela instala um pacote e sobe um serviço. Exigi-los aqui travaria
    # a coleta de métrica por variáveis que ela não usa — hoje, inclusive, a
    # travaria de fato, porque `proxmox_gateway_ip` ainda não está no inventário.
    #
    # A tag existe porque o playbook completo reescreve `/etc/network/interfaces`
    # e `storage.cfg`. Ligar o exporter num hipervisor em produção não pode exigir
    # esse risco junto.
    # ⚠️ `apply:` NÃO é decoração. `include_tasks` é DINÂMICO: a tag do include
    # decide se o include roda, e NÃO desce para as tasks incluídas — elas são
    # carregadas em tempo de execução e filtradas por `--tags` como qualquer
    # outra. Sem `apply`, `--tags node_exporter` faz o include rodar e todas as
    # tasks de dentro serem puladas.
    #
    # E o modo de falha é o pior possível: o relatório sai `ok=2 changed=0`, que
    # se lê como "já estava instalado". Observado nesta base em 02/09/2026 — só
    # apareceu ao conferir QUAIS tasks rodaram, em vez de ler o recap.
    # (`import_tasks` propagaria a tag sozinho, mas é estático e não aceita o
    # caminho com `playbook_dir` resolvido em execução.)
    - name: Instalar e verificar o node_exporter
      tags: node_exporter
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/node_exporter.yml"
        apply:
          tags: node_exporter

    - name: Instalar pacotes Enterprise e ferramentas CLI modernas (chrony, fail2ban, btop, ncdu, ripgrep, fzf, tmux)
      ansible.builtin.apt:
        name:
          - intel-microcode
          - amd64-microcode
          - fail2ban
          - smartmontools
          - proxmox-backup-client
          # Sem `cpufrequtils`: o pacote saiu do Debian 13 e o apt falha com
          # "No package matching". Nem faz falta — o driver é `intel_pstate` e o
          # kernel do PVE já sobe com o governor `performance`, que era tudo o
          # que o /etc/default/cpufrequtils pedia.
          # Sem `ksmtuned`: no PVE o serviço vem do `ksm-control-daemon`, já
          # instalado e ativo. O `ksmtuned` do Debian disputa o
          # /etc/ksmtuned.conf com ele e o dpkg aborta a instalação inteira.
          - chrony
          - zram-tools
          # Explícito porque o Debian 13 NÃO o instala por padrão — é a mesma
          # razão pela qual o jail do fail2ban acima usa `backend = systemd`.
          # Sem o pacote não existe /etc/rsyslog.d, e a task que escreve o envio
          # de log para o Alloy falharia com "Destination directory does not
          # exist" — bem depois, e sem relação aparente com este bloco.
          - rsyslog
          - btop
          - ncdu
          - ripgrep
          - fzf
          - tmux
          - htop
          - lm-sensors
          - sysstat
          - zfsutils-linux
          - curl
          - git
          - rsync
          - ethtool
        state: present

    - name: Garantir desduplicação de memória RAM em tempo real (KSM) ativa
      ansible.builtin.systemd:
        name: ksmtuned
        state: started
        enabled: true

    # `ntp_servers` deriva de `inventories/_common/all.yml`: o servidor interno
    # (opcional, vindo do inventário gitignorado) seguido das públicas.
    #
    # Duas fontes de propósito. Apontar só para o firewall pressupõe que ele
    # roteia E tem o serviço de tempo ligado; enquanto isso não for verdade, o
    # host fica sem fonte nenhuma — e relógio sem fonte não dá erro, derrapa
    # devagar, até virar falha de TLS semanas depois, longe da causa.
    - name: Configurar Chrony NTP
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        content: |
          {% for servidor in ntp_servers %}
          server {{ servidor }} iburst
          {% endfor %}
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar Chrony NTP
      ansible.builtin.systemd:
        name: chrony
        state: restarted
        enabled: true

    - name: Configurar Fail2ban para proteção do Proxmox Web GUI (Porta 8006)
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/proxmox.conf
        content: |
          [proxmox]
          enabled = true
          port = 8006
          filter = proxmox
          # `backend = systemd` em vez de `logpath = /var/log/daemon.log`: o
          # Debian 13 não instala mais o rsyslog por padrão, e sem ele aquele
          # arquivo simplesmente não existe. O jail subiria assim mesmo,
          # observando um caminho vazio — proteção que existe e nunca baniria
          # ninguém. O journal está sempre lá.
          backend = systemd
          maxretry = 3
          findtime = 600
          bantime = 3600
        owner: root
        group: root
        mode: '0644'

    - name: Garantir serviço do Fail2ban ativo e habilitado
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true

    - name: Desativar serviços de High Availability (HA) em nó único Proxmox (Economia de CPU/RAM)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - pve-ha-crm
        - pve-ha-lrm

    # O aviso de assinatura sai por um script que também roda depois de TODO
    # dpkg (gancho no apt): antes era um `sed` único, e a próxima atualização
    # do proxmox-widget-toolkit trazia o aviso de volta até o playbook rodar
    # de novo. O script cobre também a GUI móvel (pve-yew-mobile-gui).
    - name: Instalar o script que remove o aviso de assinatura (web e móvel)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../templates/proxmox/pve-remove-nag.sh"  # noqa: no-relative-paths
        dest: /usr/local/bin/pve-remove-nag.sh
        owner: root
        group: root
        mode: '0755'

    - name: Reaplicar a remoção do aviso depois de todo dpkg
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/no-nag-script
        content: |
          // Gerado pelo Ansible (00-proxmox-setup.yml). NAO editar a mao.
          DPkg::Post-Invoke { "/usr/local/bin/pve-remove-nag.sh || true"; };
        owner: root
        group: root
        mode: '0644'

    - name: Remover o aviso de assinatura agora
      ansible.builtin.command: /usr/local/bin/pve-remove-nag.sh
      register: nag_patch
      changed_when: "'aplicado' in nag_patch.stdout"

    # Nenhum dos três vem instalado por padrão no Proxmox. Condicionar à presença
    # real é o que permite remover o ignore_errors sem quebrar o play num host
    # que simplesmente não tem o serviço.
    - name: Desativar serviços desnecessários do Debian Host (avahi-daemon, cups, modemmanager)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - avahi-daemon
        - cups
        - modemmanager
      when: "(item ~ '.service') in ansible_facts.services"

    - name: Configurar Blacklist de módulos de Kernel não utilizados (bluetooth, firewire)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-unused.conf
        content: |
          blacklist bluetooth
          blacklist firewire-core
          blacklist appletalk
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Timeout de Shell Ocioso, Aliases QoL (pve-vms, pve-top, disk-map) e Histórico Bash
      ansible.builtin.copy:
        dest: /etc/profile.d/homelab-qol.sh
        content: |
          export TMOUT=900
          export HISTTIMEFORMAT="%F %T "
          export HISTSIZE=50000
          export HISTFILESIZE=100000
          alias pve-vms='qm list'
          alias pve-cts='pct list'
          alias pve-top='btop'
          alias disk-map='ncdu /'
          alias zram-stats='zramctl'
        owner: root
        group: root
        mode: '0644'

    - name: Reduzir Timeout de Desligamento de Serviços Travados para 15s (/etc/systemd/system.conf)
      ansible.builtin.lineinfile:
        path: /etc/systemd/system.conf
        regexp: '^#?DefaultTimeoutStopSec='
        line: 'DefaultTimeoutStopSec=15s'

    # ADIÁVEL: desligar o resolvedor local só faz sentido quando existe outro
    # servidor de DNS para assumir. Sem o firewall no ar, isto deixaria o
    # hipervisor sem resolver nome nenhum — inclusive o do próprio espelho do
    # apt, na execução seguinte.
    - name: Desativar daemon systemd-resolved para usar consulta direta de DNS no OPNsense
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      when:
        - firewall_disponivel
        - "'systemd-resolved.service' in ansible_facts.services"

    - name: Travar resolução pvelocalhost no /etc/hosts apontando estritamente para IPv4 (127.0.0.1)
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*pvelocalhost.*'
        line: '127.0.0.1 pvelocalhost'

    # O tamanho é DERIVADO da RAM do host, não fixo. O valor anterior era
    # `SIZE=12288`, com o comentário "ideal para host 16GB RAM no Intel N100" —
    # verdade num nó só. Aplicado ao outro hipervisor, que tem outro hardware,
    # ou reservava ZRAM demais para a RAM disponível, ou de menos. Os dois nós
    # deste parque não são iguais, e nada no playbook dizia isso.
    - name: Configurar ZRAM Swap Comprimido em RAM (75% da RAM física deste host)
      ansible.builtin.copy:
        dest: /etc/default/zramswap
        content: |
          ALGO=lz4
          SIZE={{ zram_size_mb | default((ansible_memtotal_mb * 0.75) | round | int) }}
          PRIORITY=100
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar serviço ZRAM Swap
      ansible.builtin.systemd:
        name: zramswap
        state: restarted
        enabled: true

    - name: Configurar Hardening de Cifras e Algoritmos SSH no Debian Host
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/hardening.conf
        # `validate` porque um nome de cifra errado (`@openssh.org`, até
        # 12/10/2026) não derruba o sshd em execução: só o próximo boot, e aí
        # sem SSH para consertar. O drop-in testado sozinho basta — são as
        # três linhas dele que podem quebrar o daemon.
        validate: /usr/sbin/sshd -t -f %s
        content: |
          KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
          Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
          MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Sysctl Enterprise do Kernel (swappiness=10, fq_codel, somaxconn, eBPF, suid_dumpable, dirty memory, max_map_count)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-proxmox-tuning.conf
        content: |
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          vm.max_map_count = 262144
          vm.dirty_ratio = 10
          vm.dirty_background_ratio = 5
          fs.file-max = 2097152
          fs.inotify.max_user_watches = 524288
          fs.suid_dumpable = 0
          net.core.default_qdisc = fq_codel
          net.core.somaxconn = 65535
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.core.netdev_max_backlog = 10000
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.ip_early_demux = 1
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.icmp_echo_ignore_broadcasts = 1
          net.ipv6.conf.all.accept_redirects = 0
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.unprivileged_bpf_disabled = 1
        owner: root
        group: root
        mode: '0644'

    - name: Aplicar sysctl no Proxmox Host
      ansible.builtin.command: "sysctl --system"
      changed_when: true

    - name: Configurar Regra de I/O Scheduler para SSDs (mq-deadline / kyber)
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-scheduler.rules
        content: |
          ACTION=="add|change", KERNEL=="sd[a-z]|nvme[0-n]n[1-9]", ATTR{queue/scheduler}="mq-deadline"
        owner: root
        group: root
        mode: '0644'

    # ⚠️ O alvo declara o encaminhamento em `rsyslog.d/50-remote-alloy-syslog.conf`.
    # Qualquer linha de encaminhamento no `/etc/rsyslog.conf` principal é, por
    # definição, divergência — e divergência aqui não é inofensiva: o host passa
    # a enviar para DOIS destinos, e o antigo continua recebendo sem que nada
    # acuse. Encontrado assim em produção em 06/09/2026, com
    # `*.* @<coletor-antigo>:514` acrescentado à mão no fim do arquivo.
    #
    # Removida, e não preservada, pelo princípio do CLAUDE.md: configuração
    # feita à mão que o IaC não parametriza DEVE ser perdida.
    - name: Remover encaminhamento de syslog fora do arquivo que este play controla
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.conf
        regexp: '^\s*\*\.\*\s+@'
        state: absent

    - name: Configurar Envio Centralizado de Logs Syslog do Proxmox para o Grafana Alloy (UDP 1514)
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/50-remote-alloy-syslog.conf
        content: |
          # ⚠️ O template NÃO é opcional. Sem ele o rsyslog usa o
          # `RSYSLOG_TraditionalForwardFormat`, que é RFC3164, e o ouvinte do
          # Alloy na 1514 declara RFC5424 — a mensagem chega e é descartada em
          # silêncio, sem erro em ponta nenhuma.
          *.* @{{ syslog_server_ip }}:{{ syslog_server_port }};RSYSLOG_SyslogProtocol23Format
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar rsyslog para ativar envio centralizado de logs
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
        enabled: true

    # A VM do firewall vive num nó só; nos demais este arquivo não existe. Testar
    # a presença é honesto — `ignore_errors` aqui escondia também erro de escrita
    # no nó certo.
    - name: Verificar se a VM do firewall reside neste nó
      ansible.builtin.stat:
        path: "/etc/pve/qemu-server/{{ opnsense_vmid | default(100) }}.conf"
      register: opnsense_vm_conf

    # ⚠️ `affinity: 0` prende a VM ao núcleo 0 — UM núcleo físico. Escrever essa
    # linha numa VM com mais de um vCPU não é pinning, é contenção: os vCPUs
    # passam a disputar o mesmo núcleo, e o sintoma é lentidão sem nenhuma
    # mensagem que aponte para a causa. O alvo do Terraform declara `cores = 1`
    # para esta VM justamente por isso, mas o Terraform pode não ter sido
    # aplicado, ou alguém pode ter mexido pela interface do Proxmox.
    #
    # Por isso a task LÊ o que a VM realmente tem antes de escrever. O total de
    # vCPUs é `sockets × cores`, e os dois campos são OMITIDOS do arquivo quando
    # valem 1 — daí o `default([1], true)`, que trata tanto "ausente" quanto
    # "regex não casou".
    - name: Ler a configuração da VM do firewall
      ansible.builtin.slurp:
        src: "/etc/pve/qemu-server/{{ opnsense_vmid | default(100) }}.conf"
      register: opnsense_vm_raw
      when: opnsense_vm_conf.stat.exists

    - name: Derivar quantos vCPUs a VM do firewall tem hoje
      ansible.builtin.set_fact:
        opnsense_vcpus: >-
          {{ ((opnsense_vm_raw.content | b64decode
               | regex_search('(?m)^cores:\s*(\d+)', '\1')
               | default([1], true) | first | int)
              *
              (opnsense_vm_raw.content | b64decode
               | regex_search('(?m)^sockets:\s*(\d+)', '\1')
               | default([1], true) | first | int)) }}
      when: opnsense_vm_conf.stat.exists

    - name: Recusar o pinning quando a VM tem mais de um vCPU
      ansible.builtin.assert:
        that:
          - (opnsense_vcpus | int) == 1
        fail_msg: >-
          A VM do firewall (VMID {{ opnsense_vmid | default(100) }}) declara
          {{ opnsense_vcpus }} vCPUs, e este play escreveria `affinity: 0`, que
          a prende a UM núcleo. Isso não é pinning, é contenção — os
          {{ opnsense_vcpus }} vCPUs disputariam o núcleo 0 e a lentidão
          resultante não apontaria para cá. O alvo do Terraform declara
          `cores = 1` para esta VM: ou aplique-o, ou ajuste os vCPUs pela
          interface do Proxmox, e só então rode este play de novo.
        success_msg: >-
          A VM do firewall tem 1 vCPU — `affinity: 0` é pinning de verdade.
      when: opnsense_vm_conf.stat.exists

    - name: Configurar CPU Pinning na VM do OPNsense (1 núcleo dedicado - Core 0)
      ansible.builtin.lineinfile:
        path: "/etc/pve/qemu-server/{{ opnsense_vmid | default(100) }}.conf"
        line: "affinity: 0"
        create: false
      when: opnsense_vm_conf.stat.exists

    # `keyctl=1` nos CTs do Docker: o Docker exige em CT unprivileged, e o PVE
    # só aceita feature flag além de `nesting` do root@pam — o Terraform, que
    # aplica com token, cria os CTs só com `nesting` e ignora `features`. Os
    # VMIDs são os do main.tf (200/201 Swarm, 210 dev). Roda no passo 10,
    # antes do bootstrap do Swarm (passo 12); a feature só vale no próximo
    # start, daí o reboot de quem acabou de ganhá-la. Tag `docker_ct`: o passo 8
    # do guia roda só este bloco logo depois do `terraform apply`, e os CTs
    # ficam completos na criação — o passo 10 apenas confere.
    - name: Levantar os CTs do Docker presentes neste nó
      tags: docker_ct
      ansible.builtin.stat:
        path: "/etc/pve/lxc/{{ item }}.conf"
      loop: "{{ proxmox_docker_ctids | default([200, 201, 210]) }}"
      register: docker_ct_conf

    - name: Ler a configuração de cada CT do Docker
      tags: docker_ct
      ansible.builtin.command: "pct config {{ item.item }}"
      loop: "{{ docker_ct_conf.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"
      register: docker_ct_cfg
      changed_when: false
      check_mode: false

    # Só CT `unprivileged: 1` recebe keyctl, igual ao community-scripts: em CT
    # privilegiado a feature não se aplica. Os CTs do Swarm passaram a
    # privilegiados em 13/10/2026 (IPVS), ver o main.tf.
    - name: Separar os CTs do Docker não privilegiados ainda sem keyctl
      tags: docker_ct
      ansible.builtin.set_fact:
        docker_ct_sem_keyctl: >-
          {{ docker_ct_cfg.results
             | selectattr('stdout', 'search', '(?m)^unprivileged: 1')
             | rejectattr('stdout', 'search', '(?m)^features:.*keyctl=1')
             | map(attribute='item.item') | list }}

    - name: Habilitar keyctl nos CTs do Docker (exige root; o token do Terraform não pode)
      tags: docker_ct
      ansible.builtin.command: "pct set {{ item }} --features nesting=1,keyctl=1"
      loop: "{{ docker_ct_sem_keyctl }}"
      changed_when: true

    - name: Reiniciar os CTs que acabaram de ganhar keyctl
      tags: docker_ct
      ansible.builtin.shell: |
        set -euo pipefail
        if pct status {{ item }} | grep -q running; then pct reboot {{ item }}; fi
      args:
        executable: /bin/bash
      loop: "{{ docker_ct_sem_keyctl }}"
      changed_when: true

    # Trim semanal dos CTs. O `fstrim.timer` do host não alcança o rootfs dos
    # CTs, e dentro de um CT unprivileged o trim não é permitido: sem isto, o
    # que o Docker apaga nunca volta ao thin pool — e o do nó secundário é
    # pequeno (~54 GB). Ideia do community-scripts (tools/pve/fstrim.sh), que
    # é manual; aqui é timer. Só CT rodando: `pct fstrim` não opera parado.
    # Script à parte: no ExecStart o próprio systemd expande `$`, e o laço com
    # awk ficaria à mercê de duas camadas de aspas.
    - name: Instalar o script de trim dos CTs
      tags: docker_ct
      ansible.builtin.copy:
        dest: /usr/local/sbin/pct-fstrim-all
        content: |
          #!/bin/sh
          # Gerado pelo Ansible (00-proxmox-setup.yml). NAO editar a mao.
          for id in $(pct list | awk 'NR>1 && $2=="running" {print $1}'); do
              pct fstrim "$id" || echo "fstrim falhou no CT $id"
          done
        owner: root
        group: root
        mode: '0755'

    - name: Instalar o serviço de trim dos CTs
      tags: docker_ct
      ansible.builtin.copy:
        dest: /etc/systemd/system/pct-fstrim.service
        content: |
          # Gerado pelo Ansible (00-proxmox-setup.yml). NAO editar a mao.
          [Unit]
          Description=fstrim dos containers LXC (devolve blocos ao thin pool)

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/pct-fstrim-all
        owner: root
        group: root
        mode: '0644'

    - name: Agendar o trim dos CTs (semanal)
      tags: docker_ct
      ansible.builtin.copy:
        dest: /etc/systemd/system/pct-fstrim.timer
        content: |
          # Gerado pelo Ansible (00-proxmox-setup.yml). NAO editar a mao.
          [Unit]
          Description=fstrim semanal dos containers LXC

          [Timer]
          OnCalendar=weekly
          RandomizedDelaySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
        owner: root
        group: root
        mode: '0644'

    # Fora do --check: lá o copy acima é só simulado, a unit não existe e o
    # systemd falharia em "Could not find the requested service" — cortando o
    # --check antes do diff das interfaces de rede, que vem mais abaixo.
    - name: Ativar o timer de trim dos CTs
      tags: docker_ct
      when: not ansible_check_mode
      ansible.builtin.systemd:
        name: pct-fstrim.timer
        state: started
        enabled: true
        daemon_reload: true

    # ⚠️ `proxmox_wan_interface` é a única variável desta família que falha
    # CALADA. As outras quatro (`proxmox_gateway_ip`, `backup_storage`,
    # `proxmox_backup_share`, `proxmox_lan_prefix`) têm assert ou default
    # documentado; esta é consumida em proxmox_interfaces.j2 com
    # `| default('')`, e omiti-la faz TODA interface física dos facts entrar na
    # bridge vmbr0 — a NIC de WAN junto.
    #
    # Hoje isso não aparece: o pass-through já está ativo, a NIC de WAN
    # pertence ao vfio-pci e some dos facts, então a variável vazia acerta por
    # acidente. A janela de perigo é a RECONSTRUÇÃO: host novo, IOMMU ainda
    # desligado (o bloco logo abaixo é quem o liga), todas as NICs visíveis nos
    # facts — e a WAN entra na mesma bridge L2 da LAN, sem erro nenhum.
    #
    # Por isso a exigência é DECLARAR, não preencher: `proxmox_wan_interface=""`
    # é resposta válida e significa "o pass-through já levou a NIC". Omitir não
    # é resposta, é silêncio. A condição usa a presença da VM do firewall neste
    # host — o mesmo fato que o bloco de pinning acima já coletou —, porque é
    # exatamente onde a NIC de WAN é dedicada.
    - name: "Exigir que proxmox_wan_interface seja declarada no nó que hospeda o firewall"
      ansible.builtin.assert:
        that:
          - proxmox_wan_interface is defined
        fail_msg: >-
          Este nó hospeda a VM do firewall e `proxmox_wan_interface` não está
          declarada no inventário. Omitida, ela vale '' e o
          proxmox_interfaces.j2 põe TODA interface física dos facts em
          bridge-ports do vmbr0 — inclusive a NIC de WAN, que passa a
          compartilhar o L2 da LAN sem que nada acuse. Declare o nome da
          interface na linha do host em hosts.ini, ou declare
          `proxmox_wan_interface=""` para afirmar que o PCIe pass-through já a
          removeu dos facts.
        success_msg: >-
          WAN declarada: "{{ proxmox_wan_interface }}"
          {{ '(vazia — pass-through já ativo)' if not proxmox_wan_interface else '' }}
      when: opnsense_vm_conf.stat.exists

    # IOMMU entra AQUI, e não num passo manual de runbook. A task já existia
    # para o `pcie_aspm`, já escreve a mesma linha do GRUB e já notifica o
    # `update-grub` — deixar o IOMMU fora dela era omissão histórica, não
    # limitação: os dois passthroughs de produção (a NIC de WAN do firewall e a
    # controladora do NAS) funcionavam só porque alguém tinha digitado a flag à
    # mão, e uma reinstalação a partir deste repositório não os reproduzia.
    #
    # O parâmetro é diferente por fabricante, então é derivado do fact em vez de
    # fixado: `intel_iommu=on` num host AMD é ignorado em silêncio pelo kernel —
    # o host sobe, o passthrough não funciona, e nada aponta para a causa.
    - name: Determinar o parâmetro de IOMMU conforme o fabricante da CPU
      ansible.builtin.set_fact:
        iommu_param: >-
          {{ 'amd_iommu=on' if 'AuthenticAMD' in (ansible_processor | join(' '))
             else 'intel_iommu=on' }}

    - name: Configurar IOMMU e pcie_aspm=performance no GRUB
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet pcie_aspm=performance {{ iommu_param }} iommu=pt"'
      notify: Atualizar GRUB

    # A verificação é contra a cmdline EM USO, não contra o que o handler
    # acabou de escrever. Antes o aviso era um handler notificado pela task
    # acima, e por isso só aparecia na execução que mudou o arquivo: quem não
    # reiniciasse naquele dia nunca mais era avisado, e descobria no
    # `terraform apply` do bloco seguinte, por um "device is in use" que não
    # menciona GRUB.
    - name: Ler a cmdline do kernel em uso
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: cmdline_atual
      check_mode: false

    - name: "AVISO: o IOMMU exige um reboot que ainda não aconteceu"
      ansible.builtin.debug:
        msg: >-
          ⚠️ {{ iommu_param }} está no /etc/default/grub mas NÃO na cmdline em
          uso. Até este host reiniciar, o passthrough da NIC de WAN e o do NAS
          continuam indisponíveis. Reinicie numa janela própria e confira com:
          dmesg | grep -e DMAR -e IOMMU
      when: iommu_param not in (cmdline_atual.content | b64decode)

    # ⚠️ NÃO existe aqui um bloco carregando os módulos do VFIO, e a ausência é
    # deliberada. Já existiu: escrevia /etc/modules-load.d/vfio.conf e
    # notificava `update-initramfs`. Não funcionava e era pior que nada, por
    # dois motivos. Primeiro, `update-initramfs` lê /etc/initramfs-tools/modules
    # — nunca /etc/modules-load.d/, que é o carregador do systemd, pós-boot; o
    # initramfs regenerado não ganhava módulo nenhum. Segundo, carregar
    # `vfio_pci` não vincula dispositivo: o Proxmox faz o bind dinâmico no start
    # da VM, a partir do `hostpci`, e é isso que já funciona. O que o
    # passthrough realmente exige é o IOMMU na cmdline (acima) e a NIC fora da
    # bridge (`proxmox_wan_interface`).

    - name: Agendar fstrim semanal nos domingos às 02:00 AM para manutenção do SSD LVM-Thin
      ansible.builtin.raw: '(crontab -l 2>/dev/null; echo "0 2 * * 0 /sbin/fstrim -av") | sort -u | crontab -'
      changed_when: false

    - name: Agendar limpeza semanal automática de caches e imagens no Proxmox via Crontab
      ansible.builtin.raw: '(crontab -l 2>/dev/null; echo "0 3 * * 0 pveam update && apt-get autoremove -y && apt-get clean") | sort -u | crontab -'
      changed_when: false

    # Os três `noqa: no-relative-paths` abaixo: a regra pede estrutura de role,
    # e estes playbooks são deliberadamente flat — converter em roles é uma
    # refatoração maior, registrada no roadmap. O caminho é relativo ao playbook,
    # não ao diretório de execução, então é estável.
    # ADIÁVEL, e o mais destrutivo do play: reescreve a rede do hipervisor por
    # inteiro. O gateway que ele grava é o firewall — aplicar isto antes de o
    # firewall existir tira o host da rede, e a recuperação é por console
    # física ou IPMI.
    - name: Aplicar padronização de interfaces de rede (/etc/network/interfaces)  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/proxmox/proxmox_interfaces.j2"
        dest: /etc/network/interfaces
        owner: root
        group: root
        mode: '0644'
      when: firewall_disponivel

    # ADIÁVEL: o template declara o share CIFS servido pelo NAS. Escrevê-lo com
    # o NAS ausente produziria um storage que o Proxmox mostra na UI e nunca
    # monta — e, como o arquivo é reescrito inteiro, apagaria de quebra os
    # storages locais que já funcionam.
    # O storage.cfg declara `username smb` e nada mais: o Proxmox guarda a
    # senha do CIFS num arquivo à parte, /etc/pve/priv/storage/<id>.pw. Sem ele
    # o storage aparece na UI, nunca monta, e o `pvesm status` o reporta
    # inativo — que é exatamente onde 06-backup.yml aborta, dois blocos depois
    # e com a causa fora de vista. Escrito ANTES do template, para que o
    # storage já nasça montável.
    # Num PVE recém-instalado /etc/pve/priv/storage/ não existe, e o `copy` não
    # cria diretório: a task abaixo falhava (escondida pelo no_log). 0700
    # root:www-data é o que o pmxcfs impõe em priv/, então nada a recusar.
    - name: Criar o diretório de senhas de storage do PVE
      ansible.builtin.file:
        path: /etc/pve/priv/storage
        state: directory
        owner: root
        group: www-data
        mode: '0700'
      when: nas_disponivel

    # ⚠️ Não é `copy`: o arquivo temporário do Ansible nasce 0644 e, ao movê-lo
    # para dentro do pmxcfs, o `copystat` tenta repetir esse modo — e em priv/ o
    # pmxcfs só aceita 0600 ("Operation not permitted", provado em 12/10/2026).
    # Escrita direta: o pmxcfs dá ao arquivo novo 0600 root:www-data sozinho.
    # Idempotência pelo checksum, sem a senha sair do no_log.
    - name: Ler o checksum da senha do share CIFS gravada
      ansible.builtin.stat:
        path: "/etc/pve/priv/storage/{{ backup_storage }}.pw"
        checksum_algorithm: sha1
      register: cifs_pw
      when: nas_disponivel

    - name: Gravar a senha do share CIFS de backup
      ansible.builtin.command:
        # ⚠️ NÃO é a senha crua: é o arquivo de credencial que o PVE passa ao
        # `smbclient -A` e ao `mount.cifs credentials=`, no formato que o
        # próprio PVE grava (CIFSPlugin.pm, cifs_set_credentials):
        # "password=<senha>\n". Com a senha crua o login dá
        # NT_STATUS_LOGON_FAILURE (visto em 12/10/2026).
        argv: [dd, "of=/etc/pve/priv/storage/{{ backup_storage }}.pw", status=none]
        stdin: "{{ cifs_credencial }}"
        stdin_add_newline: false
      vars:
        cifs_credencial: "password={{ proxmox_backup_share_password }}\n"
      no_log: true
      changed_when: true
      when:
        - nas_disponivel
        - not ansible_check_mode
        - cifs_pw.stat.checksum | default('') != (cifs_credencial | hash('sha1'))

    # root:www-data 0640 nas duas tasks de /etc/pve não é escolha: é o que o
    # pmxcfs impõe, e ele recusa chown/chmod. Pedir root:root fazia o conteúdo
    # ser gravado e a task falhar logo depois, em "chgrp failed".
    - name: Aplicar padronização de armazenamento LVM-Thin (/etc/pve/storage.cfg)  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/proxmox/proxmox_storage.j2"
        dest: /etc/pve/storage.cfg
        owner: root
        group: www-data
        mode: '0640'
      when: nas_disponivel

    - name: Aplicar padronização de Datacenter (Teclado ABNT2 pt-br e E-mail de Alertas)  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/proxmox/proxmox_datacenter.j2"
        dest: /etc/pve/datacenter.cfg
        owner: root
        group: www-data
        mode: '0640'

    - name: Configurar e-mail oficial do usuário root@pam no Proxmox
      ansible.builtin.command: "pveum user modify root@pam -email {{ proxmox_alert_email }}"
      changed_when: true

    - name: Configurar Chave SSH Pública do Administrador no Proxmox Host
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ ssh_public_key }}"

    - name: Criar diretório local de exportação de backup das configurações do Proxmox
      ansible.builtin.file:
        path: /var/backups/proxmox_config_exports
        state: directory
        mode: '0755'

    # `unarchive` extrai, não empacota: não existe módulo nativo que crie um
    # tar.gz a partir de caminhos do host.
    - name: Exportar configurações essenciais do Proxmox VE  # noqa: command-instead-of-module
      ansible.builtin.shell: |
        tar -czf /var/backups/proxmox_config_exports/pve-configs-$(date +%Y%m%d_%H%M%S).tar.gz \
          /etc/pve/storage.cfg \
          /etc/pve/qemu-server/ \
          /etc/pve/lxc/ \
          /etc/network/interfaces \
          /etc/hosts \
          /etc/hostname \
          2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true

    # O resumo é obrigatório, não decorativo. Um bloco adiado que ninguém vê é
    # indistinguível de um bloco aplicado — e "o playbook rodou sem erro" passa
    # a significar coisas diferentes em execuções diferentes. Aqui o operador
    # lê, em uma tela, o que entrou, o que ficou para trás e por quê.
    - name: Exibir o resultado do play e o que ficou pendente
      ansible.builtin.debug:
        msg: >-
          🖥️ Proxmox VE padronizado: repositórios {{ proxmox_debian_suite }},
          Chrony, KSM, Fail2ban na porta 8006, sysctl e envio de syslog aplicados.
          Rede (/etc/network/interfaces) e DNS:
          {{ 'APLICADOS' if firewall_disponivel else 'ADIADOS — firewall não respondeu' }}.
          Storage de backup (/etc/pve/storage.cfg):
          {{ 'APLICADO' if nas_disponivel else 'ADIADO — NAS não respondeu' }}.

    - name: "AVISO: blocos adiados nesta execução"
      ansible.builtin.debug:
        msg: >-
          ⚠️ Nem tudo foi aplicado. Faltou:
          {{ (([] if firewall_disponivel else ['rede e DNS (dependem do firewall)'])
              + ([] if nas_disponivel else ['storage de backup (depende do NAS)'])) | join('; ') }}.
          Isto é esperado numa instalação do zero — o firewall e o NAS ainda não
          existem nesta altura. Suba os dois e rode este MESMO playbook de novo:
          ele é idempotente, e a segunda passada aplica só o que faltou.
          Comando: ansible-playbook playbooks/00-proxmox-setup.yml --check --diff
      when: not (firewall_disponivel and nas_disponivel)

  handlers:
    - name: Atualizar GRUB
      ansible.builtin.command: "update-grub"
      changed_when: true
