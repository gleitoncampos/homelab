---
# Backup dos convidados do Proxmox que sustentam o Swarm.
#
# Existe porque `CLAUDE.md` promete reprodutibilidade "a partir das definições
# deste repositório E do diretório /srv/containers" — e a segunda metade não
# tinha backup nenhum. `docker service rollback` NÃO restaura bind mount: ele
# restaura a ServiceSpec. Este playbook é o único ponto de retorno real.
#
# Backup de convidado inteiro, e não restic por diretório, por ser a opção
# mais aditiva: não toca em serviço nenhum e entrega rollback de máquina
# completa.
#
#   ansible-playbook playbooks/06-backup.yml
- name: Configurar backup agendado dos convidados do Swarm
  hosts: proxmox
  # Nenhuma task deste play usa fact de host — pular a coleta é só velocidade.
  gather_facts: false

  vars:
    # Id fixo, não autogerado pela API: é o que torna o job endereçável. Sem
    # ele, cada execução criaria um job novo, e não haveria como um `set`
    # posterior saber qual atualizar.
    backup_job_id: homelab-swarm-backup

    # Um lugar só para os parâmetros do job, consumidos pelo `create` E pelo
    # `set`. Repeti-los nas duas tasks criaria duas verdades que precisam ser
    # mantidas iguais à mão — e a que ficasse para trás só apareceria em
    # produção, na forma de um job que muda de comportamento conforme tenha
    # sido criado ou atualizado.
    backup_prune_spec: "keep-daily={{ backup_keep_daily }},keep-weekly={{ backup_keep_weekly }}"
    backup_job_params:
      - "--schedule={{ backup_schedule }}"
      - "--storage={{ backup_storage }}"
      - "--vmid={{ backup_vmids_deste_no | join(',') }}"
      - "--mode=snapshot"
      - "--compress=zstd"
      - "--enabled=1"
      - "--notes-template=homelab-swarm-{{ '{{' }} guestname {{ '}}' }}"
      - "--prune-backups={{ backup_prune_spec }}"

  pre_tasks:
    # `backup_vmids` deixou de ser obrigatória. Antes o playbook abortava sem
    # ela, e o operador digitava cinco inteiros no inventário — copiados a olho
    # da UI do Proxmox, que é exatamente onde nasce o erro que o assert dizia
    # evitar. Ausente, o padrão passa a ser TODO convidado do nó, que num
    # homelab é o que se quer de qualquer forma; declarada, ela manda e
    # continua sendo validada contra o que existe.
    #
    # O que NÃO mudou: lista declarada com um VMID inexistente continua
    # abortando. O perigo nunca foi não ter lista, foi ter uma lista errada.
    - name: "Abortar se backup_storage não estiver no inventário"
      ansible.builtin.assert:
        that:
          - backup_storage is defined
          - backup_storage | string | length > 0
        fail_msg: >-
          backup_storage não está definido. Sem ele não há como saber qual
          storage do Proxmox recebe o backup. Defina na LINHA DO HOST no
          hosts.ini do ambiente, nunca em [all:vars]: cada hipervisor registra
          o próprio destino com id próprio, e um valor global faria um nó
          agendar contra o id do outro. Ver hosts.ini.example.

  tasks:
    - name: Conferir que o storage de backup existe e aceita backup
      ansible.builtin.command:
        cmd: "pvesm status --storage {{ backup_storage }}"
      register: storage_status
      changed_when: false
      failed_when: storage_status.rc != 0
      # Consulta somente-leitura: sem isto, o `command` é pulado em
      # --check (skipping), storage_status.stdout fica indefinido, e o
      # assert seguinte falha SEMPRE em check mode — mesmo com o storage são.
      check_mode: false

    - name: "Abortar se o storage não estiver ativo"
      ansible.builtin.assert:
        that: "'active' in storage_status.stdout"
        fail_msg: >-
          Storage {{ backup_storage }} não está ativo. Um job de backup
          apontando para storage inativo falha silenciosamente todo dia.

    - name: Levantar os convidados existentes no cluster (QEMU e LXC)
      ansible.builtin.command:
        cmd: "pvesh get /cluster/resources --type vm --output-format json"
      register: cluster_guests
      changed_when: false
      # Consulta somente-leitura, mesmo motivo do `pvesm status` acima.
      check_mode: false
      # NÃO é `qm config`: esse comando é exclusivo de convidado QEMU e
      # retorna código de erro contra um CT LXC. A topologia-alvo
      # (IaC/terraform/proxmox/main.tf) usa LXC para os nós do Swarm — com
      # `qm config`, a task de agendamento abaixo seria pulada em silêncio
      # contra o alvo, o playbook reportaria sucesso, e nenhum job de backup
      # existiria. `/cluster/resources --type vm` devolve QEMU e LXC juntos
      # (o nome do filtro é enganoso, mas é o comportamento documentado do
      # endpoint).
      #
      # ⚠️ SEM `run_once`. Os dois hipervisores são independentes — não há
      # cluster — e num nó standalone `/cluster/resources` devolve apenas os
      # convidados DAQUELE nó, apesar do nome do endpoint. Consultar um só e
      # replicar o resultado, que é o que `run_once` faz, produzia duas falhas
      # ao mesmo tempo: o assert abaixo reprovava todo VMID que morasse no
      # outro nó, e o job era criado só no primeiro — os convidados do
      # secundário nunca eram salvos, com o playbook reportando sucesso.

    - name: "Guardar os VMIDs existentes NESTE nó"
      ansible.builtin.set_fact:
        node_existing_vmids: >-
          {{ (cluster_guests.stdout | from_json) | map(attribute='vmid') | list }}

    # A união dos convidados de todos os nós do inventário. Cada host já
    # executou a task acima quando esta roda — o Ansible avança task a task
    # sobre o grupo inteiro —, então `hostvars` está completo aqui.
    - name: "Somar os convidados de todos os nós do grupo"
      ansible.builtin.set_fact:
        todos_vmids_conhecidos: >-
          {{ groups['proxmox']
             | map('extract', hostvars, 'node_existing_vmids')
             | select('defined') | list | flatten | unique }}

    - name: "Abortar se algum VMID de backup_vmids não existir em nó nenhum"
      ansible.builtin.assert:
        that: (backup_vmids | difference(todos_vmids_conhecidos)) | length == 0
        fail_msg: >-
          {{ backup_vmids | difference(todos_vmids_conhecidos) }} de
          backup_vmids não existe em nenhum dos nós do grupo `proxmox`.
          Agendar backup para um convidado inexistente falha silenciosamente
          todo dia.
      when: backup_vmids is defined and backup_vmids | length > 0

    # Cada nó agenda só o que ele hospeda. Um job que cite VMID de outro nó
    # falha no vzdump toda madrugada, longe de qualquer execução de playbook.
    - name: "Separar os VMIDs que este nó hospeda"
      ansible.builtin.set_fact:
        backup_vmids_deste_no: >-
          {{ (backup_vmids | intersect(node_existing_vmids))
             if backup_vmids is defined and backup_vmids | length > 0
             else node_existing_vmids }}

    # =====================================================================
    # GATE DE COBERTURA — o que o vzdump NÃO salva
    # =====================================================================
    # ⚠️ "Backup configurado" e "dado protegido" não são a mesma coisa, e a
    # diferença só aparece na restauração. O manual do vzdump nesta caixa é
    # literal: "Device and bind mounts are never backed up as their content is
    # managed outside the Proxmox VE storage library."
    #
    # O job roda, o relatório fica verde, e o que estava fora volta vazio. Este
    # gate existe para transformar isso numa DECISÃO tomada agora, em vez de uma
    # descoberta feita no dia da restauração.
    #
    # O que é levantado, e por quê:
    #   hostpci*  dispositivo PCI repassado. Se for controladora de disco, os
    #             discos dela não existem para o vzdump — o convidado volta só
    #             com o disco de sistema.
    #   dev*      device mount point de LXC, mesma história.
    #   mp*       ponto de montagem de LXC cujo valor começa com "/": é bind
    #             mount de caminho do host, nunca salvo. Volume de storage
    #             (`storage:vol`) É salvo e não entra aqui.
    #   backup=0  disco ou volume marcado explicitamente para ficar de fora.
    - name: "Ler a configuração de cada convidado que entra no backup"
      ansible.builtin.command:
        cmd: >-
          pvesh get /nodes/{{ item.node }}/{{ item.type }}/{{ item.vmid }}/config
          --output-format json
      loop: >-
        {{ (cluster_guests.stdout | from_json)
           | selectattr('vmid', 'in', backup_vmids_deste_no) | list }}
      loop_control:
        label: "{{ item.vmid }} {{ item.name | default('') }}"
      register: guest_configs
      changed_when: false
      # Consulta somente-leitura: sem isto o gate é pulado em --check e o
      # playbook aprovaria uma cobertura que ninguém mediu.
      check_mode: false

    # `selectattr('value', 'string')` antes de qualquer `match`/`search`: o
    # config traz inteiro (`cores`) e lista aninhada (`lxc`), e um teste de
    # regex contra não-string aborta a task inteira.
    - name: "Levantar o que o vzdump não vai cobrir"
      ansible.builtin.set_fact:
        backup_nao_coberto: >-
          {{ backup_nao_coberto | default([]) + (
               [{'vmid': item.item.vmid,
                 'nome': item.item.name | default(''),
                 'itens': _achados | map(attribute='key') | unique | sort | list}]
               if _achados | length > 0 else []) }}
      vars:
        _cfg: "{{ (item.stdout | from_json) | dict2items }}"
        _achados: >-
          {{ (_cfg | selectattr('key', 'match', '^(hostpci|dev)[0-9]+$') | list)
             + (_cfg | selectattr('value', 'string')
                     | selectattr('key', 'match', '^mp[0-9]+$')
                     | selectattr('value', 'match', '^/') | list)
             + (_cfg | selectattr('value', 'string')
                     | selectattr('value', 'search', 'backup=0') | list) }}
      loop: "{{ guest_configs.results }}"
      loop_control:
        label: "{{ item.item.vmid }}"

    # ⚠️ ABORTA em vez de avisar. Aviso em log de playbook é lido uma vez, no
    # dia em que se configurou; a restauração acontece meses depois, por alguém
    # com pressa. Reconhecer é declarar `backup_cobertura_parcial_ok` com os
    # VMIDs — o que deixa a decisão escrita no inventário, onde ela é revisável,
    # em vez de dissolvida no histórico do terminal.
    - name: "Abortar se algum convidado tem dado fora do backup sem reconhecimento"
      ansible.builtin.assert:
        that:
          - backup_nao_coberto | default([])
            | rejectattr('vmid', 'in', backup_cobertura_parcial_ok | default([]))
            | list | length == 0
        fail_msg: >-
          O vzdump NÃO vai salvar parte do dado destes convidados:
          {{ backup_nao_coberto | default([])
             | rejectattr('vmid', 'in', backup_cobertura_parcial_ok | default([]))
             | map('to_json') | join('; ') }}.
          O job rodaria verde e a restauração viria incompleta. Ou parametrize
          o dado de outra forma (volume de storage em vez de bind mount), ou
          declare os VMIDs em `backup_cobertura_parcial_ok` para registrar que
          a cobertura parcial é aceita — e escreva ao lado como aquele dado é
          protegido. Ver 1.2.1 no roadmap.
        success_msg: >-
          Cobertura conferida:
          {{ (backup_nao_coberto | default([]) | length) or 'nada' }} convidado(s)
          com dado fora do vzdump, todos reconhecidos.

    - name: "Dizer quais convidados deste nó entram no backup"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ backup_vmids_deste_no | join(', ') or 'nenhum' }}
          {{ '(lista declarada em backup_vmids)'
             if backup_vmids is defined and backup_vmids | length > 0
             else '(backup_vmids não declarada — todos os convidados deste nó)' }}

    # Create-or-update de verdade, em vez de `create` + engolir o erro
    # "already exists". Engolir o erro fazia a PRIMEIRA execução criar o job e
    # toda execução seguinte ser um no-op reportado como `ok`: mudar
    # `backup_vmids`, `backup_schedule`, `backup_keep_daily` ou
    # `backup_storage` no inventário não alterava nada em produção, e nada
    # avisava. O repositório passava a descrever um job que o cluster não
    # tinha.
    #
    # `/cluster/backup` TEM update — `pvesh set /cluster/backup/<id>`, o PUT
    # do endpoint, com o mesmo esquema de parâmetros do create. O comentário
    # anterior afirmava o contrário, e era essa afirmação que justificava o
    # no-op.
    - name: "Levantar os jobs de backup já configurados no cluster"
      ansible.builtin.command:
        cmd: "pvesh get /cluster/backup --output-format json"
      register: existing_backup_jobs
      changed_when: false
      # Consulta somente-leitura: sem isto ela é pulada em --check e as tasks
      # abaixo decidiriam sobre um resultado indefinido. Mesmo motivo do
      # `pvesm status` no topo do play.
      check_mode: false
      # ⚠️ SEM `run_once`, e o comentário anterior dizia o contrário: sem
      # cluster não há pmxcfs replicando `/cluster/backup` entre os nós. Cada
      # hipervisor guarda o próprio job, e precisa ser consultado e escrito.

    - name: "Separar o job deste playbook, se ele já existir"
      ansible.builtin.set_fact:
        existing_backup_job: >-
          {{ (existing_backup_jobs.stdout | from_json)
             | selectattr('id', 'defined')
             | selectattr('id', 'equalto', backup_job_id)
             | list | first | default({}) }}

    # Só decide o `changed`, não decide se aplica: o `set` abaixo roda sempre
    # que o job existe. É de propósito — uma comparação incompleta aqui erra
    # para o lado de reaplicar o estado declarado (barulho no relatório), e
    # nunca para o lado de deixar produção divergente em silêncio.
    - name: "Comparar o job existente com o estado declarado"
      ansible.builtin.set_fact:
        backup_job_drift: >-
          {{ existing_backup_job | length == 0
             or existing_backup_job.get('schedule') != backup_schedule
             or existing_backup_job.get('storage') != backup_storage
             or existing_backup_job.get('mode') != 'snapshot'
             or existing_backup_job.get('compress') != 'zstd'
             or (existing_backup_job.get('enabled', 0) | int) != 1
             or existing_backup_job.get('prune-backups', '') != backup_prune_spec
             or ((existing_backup_job.get('vmid', '') | string).split(',') | map('trim') | sort)
                != (backup_vmids_deste_no | map('string') | sort) }}

    # --vmid aceita lista separada por vírgula (formato `pve-vmid-list` da API
    # do Proxmox, o mesmo usado por vzdump.conf) — um job só cobrindo N
    # convidados mantém o id fixo endereçável. N jobs separados exigiriam N
    # ids. Ainda não confirmado contra este cluster real: validar que o job
    # criado cobre TODOS os VMIDs da lista antes de confiar nele.
    - name: "Criar o job de backup (ainda não existe no cluster)"
      ansible.builtin.command:
        argv: "{{ ['pvesh', 'create', '/cluster/backup', '--id=' ~ backup_job_id] + backup_job_params }}"
      when:
        - backup_vmids_deste_no | length > 0
        - existing_backup_job | length == 0
      register: backup_job_created
      changed_when: backup_job_created.rc == 0

    - name: "Reescrever o job de backup existente com o estado declarado"
      ansible.builtin.command:
        argv: "{{ ['pvesh', 'set', '/cluster/backup/' ~ backup_job_id] + backup_job_params }}"
      when:
        - backup_vmids_deste_no | length > 0
        - existing_backup_job | length > 0
      register: backup_job_updated
      changed_when: backup_job_drift | bool
