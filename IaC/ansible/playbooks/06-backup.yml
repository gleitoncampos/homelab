---
# Backup dos convidados do Proxmox que sustentam o Swarm.
#
# Existe porque `CLAUDE.md` promete reprodutibilidade "a partir das definições
# deste repositório E do diretório /srv/containers" — e a segunda metade não
# tinha backup nenhum. `docker service rollback` NÃO restaura bind mount: ele
# restaura a ServiceSpec. Este playbook é o único ponto de retorno real.
#
# Backup de convidado inteiro, e não restic por diretório, por ser a opção
# mais aditiva: não toca em serviço nenhum e entrega rollback de máquina
# completa.
#
#   ansible-playbook playbooks/06-backup.yml
- name: Configurar backup agendado dos convidados do Swarm
  hosts: proxmox
  # Nenhuma task deste play usa fact de host — pular a coleta é só velocidade.
  gather_facts: false

  vars:
    # Id fixo, não autogerado pela API: é o que torna o job endereçável. Sem
    # ele, cada execução criaria um job novo, e não haveria como um `set`
    # posterior saber qual atualizar.
    backup_job_id: homelab-swarm-backup

    # Um lugar só para os parâmetros do job, consumidos pelo `create` E pelo
    # `set`. Repeti-los nas duas tasks criaria duas verdades que precisam ser
    # mantidas iguais à mão — e a que ficasse para trás só apareceria em
    # produção, na forma de um job que muda de comportamento conforme tenha
    # sido criado ou atualizado.
    backup_prune_spec: "keep-daily={{ backup_keep_daily }},keep-weekly={{ backup_keep_weekly }}"
    backup_job_params:
      - "--schedule={{ backup_schedule }}"
      - "--storage={{ backup_storage }}"
      - "--vmid={{ backup_vmids | join(',') }}"
      - "--mode=snapshot"
      - "--compress=zstd"
      - "--enabled=1"
      - "--notes-template=homelab-swarm-{{ '{{' }} guestname {{ '}}' }}"
      - "--prune-backups={{ backup_prune_spec }}"

  pre_tasks:
    - name: "Abortar se backup_vmids não estiver no inventário"
      ansible.builtin.assert:
        that:
          - backup_vmids is defined
          - backup_vmids | length > 0
        fail_msg: >-
          backup_vmids não está definido, ou está vazio. É uma LISTA de
          VMIDs — sem ela não há como saber quais convidados proteger, e uma
          lista chutada faria o job apontar para o convidado errado e
          reportar sucesso. Defina em [all:vars] no hosts.ini do ambiente
          — ver hosts.ini.example.

    - name: "Abortar se backup_storage não estiver no inventário"
      ansible.builtin.assert:
        that:
          - backup_storage is defined
          - backup_storage | string | length > 0
        fail_msg: >-
          backup_storage não está definido. Sem ele não há como saber qual
          storage do Proxmox recebe o backup. Defina em [all:vars] no
          hosts.ini do ambiente — ver hosts.ini.example.

  tasks:
    - name: Conferir que o storage de backup existe e aceita backup
      ansible.builtin.command:
        cmd: "pvesm status --storage {{ backup_storage }}"
      register: storage_status
      changed_when: false
      failed_when: storage_status.rc != 0
      # Consulta somente-leitura: sem isto, o `command` é pulado em
      # --check (skipping), storage_status.stdout fica indefinido, e o
      # assert seguinte falha SEMPRE em check mode — mesmo com o storage são.
      check_mode: false

    - name: "Abortar se o storage não estiver ativo"
      ansible.builtin.assert:
        that: "'active' in storage_status.stdout"
        fail_msg: >-
          Storage {{ backup_storage }} não está ativo. Um job de backup
          apontando para storage inativo falha silenciosamente todo dia.

    - name: Levantar os convidados existentes no cluster (QEMU e LXC)
      ansible.builtin.command:
        cmd: "pvesh get /cluster/resources --type vm --output-format json"
      register: cluster_guests
      changed_when: false
      # Consulta somente-leitura, mesmo motivo do `pvesm status` acima.
      check_mode: false
      # NÃO é `qm config`: esse comando é exclusivo de convidado QEMU e
      # retorna código de erro contra um CT LXC. A topologia-alvo
      # (IaC/terraform/proxmox/main.tf) usa LXC para os nós do Swarm — com
      # `qm config`, a task de agendamento abaixo seria pulada em silêncio
      # contra o alvo, o playbook reportaria sucesso, e nenhum job de backup
      # existiria. `/cluster/resources --type vm` devolve QEMU e LXC juntos
      # (o nome do filtro é enganoso, mas é o comportamento documentado do
      # endpoint) e é cluster-wide: o resultado é o mesmo não importa de
      # qual nó a consulta roda, por isso só precisa rodar uma vez.
      run_once: true

    - name: "Guardar os VMIDs existentes no cluster"
      ansible.builtin.set_fact:
        cluster_existing_vmids: >-
          {{ (cluster_guests.stdout | from_json) | map(attribute='vmid') | list }}
      run_once: true

    - name: "Abortar se algum VMID de backup_vmids não existir no cluster"
      ansible.builtin.assert:
        that: (backup_vmids | difference(cluster_existing_vmids)) | length == 0
        fail_msg: >-
          {{ backup_vmids | difference(cluster_existing_vmids) }} de
          backup_vmids não existe em nenhum nó do cluster. Agendar backup
          para um convidado inexistente falha silenciosamente todo dia.
      run_once: true

    # Create-or-update de verdade, em vez de `create` + engolir o erro
    # "already exists". Engolir o erro fazia a PRIMEIRA execução criar o job e
    # toda execução seguinte ser um no-op reportado como `ok`: mudar
    # `backup_vmids`, `backup_schedule`, `backup_keep_daily` ou
    # `backup_storage` no inventário não alterava nada em produção, e nada
    # avisava. O repositório passava a descrever um job que o cluster não
    # tinha.
    #
    # `/cluster/backup` TEM update — `pvesh set /cluster/backup/<id>`, o PUT
    # do endpoint, com o mesmo esquema de parâmetros do create. O comentário
    # anterior afirmava o contrário, e era essa afirmação que justificava o
    # no-op.
    - name: "Levantar os jobs de backup já configurados no cluster"
      ansible.builtin.command:
        cmd: "pvesh get /cluster/backup --output-format json"
      register: existing_backup_jobs
      changed_when: false
      # Consulta somente-leitura: sem isto ela é pulada em --check e as tasks
      # abaixo decidiriam sobre um resultado indefinido. Mesmo motivo do
      # `pvesm status` no topo do play.
      check_mode: false
      # /cluster/backup é configuração replicada entre nós pelo pmxcfs: a
      # resposta é a mesma de qualquer nó, e criar/atualizar de um só basta.
      run_once: true

    - name: "Separar o job deste playbook, se ele já existir"
      ansible.builtin.set_fact:
        existing_backup_job: >-
          {{ (existing_backup_jobs.stdout | from_json)
             | selectattr('id', 'defined')
             | selectattr('id', 'equalto', backup_job_id)
             | list | first | default({}) }}
      run_once: true

    # Só decide o `changed`, não decide se aplica: o `set` abaixo roda sempre
    # que o job existe. É de propósito — uma comparação incompleta aqui erra
    # para o lado de reaplicar o estado declarado (barulho no relatório), e
    # nunca para o lado de deixar produção divergente em silêncio.
    - name: "Comparar o job existente com o estado declarado"
      ansible.builtin.set_fact:
        backup_job_drift: >-
          {{ existing_backup_job | length == 0
             or existing_backup_job.get('schedule') != backup_schedule
             or existing_backup_job.get('storage') != backup_storage
             or existing_backup_job.get('mode') != 'snapshot'
             or existing_backup_job.get('compress') != 'zstd'
             or (existing_backup_job.get('enabled', 0) | int) != 1
             or existing_backup_job.get('prune-backups', '') != backup_prune_spec
             or ((existing_backup_job.get('vmid', '') | string).split(',') | map('trim') | sort)
                != (backup_vmids | map('string') | sort) }}
      run_once: true

    # --vmid aceita lista separada por vírgula (formato `pve-vmid-list` da API
    # do Proxmox, o mesmo usado por vzdump.conf) — um job só cobrindo N
    # convidados mantém o id fixo endereçável. N jobs separados exigiriam N
    # ids. Não confirmado contra este cluster real — ver
    # PENDENCIAS-VALIDACAO.md, item "Confirmar que o job cobre TODOS os VMIDs
    # da lista".
    - name: "Criar o job de backup (ainda não existe no cluster)"
      ansible.builtin.command:
        argv: "{{ ['pvesh', 'create', '/cluster/backup', '--id=' ~ backup_job_id] + backup_job_params }}"
      when: existing_backup_job | length == 0
      run_once: true
      register: backup_job_created
      changed_when: backup_job_created.rc == 0

    - name: "Reescrever o job de backup existente com o estado declarado"
      ansible.builtin.command:
        argv: "{{ ['pvesh', 'set', '/cluster/backup/' ~ backup_job_id] + backup_job_params }}"
      when: existing_backup_job | length > 0
      run_once: true
      register: backup_job_updated
      changed_when: backup_job_drift | bool
