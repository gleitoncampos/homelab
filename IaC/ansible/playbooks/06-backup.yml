---
# Backup da VM que roda o Swarm.
#
# Existe porque `CLAUDE.md` promete reprodutibilidade "a partir das definições
# deste repositório E do diretório /srv/containers" — e a segunda metade não
# tinha backup nenhum. `docker service rollback` NÃO restaura bind mount: ele
# restaura a ServiceSpec. Este playbook é o único ponto de retorno real.
#
# Backup de VM inteira, e não restic por diretório, por ser a opção mais
# aditiva: não toca em serviço nenhum e entrega rollback de máquina completa.
#
#   ansible-playbook playbooks/06-backup.yml
- name: Configurar backup agendado da VM do Swarm
  hosts: proxmox
  # Nenhuma task deste play usa fact de host — pular a coleta é só velocidade.
  gather_facts: false

  pre_tasks:
    - name: "Abortar se backup_vmid_swarm não estiver no inventário"
      ansible.builtin.assert:
        that:
          - backup_vmid_swarm is defined
          - backup_vmid_swarm | string | length > 0
        fail_msg: >-
          backup_vmid_swarm não está definido. Sem ele o vzdump salvaria a VM
          errada e reportaria sucesso. Defina em [all:vars] no hosts.ini do
          ambiente — ver hosts.ini.example.

    - name: "Abortar se backup_storage não estiver no inventário"
      ansible.builtin.assert:
        that:
          - backup_storage is defined
          - backup_storage | string | length > 0
        fail_msg: >-
          backup_storage não está definido. Sem ele não há como saber qual
          storage do Proxmox recebe o backup. Defina em [all:vars] no
          hosts.ini do ambiente — ver hosts.ini.example.

  tasks:
    - name: Conferir que o storage de backup existe e aceita backup
      ansible.builtin.command:
        cmd: "pvesm status --storage {{ backup_storage }}"
      register: storage_status
      changed_when: false
      failed_when: storage_status.rc != 0
      # Consulta somente-leitura: sem isto, o `command` é pulado em
      # --check (skipping), storage_status.stdout fica indefinido, e o
      # assert seguinte falha SEMPRE em check mode — mesmo com o storage são.
      check_mode: false

    - name: "Abortar se o storage não estiver ativo"
      ansible.builtin.assert:
        that: "'active' in storage_status.stdout"
        fail_msg: >-
          Storage {{ backup_storage }} não está ativo. Um job de backup
          apontando para storage inativo falha silenciosamente todo dia.

    - name: Conferir que a VM alvo existe neste nó
      ansible.builtin.command:
        cmd: "qm config {{ backup_vmid_swarm }}"
      register: vm_config
      changed_when: false
      failed_when: false
      # Mesmo motivo da task acima: consulta somente-leitura, precisa rodar
      # em --check para a task de agendamento decidir changed/skipped certo.
      check_mode: false

    - name: Agendar o job de backup
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/backup
          - --id=homelab-swarm-backup
          - --schedule={{ backup_schedule }}
          - --storage={{ backup_storage }}
          - --vmid={{ backup_vmid_swarm }}
          - --mode=snapshot
          - --compress=zstd
          - --enabled=1
          - --notes-template=homelab-swarm-{{ '{{' }} guestname {{ '}}' }}
          - --prune-backups=keep-daily={{ backup_keep_daily }},keep-weekly={{ backup_keep_weekly }}
      # --id fixo é o que torna a idempotência real: o campo `id` do endpoint
      # /cluster/backup é opcional e AUTOGERADO quando omitido — sem um valor
      # determinístico, cada execução cria um job novo (nunca colide), o
      # 'already exists' do failed_when abaixo nunca aparece, e rodar o
      # playbook duas vezes agenda o mesmo backup duas vezes em silêncio.
      when: vm_config.rc == 0
      register: backup_job
      changed_when: backup_job.rc == 0
      # Já existir não é erro: o playbook é idempotente por natureza aqui, e o
      # pvesh não tem create-or-update para /cluster/backup.
      failed_when:
        - backup_job.rc != 0
        - "'already exists' not in (backup_job.stderr | default(''))"
