---
- name: "OPNsense - Padronização, Instalação de Plugins e Restauração de Configuração"
  hosts: opnsense
  become: true
  gather_facts: false
  # Constantes de protocolo (Suricata HOME_NET, lista de privatização do
  # Unbound) — o mesmo valor em prod e dev, por isso vars_files direto no
  # play em vez de group_vars duplicado por ambiente. Ver o comentário em
  # inventories/_common/opnsense.yml.
  vars_files:
    - "../../inventories/_common/opnsense.yml"
  pre_tasks:
    # Este play SUBSTITUI o /conf/config.xml inteiro e recarrega tudo. Se um
    # segredo faltar, o firewall receberia senha vazia e o acesso à GUI e a WAN
    # cairiam. Por isso a validação vem antes de qualquer escrita, e nenhuma
    # dessas variáveis tem `| default(...)`.
    - name: Validar segredos do Vault exigidos por este play
      ansible.builtin.include_tasks: "../../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - opnsense_root_password_hash
          - opnsense_admin_username
          - opnsense_admin_password_hash
          - opnsense_pppoe_username
          - opnsense_pppoe_password_b64
          - opnsense_gui_cert_crt_b64
          - opnsense_gui_cert_key_b64
          # Sem chave, o apply instala permitrootlogin=0 +
          # passwordauth=0 e a PRÓXIMA execução não conecta.
          - opnsense_admin_authorizedkeys_b64

    # =====================================================================
    # GATE DE IDENTIDADE — o apply não pode renomear o equipamento
    # =====================================================================
    # ⚠️ `opnsense_hostname` vinha de um `| default('opnsense')` no template, e o
    # equipamento se chama outra coisa. Um apply o renomearia sem aviso: o
    # hostname entra no arquivo de configuração como qualquer outro campo, e
    # nada na saída do playbook denuncia a troca.
    #
    # ⚠️ Tirar o default do template NÃO fecha o buraco, e é aqui que a
    # intuição erra. `10-defaults.yml` é VERSIONADO e sempre entrega um valor,
    # então o StrictUndefined nunca dispara — sem `99-local.yml` o render sai
    # limpo, com o nome de documentação. Só este assert vê a diferença.
    #
    # Recusa qualquer nome terminado em `.example` (RFC 2606), que é a marca
    # dos valores de documentação, do mesmo jeito que `validate_vault.yml`
    # recusa o prefixo `TROCAR-`. Nome real vive em `99-local.yml`, que é
    # gitignorado — hostname de equipamento não vai para repositório público.
    - name: Abortar se o hostname ainda é o valor de documentação
      ansible.builtin.assert:
        that:
          - opnsense_hostname is defined
          - opnsense_hostname | string | length > 0
          - not (opnsense_hostname | string).endswith('.example')
        fail_msg: >-
          opnsense_hostname está em "{{ opnsense_hostname | default('(indefinido)') }}", que é o
          valor de documentação de `10-defaults.yml`. Aplicar assim RENOMEIA o
          equipamento. Defina o nome real em
          inventories/{{ homelab_env | default('prod') }}/group_vars/network/99-local.yml
          (gitignorado). Ver 1.1.5 no roadmap.
        success_msg: "Identidade: {{ opnsense_hostname }}"

    - name: Validar que todo objeto do OPNsense tem UUID
      ansible.builtin.assert:
        that:
          - item.valor | selectattr('uuid', 'defined') | list | length == item.valor | length
        fail_msg: >-
          {{ item.nome }}: item(ns) sem 'uuid' —
          {{ item.valor | selectattr('uuid', 'undefined') | list }}.
          UUID é identidade — o config referencia objeto por UUID (o monit
          lista UUIDs de teste, a reserva do Kea aponta para o UUID da
          subnet, e _system.xml.j2 seleciona segredo do vault por UUID
          literal de usuário). Gerar um novo a cada render quebra esses
          vínculos e destrói o teste de equivalência.
      loop:
        - { nome: "opnsense_tunables", valor: "{{ opnsense_tunables }}" }
        - { nome: "opnsense_aliases", valor: "{{ opnsense_aliases }}" }
        - { nome: "opnsense_rules", valor: "{{ opnsense_rules }}" }
        - { nome: "opnsense_groups", valor: "{{ opnsense_groups }}" }
        - { nome: "opnsense_users", valor: "{{ opnsense_users }}" }
      loop_control:
        label: "{{ item.nome }}"

    - name: Validar que nenhum UUID do OPNsense está duplicado
      ansible.builtin.assert:
        that:
          - item.valor | map(attribute='uuid') | unique | length == item.valor | length
        fail_msg: >-
          {{ item.nome }}: UUID duplicado —
          {{ item.valor | map(attribute='uuid') | list | community.general.counter
             | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}.
          Dois objetos com o mesmo UUID fazem um sumir do modelo, sem erro —
          em opnsense_users isso troca o hash de senha e o nome que o
          _system.xml.j2 seleciona por UUID literal (root em vez de admin,
          ou vice-versa), e este play em seguida aplica permitrootlogin=0 +
          passwordauth=0, trancando o próximo acesso.
      loop:
        - { nome: "opnsense_tunables", valor: "{{ opnsense_tunables }}" }
        - { nome: "opnsense_aliases", valor: "{{ opnsense_aliases }}" }
        - { nome: "opnsense_rules", valor: "{{ opnsense_rules }}" }
        - { nome: "opnsense_groups", valor: "{{ opnsense_groups }}" }
        - { nome: "opnsense_users", valor: "{{ opnsense_users }}" }
      loop_control:
        label: "{{ item.nome }}"

    # A topologia real vive em `group_vars/network/99-local.yml`, que é
    # gitignorado; ao lado dele o `10-defaults.yml` versionado declara a mesma
    # estrutura com endereços de documentação. Num clone sem o arquivo local o
    # inventário continua VÁLIDO — de propósito, para que um terceiro consiga
    # ler e testar o repositório. O preço é um modo de falha novo: sem a trava
    # abaixo, este play rodaria até o fim e reescreveria o firewall com a rede
    # de documentação, o que é pior que abortar, porque não parece um erro.
    - name: Recusar aplicar com endereço de documentação (99-local.yml ausente)
      ansible.builtin.assert:
        that:
          - lan_ipaddr is not match('^(192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|198\\.1[89]\\.)')
          - vlans | map(attribute='ip') | select('match', '^(192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|198\\.1[89]\\.)') | list | length == 0
          # A origem das exceções por host entra no mesmo gate. Ela NÃO é
          # coberta pelas duas linhas acima — é campo novo, e um endereço de
          # documentação aqui geraria regra apontando para um host que não
          # existe: a exceção some sem erro, e quem depende dela descobre
          # tentando administrar.
          - >-
            vlans | selectattr('politica.excecoes', 'defined')
                  | map(attribute='politica.excecoes') | flatten
                  | map(attribute='origem')
                  | select('match', '^(192\\.0\\.2\\.|198\\.51\\.100\\.|203\\.0\\.113\\.|198\\.1[89]\\.)')
                  | list | length == 0
        fail_msg: >-
          A topologia carregada é a de documentação, não a real. Falta
          inventories/{{ homelab_env | default('prod') }}/group_vars/network/99-local.yml
          — restaure-o do backup (ele fica junto do vault e do hosts.ini) antes
          de aplicar. Ver IaC/ansible/README.md.
        success_msg: "Topologia real carregada."

    # =====================================================================
    # GATE DA ORDEM DE APLICAÇÃO — elo 1+2 da migração de VLANs
    # =====================================================================
    # O apply do firewall é o PRIMEIRO elo da migração, e os dois assertos
    # abaixo existem porque criar as interfaces de VLAN e escrever a política
    # de passagem delas NÃO podem ser dois passos: entre um e outro a rede
    # segmentada fica no chão, e a queda é silenciosa dos dois lados.
    #
    # Um asserto para cada metade do buraco, e eles são simétricos:
    #   regra citando interface que o config não cria  -> regra sem efeito
    #   interface criada sem regra de passagem         -> rede sem tráfego
    #
    # ⚠️ Os dois falham HOJE, e é o comportamento correto: `opnsense_rules`
    # cita `vlan10`..`vlan50`, `_interfaces.xml.j2` não cria VLAN nenhuma, e
    # nenhuma VLAN tem regra de passagem irrestrita. O gate transforma um
    # apply que sairia calado numa recusa antes da primeira escrita.

    - name: Abortar se uma regra de filtro citar interface que o config não cria
      vars:
        # Interfaces que `_interfaces.xml.j2` de fato emite: as fixas mais uma
        # por VLAN. O nome da interface de VLAN é `vlan<tag>` e NÃO `optN` —
        # `opt1` já é a segunda WAN, e as regras referenciam `vlan10`..`vlan60`
        # como identificador. Trocar a convenção aqui quebra as 13 regras.
        _ifaces_do_config: >-
          {{ ['lan', 'wan', 'lo0', 'opt1']
             + (vlans | map(attribute='tag') | map('string')
                      | map('regex_replace', '^', 'vlan') | list) }}
        # `interface` é lista separada por vírgula no config do OPNsense.
        # regex_findall em vez de `.split(',')`: filtro do Ansible, sem
        # encadear método de string num `>-` multilinha.
        _ifaces_das_regras: >-
          {{ opnsense_rules | selectattr('interface', 'defined')
                            | map(attribute='interface') | select()
                            | join(',') | regex_findall('[^,]+')
                            | unique | list }}
      ansible.builtin.assert:
        that:
          - _ifaces_das_regras | difference(_ifaces_do_config) | length == 0
        fail_msg: >-
          Regra de filtro cita interface inexistente no config:
          {{ _ifaces_das_regras | difference(_ifaces_do_config) | sort | join(', ') }}.
          O OPNsense NÃO recusa isso — ele grava a regra e ela nunca casa
          pacote nenhum, então a política some sem erro. Crie a interface em
          templates/network/opnsense/_interfaces.xml.j2 (uma por entrada de
          `vlans`, nomeada `vlan<tag>`) ou corrija o campo `interface` da
          regra. Ver .local/docs/TODO-E-ROADMAP.md, item 1.1.8, elo 1+2.
        success_msg: "Toda regra de filtro aponta para interface que o config cria."

    - name: Abortar se uma VLAN não declarar política de passagem completa
      vars:
        # A passagem NÃO vem mais de `opnsense_rules`: ela é derivada de
        # `politica` por _filter.xml.j2. Por isso o gate mudou de alvo — antes
        # ele procurava a regra, e a regra passou a ser consequência. Procurar
        # a consequência daria verde no dia em que a política sumisse e as
        # regras ficassem de uma execução anterior.
        _chaves_exigidas: ['internet', 'alcanca', 'gerencia']
        _sem_politica: >-
          {{ vlans | rejectattr('politica', 'defined')
                   | map(attribute='tag') | list }}
        # Uma união por chave exigida, em vez de comparar o conjunto de
        # chaves: `rejectattr` só aceita caminho de atributo, não expressão —
        # `politica.keys() | list | sort` vira nome de atributo literal e
        # estoura com "dict object has no attribute". Custou uma execução.
        _politica_incompleta: >-
          {{ (vlans | selectattr('politica', 'defined')
                    | rejectattr('politica.internet', 'defined') | list
              + vlans | selectattr('politica', 'defined')
                      | rejectattr('politica.alcanca', 'defined') | list
              + vlans | selectattr('politica', 'defined')
                      | rejectattr('politica.gerencia', 'defined') | list)
             | map(attribute='tag') | unique | list }}
      ansible.builtin.assert:
        that:
          - _sem_politica | length == 0
          - _politica_incompleta | length == 0
        fail_msg: >-
          VLAN sem política de passagem declarada.
          Sem `politica`: {{ _sem_politica | sort | join(', ') or 'nenhuma' }}.
          Com `politica` incompleta (exige {{ _chaves_exigidas | join(', ') }}):
          {{ _politica_incompleta | sort | join(', ') or 'nenhuma' }}.
          O OPNsense nega por padrão, então uma VLAN sem política sobe, o DHCP
          entrega endereço e o cliente não fala com nada — parece problema de
          equipamento, não de firewall. Declare `politica` na entrada da VLAN
          em group_vars/network/. Isolamento total é uma resposta legítima
          (`internet: false`, `alcanca: []`), desde que ESCRITA. Ver
          .local/docs/TODO-E-ROADMAP.md, item 1.1.6.
        success_msg: "Toda VLAN declara política de passagem completa."
  tasks:
    # Sem ignore_errors: se o backup falhar, ABORTA. A task seguinte sobrescreve
    # o /conf/config.xml inteiro — seguir sem cópia de segurança deixaria o
    # firewall sem ponto de retorno.
    - name: Fazer backup da configuração atual do OPNsense no servidor remoto com timestamp
      ansible.builtin.shell: "cp /conf/config.xml /conf/config.xml.bak.$(date +%Y%m%d_%H%M%S)"
      changed_when: true

    - name: Garantir a instalação dos plugins essenciais (lista única em _common/opnsense.yml)
      ansible.builtin.command: "pkg install -y {{ item }}"
      loop: "{{ opnsense_plugins }}"
      register: opn_plugins
      failed_when: false
      changed_when: "'Installing' in opn_plugins.stdout"

    # A instalação acima não aborta: um plugin ausente do repositório não pode
    # derrubar os outros onze. Mas o resultado tem de aparecer — antes o
    # `ignore_errors` engolia a lista inteira em silêncio.
    - name: Avisar sobre plugins do OPNsense que não instalaram
      ansible.builtin.debug:
        msg: "Plugin não instalado: {{ item.item }} (rc={{ item.rc }})"
      loop: "{{ opn_plugins.results | selectattr('rc', 'ne', 0) | list }}"
      loop_control:
        label: "{{ item.item }}"

    # firmware/plugins é campo derivado: declarar não instala. Esta é a única
    # verificação que distingue "declarado" de "presente".
    - name: Conferir que cada plugin declarado está de fato instalado
      ansible.builtin.command: "pkg info -e {{ item }}"
      loop: "{{ opnsense_plugins }}"
      register: opn_pkg_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Abortar se algum plugin exigido não foi instalado
      ansible.builtin.assert:
        that: "item.rc == 0"
        fail_msg: >-
          Plugin {{ item.item }} não está instalado. O config declara-o em
          firmware/plugins, mas declarar não instala — e a configuração dele
          seria escrita sem efeito.
      loop: "{{ opn_pkg_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Habilitar módulos de sensores térmicos de CPU em /boot/loader.conf
      ansible.builtin.lineinfile:
        path: /boot/loader.conf
        line: "{{ item }}"
        create: true
        owner: root
        group: wheel
        mode: '0644'
      loop:
        - 'coretemp_load="YES"'
        - 'amdtemp_load="YES"'

    # Um dos dois SEMPRE falha: coretemp é Intel, amdtemp é AMD. Falhar aqui é o
    # comportamento correto do kldload, não um erro de execução.
    - name: Carregar módulos térmicos no kernel em tempo de execução
      ansible.builtin.command: "kldload {{ item }}"
      loop:
        - coretemp
        - amdtemp
      register: kld
      failed_when: false
      changed_when: kld.rc == 0

    - name: Configurar Banner Legal de Aviso no SSH (/etc/motd)
      ansible.builtin.copy:
        dest: /etc/motd
        content: |
          ====================================================================
          ⚠️  AVISO DE SEGURANÇA - ACESSO RESTRITO AO OPNsense HOMELAB
          ====================================================================
          Este sistema e exclusivo para uso autorizado. Todo acesso e comandos
          executados via SSH sao monitorados e registrados em log continuo.
          Acessos nao autorizados estao sujeitos a bloqueio e auditoria.
          ====================================================================
        owner: root
        group: wheel
        mode: '0644'

    # =====================================================================
    # MÉTRICAS DE GATEWAY (dpinger) PARA O PROMETHEUS
    # =====================================================================
    # =====================================================================
    # ELEVAÇÃO DO USUÁRIO DO ANSIBLE
    # =====================================================================
    # Sem isto, TODO este play falha em `Missing sudo password` antes de tocar
    # em nada: o `ansible.cfg` tem `become_ask_pass = False` e não existe
    # `ansible_become_password` em vault nenhum.
    #
    # Escopado a UMA conta, e não ao grupo `wheel` inteiro via
    # `<sudo_allow_wheel>2</sudo_allow_wheel>` no config. A capacidade efetiva
    # é a mesma — quem escreve /conf/config.xml é root de fato — mas a
    # superfície é menor e o arquivo é greppável.
    #
    # ⚠️ `validate` não é zelo: sudoers com erro de sintaxe tranca o sudo do
    # firewall, e recuperar exige console. O `visudo -cf` roda ANTES de o
    # arquivo entrar no lugar.
    #
    # O dono é o admin nomeado, não `ansible_user`: o 1º apply de um firewall
    # novo roda como root (o admin ainda não existe) e o MESMO apply desliga o
    # login de root (`permitrootlogin=0`). Gravar para `ansible_user` dava
    # sudoers ao root e deixava o admin — o usuário de todas as execuções
    # seguintes — sem sudo sem senha: a 2ª execução não tinha como entrar.
    #
    # ⚠️ OVO E GALINHA: esta tarefa precisa de sudo para rodar. O primeiro
    # arquivo foi instalado fora de banda em 31/08/2026, pelo qemu-guest-agent
    # a partir do hipervisor (`qm guest exec 100`, que executa como root sem
    # senha). Daqui em diante o playbook o mantém. Num firewall novo, o mesmo
    # caminho serve de bootstrap — está no roadmap, item 1.1.2.
    - name: Manter a elevação sem senha do usuário do Ansible
      tags: always
      ansible.builtin.copy:
        dest: /usr/local/etc/sudoers.d/30-ansible
        content: |
          # Gerado pelo Ansible (01-opnsense-setup.yml). NAO editar a mao.
          {{ opnsense_admin_username }} ALL=(ALL) NOPASSWD: ALL
        owner: root
        group: wheel
        mode: '0440'
        validate: 'visudo -cf %s'

    # ⚠️ Nada aqui depende do apply do config.xml, e é deliberado. A primeira
    # versão agendava a coleta como `<job>` no config — caminho nativo do
    # OPNsense e visível na GUI — mas isso faz um coletor de métricas depender
    # da reescrita COMPLETA do firewall para subir ou mudar de intervalo. Nesta
    # base o apply completo está travado por outros itens, então o coletor
    # nasceria morto. O drop-in de `/usr/local/etc/cron.d/` desacopla.
    #
    # O preço é real e vale dizer: o job não aparece na página de cron da GUI.
    #
    # O caminho inteiro reaproveita o que já está de pé: o coletor `textfile`
    # do node_exporter (já ligado nesta caixa) lê o diretório, e o job
    # `opnsense` do Prometheus já raspa a porta 9100. Nenhum serviço novo,
    # nenhuma porta nova, nenhuma chave de API.
    - name: Instalar o coletor de métricas de gateway  # noqa: no-relative-paths
      tags: metricas
      ansible.builtin.template:
        src: "../../templates/network/opnsense/gateway_metrics.sh.j2"
        dest: "{{ opnsense_gateway_metrics_script | default('/usr/local/bin/gateway-metrics') }}"
        owner: root
        group: wheel
        mode: '0755'

    # O cron do OPNsense lê este diretório além do crontab do root — mesmo
    # mecanismo que crowdsec e etpro-telemetry usam. Formato do /etc/crontab do
    # FreeBSD, com a coluna `who`.
    - name: Agendar a coleta de métricas de gateway  # noqa: no-relative-paths
      tags: metricas
      ansible.builtin.template:
        src: "../../templates/network/opnsense/gateway_metrics.cron.j2"
        dest: /usr/local/etc/cron.d/gateway-metrics
        owner: root
        group: wheel
        mode: '0644'

    # O diretório é do node_exporter e nasce com ele; garantir aqui evita que a
    # primeira coleta caia num diretório inexistente e saia em silêncio (o
    # script tem `[ -d "$DIR" ] || exit 0` justamente para não escrever fora).
    - name: Garantir o diretório do coletor textfile do node_exporter
      tags: metricas
      ansible.builtin.file:
        path: "{{ opnsense_gateway_metrics_dir | default('/var/tmp/node_exporter') }}"
        state: directory
        owner: nobody
        group: nobody
        mode: '1755'

    # no_log: o arquivo renderizado contém hashes de senha, a credencial PPPoE e
    # a chave privada TLS da GUI. validate: XML inválido aborta ANTES de escrever.
    - name: Aplicar novo arquivo /conf/config.xml a partir do Template Jinja2  # noqa: no-relative-paths
      ansible.builtin.template:
        src: "../../templates/network/opnsense/config.xml.j2"
        dest: /conf/config.xml
        owner: root
        group: wheel
        mode: '0640'
        backup: true
        validate: 'xmllint --noout %s'
      no_log: true

    - name: Recarregar todos os serviços e regras do OPNsense sem reiniciar
      ansible.builtin.command: /usr/local/etc/rc.reload_all
      changed_when: true

    - name: Garantir que os serviços do Node Exporter, QEMU Guest Agent e Monit estejam ativos
      ansible.builtin.command: "{{ item }}"
      loop:
        - /usr/local/etc/rc.d/node_exporter restart
        - /usr/local/etc/rc.d/qemu-guest-agent restart
        - /usr/local/etc/rc.d/monit restart
      register: opn_services
      failed_when: false
      changed_when: opn_services.rc == 0

    - name: Exibir confirmação do OPNsense
      ansible.builtin.debug:
        msg: >-
          🛡️ OPNsense atualizado: plugins essenciais instalados, sensores térmicos
          carregados, config.xml aplicado e serviços recarregados.

