---
# ==============================================================================
# Exportador de métricas do ponto de acesso
# ==============================================================================
# ⚠️ PLAYBOOK PRÓPRIO, e não uma tag dentro de `02-openwrt-setup.yml`. O motivo
# não é organização: aquele play tem, em `pre_tasks` com `tags: always`, o gate
# da ordem de migração de VLANs — um ping no gateway da VLAN de gerência, que
# ainda não existe. `always` roda mesmo com `--tags`, então NÃO há tag capaz de
# instalar o exportador por lá enquanto a migração não acontecer.
#
# E não deveria haver: aquele gate protege a escrita de rede, que isola o AP se
# rodar fora de ordem. Instalar pacote de métrica não escreve rede nenhuma e não
# pode ficar refém de uma migração que depende de outro equipamento.
#
# Mesmo princípio já aplicado em `00-proxmox-setup.yml` e `00-omv-setup.yml`,
# onde o exportador saiu para uma tag: ligar coleta não pode exigir o risco do
# playbook inteiro. Aqui a separação precisou ser mais forte, em arquivo.
#
#   ansible-playbook playbooks/network/02-openwrt-exporter.yml
- name: "OpenWrt - Exportador de métricas (sem dependência da migração de VLANs)"
  hosts: openwrt
  # OpenWrt não tem Python: todo comando vai por `raw`, e fact não é coletável.
  gather_facts: false

  tasks:
    # O AP saiu da rede plana para a VLAN de gerência (porta SSH própria) na
    # migração de VLANs; o `hosts.ini` segue no endereço antigo. Mesma
    # localização do 02-openwrt-setup.yml: se a gerência atende, é lá.
    - name: Localizar o AP — sondar o endereço da VLAN de gerência
      ansible.builtin.wait_for:
        host: "{{ openwrt_mgmt_ip }}"
        port: "{{ openwrt_ssh_port }}"
        timeout: 5
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      check_mode: false
      register: _ap_na_vlan

    - name: Apontar o inventário para a VLAN de gerência se o AP já estiver lá
      ansible.builtin.set_fact:
        ansible_host: "{{ openwrt_mgmt_ip }}"
        ansible_port: "{{ openwrt_ssh_port }}"
      when: (_ap_na_vlan.state | default('')) == 'started'

    # ⚠️ LEITURA separada da ESCRITA, e não uma task só que decide por dentro.
    # A primeira versão fazia tudo num `raw`, e em `--check` o módulo é pulado:
    # o registro ficava sem `stdout` e a task seguinte morria com
    # "'dict object' has no attribute 'stdout'". Pior que o erro, o efeito —
    # `--check` deixava de servir como pré-voo justamente aqui.
    #
    # Separando, a leitura roda em check (`check_mode: false`, é só consulta) e
    # o playbook passa a DIZER quais pacotes faltam sem instalar nada.
    - name: Levantar quais pacotes do exportador faltam
      ansible.builtin.raw: |
        {{ lookup('file', '../../templates/network/openwrt_pkg.sh') }}
        for p in {{ openwrt_exporter_packages | join(' ') }}; do
          pkg_tem "$p" || echo "$p"
        done
      register: openwrt_faltam
      changed_when: false
      check_mode: false

    - name: Guardar a lista de ausentes
      ansible.builtin.set_fact:
        openwrt_exporter_ausentes: >-
          {{ openwrt_faltam.stdout_lines | map('trim')
             | select('match', '^prometheus-node-exporter-lua') | list }}

    - name: Dizer o que será feito
      ansible.builtin.debug:
        msg: >-
          {{ 'Todos os %d pacotes já estão instalados.'
             | format(openwrt_exporter_packages | length)
             if openwrt_exporter_ausentes | length == 0
             else 'Faltam %d: %s' | format(openwrt_exporter_ausentes | length,
                                           openwrt_exporter_ausentes | join(', ')) }}

    # ⚠️ A atualização das listas só roda quando falta pacote. Ela baixa as
    # listas para /var, que é tmpfs: repetir a cada execução gasta RAM de um
    # equipamento com 241 MB, sem ganho nenhum quando tudo já está instalado.
    # opkg ou apk pelo helper; rc impresso por pacote (ver openwrt_pkg.sh).
    - name: Instalar os pacotes ausentes do exportador
      ansible.builtin.raw: |
        {{ lookup('file', '../../templates/network/openwrt_pkg.sh') }}
        pkg_atualiza_listas
        for p in {{ openwrt_exporter_ausentes | join(' ') }}; do
          pkg_instala "$p"; echo "EXP:$p:rc=$?"
        done
        echo EXP:FIM
      when: openwrt_exporter_ausentes | length > 0
      register: openwrt_instalacao
      changed_when: "'Installing' in openwrt_instalacao.stdout"
      failed_when: >-
        'EXP:FIM' not in openwrt_instalacao.stdout
        or openwrt_instalacao.stdout is search('EXP:[^:]+:rc=[1-9]')

    # O exportador escutava na `lan`, que deixou de existir na migração de
    # VLANs: sem interface, não abria porta nenhuma (13/10/2026). Escuta na
    # interface de gerência, a mesma do dropbear (openwrt_dropbear.j2).
    # Trava em tests/gates_monitoring.py.
    - name: Pôr o exportador na interface de gerência
      ansible.builtin.raw: |
        alvo='vlan{{ openwrt_mgmt_vlan }}'
        if [ "$(uci -q get prometheus-node-exporter-lua.main.listen_interface)" = "$alvo" ]; then
          echo IFACE:OK
        else
          uci set prometheus-node-exporter-lua.main.listen_interface="$alvo" &&
          uci commit prometheus-node-exporter-lua &&
          /etc/init.d/prometheus-node-exporter-lua restart && sleep 2 && echo IFACE:TROCADA
        fi
      register: _exporter_iface
      changed_when: "'IFACE:TROCADA' in _exporter_iface.stdout"
      failed_when: "'IFACE:' not in _exporter_iface.stdout"

    # Firmware e pacotes pendentes, como o apt_upgrades_pending dos Proxmox:
    # o script escreve no diretório do coletor `textfile` (pacote
    # prometheus-node-exporter-lua-textfile, em openwrt_exporter_packages).
    # ⚠️ Delimitador próprio no heredoc: o script tem um `<<EOF` interno, e um
    # `EOF` aqui fecharia a gravação no meio dele.
    - name: Instalar o script de checagem de updates do OpenWrt
      ansible.builtin.raw: |
        cat << 'IAC_UPDATE_METRICS' > /usr/bin/openwrt-update-metrics
        {{ lookup('template', '../../templates/network/openwrt_update_metrics.sh.j2') }}
        IAC_UPDATE_METRICS
        chmod +x /usr/bin/openwrt-update-metrics
      changed_when: true

    # De hora em hora: /var é tmpfs e o arquivo some no boot. A checagem de
    # pacotes se limita sozinha a uma a cada 24 h (ver o script).
    - name: Agendar a checagem de updates no cron do OpenWrt
      ansible.builtin.raw: >-
        (crontab -l 2>/dev/null | grep -v openwrt-update-metrics;
        echo "17 * * * * /usr/bin/openwrt-update-metrics") | crontab -
        && /etc/init.d/cron enable && /etc/init.d/cron restart
      changed_when: true

    - name: Rodar a checagem uma vez agora
      ansible.builtin.raw: /usr/bin/openwrt-update-metrics && grep -v '^#' /var/prometheus/openwrt_update.prom
      register: _update_metrics
      changed_when: false
      failed_when: "'openwrt_firmware_update_level' not in _update_metrics.stdout"

    # ⚠️ O exportador lista os coletores UMA VEZ, na partida
    # (`ls .../prometheus-collectors/*.lua`): coletor instalado depois do
    # start não aparece até reiniciar — o textfile ficou no disco e fora do
    # /metrics (14/10/2026). Conferir pelo que é servido, e não pela
    # instalação, também cura um AP que já estava nesse estado.
    - name: Garantir que o exportador publica as métricas de update
      ansible.builtin.raw: |
        url="http://{{ ansible_host }}:{{ node_exporter_port | default(9100) }}/metrics"
        if wget -qO- "$url" | grep -q '^openwrt_firmware_update_level'; then
          echo TEXTFILE:OK
        else
          /etc/init.d/prometheus-node-exporter-lua restart && sleep 2 &&
          wget -qO- "$url" | grep -q '^openwrt_firmware_update_level' && echo TEXTFILE:REINICIADO
        fi
      register: _textfile
      changed_when: "'TEXTFILE:REINICIADO' in _textfile.stdout"
      failed_when: "'TEXTFILE:' not in _textfile.stdout"

    # ⚠️ A sonda vai contra o ENDEREÇO DO INVENTÁRIO, e não contra 127.0.0.1.
    # No OpenWrt o exportador é um CGI do `uhttpd`, que escuta no endereço da
    # interface e NÃO no loopback — uma sonda em 127.0.0.1 devolve zero métrica
    # e faria este playbook falhar num equipamento perfeitamente saudável.
    # Medido em 02/09/2026: 0 séries pelo loopback, 835 pelo endereço da LAN.
    #
    # É também o mesmo endereço que o Prometheus raspa, então a sonda exercita o
    # caminho de verdade, e não um equivalente.
    - name: Conferir que o exportador está servindo métrica
      ansible.builtin.raw: |
        n=$(wget -qO- "http://{{ ansible_host }}:{{ node_exporter_port | default(9100) }}/metrics" 2>/dev/null | grep -c '^node_')
        echo "SERIES:$n"
        [ "$n" -gt 0 ]
      register: openwrt_sonda
      changed_when: false
      check_mode: false
      failed_when: openwrt_sonda.rc != 0

    - name: Dizer quantas séries o exportador publica
      ansible.builtin.debug:
        msg: "{{ openwrt_sonda.stdout_lines | select('search', 'SERIES') | first | default('sem resposta') }}"
