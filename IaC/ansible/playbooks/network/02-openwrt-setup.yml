---
- name: "OpenWrt - Padronização via Templates UCI (Syslog, System, Firewall)"
  hosts: openwrt
  gather_facts: false # Desativado pois OpenWrt não possui Python por padrão
  pre_tasks:
    # ⚠️ `tags: always` em TODA pre_task: elas são gate e localização, e uma
    # execução com `--tags wifi` que as pulasse escreveria a configuração sem
    # validar segredo nenhum e no endereço errado. Tag não pode desarmar gate.
    - name: Validar segredos do Vault exigidos por este play
      tags: always
      ansible.builtin.include_tasks: "../../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - wifi_main_password
          - wifi_iot_password
          - wifi_media_password
          - wifi_guest_password
          # SSID entram aqui para o gate de SSID-de-exemplo em validate_vault.yml
          # de fato percorrê-los: aquela assertion itera required_secrets, então
          # SSID fora da lista = gate morto. openwrt_wireless.j2 teve os
          # `| default("Homelab-*")` removidos de propósito — SSID ausente vira
          # undefined e cai no gate, em vez de escrever o nome de exemplo.
          - wifi_main_ssid
          - wifi_iot_ssid
          - wifi_media_ssid
          - wifi_guest_ssid
          - ssh_public_key

    # =====================================================================
    # GATE DE IDENTIDADE — o apply não pode renomear o equipamento
    # =====================================================================
    # ⚠️ `openwrt_hostname` vinha de um `| default('openwrt-ap')` no template, e o
    # equipamento se chama outra coisa. Um apply o renomearia sem aviso: o
    # hostname entra no arquivo de configuração como qualquer outro campo, e
    # nada na saída do playbook denuncia a troca.
    #
    # ⚠️ Tirar o default do template NÃO fecha o buraco, e é aqui que a
    # intuição erra. `10-defaults.yml` é VERSIONADO e sempre entrega um valor,
    # então o StrictUndefined nunca dispara — sem `99-local.yml` o render sai
    # limpo, com o nome de documentação. Só este assert vê a diferença.
    #
    # Recusa qualquer nome terminado em `.example` (RFC 2606), que é a marca
    # dos valores de documentação, do mesmo jeito que `validate_vault.yml`
    # recusa o prefixo `TROCAR-`. Nome real vive em `99-local.yml`, que é
    # gitignorado — hostname de equipamento não vai para repositório público.
    - name: Abortar se o hostname ainda é o valor de documentação
      tags: always
      ansible.builtin.assert:
        that:
          - openwrt_hostname is defined
          - openwrt_hostname | string | length > 0
          - not (openwrt_hostname | string).endswith('.example')
        fail_msg: >-
          openwrt_hostname está em "{{ openwrt_hostname | default('(indefinido)') }}", que é o
          valor de documentação de `10-defaults.yml`. Aplicar assim RENOMEIA o
          equipamento. Defina o nome real em
          inventories/{{ homelab_env | default('prod') }}/group_vars/network/99-local.yml
          (gitignorado). Ver 1.1.5 no roadmap.
        success_msg: "Identidade: {{ openwrt_hostname }}"

    # =====================================================================
    # GATE DA ORDEM DE APLICAÇÃO — elo 5 da migração de VLANs
    # =====================================================================
    # Este play move a gerência do AP para a VLAN 10 e põe o uplink em trunk
    # 802.1q. Ele só pode rodar depois que o firewall tiver a VLAN 10 no ar
    # (elo 1) e que o nó de controle alcançar essa VLAN (elo 4). Rodar antes
    # isola o AP: o failsafe o resgata em
    # {{ openwrt_failsafe_seconds | default(120) }}s, mas o equipamento passa
    # esse tempo inalcançável para descobrir algo que este ping já sabia.
    #
    # O ping cobre os DOIS elos de uma vez, e é por isso que ele é o gate
    # certo em vez de um asserto sobre variável: uma resposta prova que a
    # interface existe no firewall E que este nó de controle chega nela. Um
    # dos dois faltando, não há resposta.
    #
    # ⚠️ Roda do NÓ DE CONTROLE (delegate_to: localhost), não do AP: quem
    # precisa alcançar a VLAN de gerência depois da troca é o controlador.
    - name: Sondar o gateway da VLAN de gerência a partir do nó de controle
      tags: always
      ansible.builtin.command:
        argv: ["ping", "-c", "2", "-W", "2", "{{ openwrt_mgmt_gateway }}"]
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      check_mode: false
      register: _sonda_mgmt

    - name: Abortar se a VLAN de gerência ainda não existe ou não é alcançável
      tags: always
      ansible.builtin.assert:
        that:
          - _sonda_mgmt.rc == 0
        fail_msg: >-
          O gateway da VLAN de gerência não respondeu. Este play põe o uplink
          do AP em trunk e move a gerência para a VLAN
          {{ openwrt_mgmt_vlan | default(10) }} — sem essa VLAN roteando do
          outro lado, o AP fica isolado e só volta pelo failsafe. Aplique
          antes o elo 1+2 (playbooks/network/01-opnsense-setup.yml, que cria
          as interfaces de VLAN e a política de passagem delas) e confira que
          ESTE nó de controle alcança a VLAN de gerência. Ver
          .local/docs/TODO-E-ROADMAP.md, item 1.1.8.
        success_msg: >-
          VLAN de gerência no ar e alcançável do nó de controle
          (elos 1 e 4 satisfeitos).
  tasks:
    # =====================================================================
    # LOCALIZAÇÃO DO AP — ele pode já estar na VLAN de gerência
    # =====================================================================
    # Depois que a etapa `rede` roda, o AP muda de endereço e de porta. O
    # `hosts.ini` continua apontando para o endereço antigo, e uma execução
    # seguinte com `--tags wifi` tentaria conectar onde não há mais ninguém.
    #
    # Em vez de exigir que alguém edite o inventário entre as duas etapas —
    # passo manual, portanto passo esquecido — o play se localiza sozinho: se
    # o endereço de gerência atender, é lá que o AP está.
    #
    # Vale nos dois sentidos e nas duas ordens: antes da migração o endereço
    # novo não atende e nada muda; depois dela, o `when` da transição
    # (`_trocar_rede`, congelado de `ansible_host != openwrt_mgmt_ip`) vê os dois iguais e pula a troca,
    # que é o que torna a etapa `rede` idempotente.
    - name: Localizar o AP — sondar o endereço da VLAN de gerência
      tags: always
      ansible.builtin.wait_for:
        host: "{{ openwrt_mgmt_ip }}"
        port: "{{ openwrt_ssh_port }}"
        timeout: 5
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      check_mode: false
      register: _ap_na_vlan

    - name: Apontar o inventário para a VLAN de gerência se o AP já estiver lá
      tags: always
      ansible.builtin.set_fact:
        ansible_host: "{{ openwrt_mgmt_ip }}"
        ansible_port: "{{ openwrt_ssh_port }}"
      # `wait_for` devolve `state: started` só quando a porta atendeu. Com
      # `failed_when: false` o campo `failed` fica sempre falso, então testar
      # sucesso por ele não funciona — é `state` que distingue.
      when: (_ap_na_vlan.state | default('')) == 'started'

    # O dropbear do OpenWrt não lê ~/.ssh/authorized_keys: lê
    # /etc/dropbear/authorized_keys, e `ansible.posix.authorized_key` exige
    # Python no AP. Sem esta tarefa, nenhum playbook entregava a chave do
    # bootstrap — o AP seguia aceitando só a chave da instalação manual, e a
    # primeira execução tinha de entrar com `--private-key` apontando para ela.
    # ⚠️ Só acrescenta, nunca remove: tirar a chave antiga no mesmo passo que
    # instala a nova tranca o AP se a nova estiver errada.
    - name: Garantir a chave pública do bootstrap no dropbear do OpenWrt
      tags: always
      ansible.builtin.raw: |
        f=/etc/dropbear/authorized_keys
        k='{{ ssh_public_key | trim }}'
        touch $f && chmod 600 $f
        if grep -qxF "$k" $f; then echo CHAVE:PRESENTE; else echo "$k" >> $f && echo CHAVE:ADICIONADA; fi
      register: _chave_ap
      changed_when: "'CHAVE:ADICIONADA' in _chave_ap.stdout"
      failed_when: "'CHAVE:' not in _chave_ap.stdout"

    - name: Fazer backup da configuração /etc/config/system no OpenWrt
      ansible.builtin.raw: "cp /etc/config/system /etc/config/system.bak"
      changed_when: true

    # Pacotes de conveniência: se o feed não tiver algum, o play segue — mas o
    # `rc` aparece na saída em vez de ser engolido por `ignore_errors`.
    - name: Garantir instalação dos pacotes de QoL no OpenWrt (Tema Argon, NLBWmon, Schedule)
      ansible.builtin.raw: "opkg update && opkg install luci-theme-argon luci-app-nlbwmon luci-app-access-control"
      register: opkg_qol
      failed_when: false
      changed_when: "'Installing' in opkg_qol.stdout"

    # =========================================================================
    # Transição de rede: da rede plana para a VLAN de gerência tagueada
    # =========================================================================
    # ⚠️ ESTE TRECHO PODE DEIXAR O AP INALCANÇÁVEL, e é por isso que existe um
    # failsafe em vez de só cuidado. A gerência sai da rede plana e vai para
    # uma VLAN tagueada no trunk; se a VLAN não chegar do outro lado do cabo,
    # o equipamento some da rede e só volta por console ou modo failsafe.
    #
    # PRÉ-REQUISITO ENTRE EQUIPAMENTOS: o OPNsense precisa estar tagueando
    # estas VLANs na porta que recebe o cabo do AP. Aplicar o AP primeiro
    # isola o AP.
    - name: Fazer backup persistente das configurações antes de trocar a rede
      tags: rede
      ansible.builtin.raw: |
        mkdir -p {{ openwrt_failsafe_backup_dir }}
        for f in {{ openwrt_failsafe_files | join(' ') }}; do
          [ -f /etc/config/$f ] && cp /etc/config/$f {{ openwrt_failsafe_backup_dir }}/$f
        done
        rm -f {{ openwrt_failsafe_confirm_file }}
        ls {{ openwrt_failsafe_backup_dir }}
      changed_when: true

    # O failsafe é armado ANTES de qualquer escrita: se o playbook morrer no
    # meio, o equipamento se recupera sozinho.
    - name: Armar o failsafe de rede do OpenWrt
      tags: rede
      ansible.builtin.raw: |
        cat << 'EOF' > /usr/bin/iac-net-failsafe
        {{ lookup('template', '../../templates/network/openwrt_failsafe.sh.j2') }}
        EOF
        chmod +x /usr/bin/iac-net-failsafe
        start-stop-daemon -S -b -m -p /tmp/iac-net-failsafe.pid -x /bin/sh -- /usr/bin/iac-net-failsafe
      changed_when: true

    - name: Aplicar arquivo de Rede padronizado em /etc/config/network
      tags: rede
      ansible.builtin.raw: |
        cat << 'EOF' > /etc/config/network
        {{ lookup('template', '../../templates/network/openwrt_network.j2') }}
        EOF
      changed_when: true

    - name: Aplicar arquivo de Sistema & Syslog padronizado em /etc/config/system
      tags: rede
      ansible.builtin.raw: |
        cat << 'EOF' > /etc/config/system
        {{ lookup('template', '../../templates/network/openwrt_system.j2') }}
        EOF
      changed_when: true

    - name: Aplicar arquivo de Firewall padronizado em /etc/config/firewall
      tags: rede
      ansible.builtin.raw: |
        cat << 'EOF' > /etc/config/firewall
        {{ lookup('template', '../../templates/network/openwrt_firewall.j2') }}
        EOF
      changed_when: true

    - name: Aplicar desativação de DHCP/ODHCPD em /etc/config/dhcp
      tags: rede
      ansible.builtin.raw: |
        cat << 'EOF' > /etc/config/dhcp
        {{ lookup('template', '../../templates/network/openwrt_dhcp.j2') }}
        EOF
      changed_when: true

    # ⚠️ A decisão de trocar é CONGELADA aqui. O `when` de um bloco é
    # reavaliado em cada tarefa dele, e o bloco abaixo reescreve
    # `ansible_host`: com `when: ansible_host != openwrt_mgmt_ip` a espera e a
    # confirmação eram puladas, o failsafe nunca era cancelado e revertia o AP
    # (13/10/2026). Trava em tests/render_openwrt_network.py, invariante 6.
    - name: Decidir se a rede do AP vai trocar nesta execução
      tags: rede
      ansible.builtin.set_fact:
        _trocar_rede: "{{ ansible_host != openwrt_mgmt_ip }}"

    # A troca roda DESTACADA da sessão SSH: reiniciar a rede derruba a conexão
    # que está executando o comando, e um `raw` síncrono ficaria pendurado até
    # o timeout, reportando falha de uma coisa que deu certo.
    - name: Disparar a troca de rede do OpenWrt de forma destacada
      tags: rede
      ansible.builtin.raw: |
        cat << 'EOF' > /tmp/iac-apply-net.sh
        #!/bin/sh
        sleep 3
        /etc/init.d/network restart
        sleep 5
        /etc/init.d/dropbear restart
        EOF
        chmod +x /tmp/iac-apply-net.sh
        start-stop-daemon -S -b -m -p /tmp/iac-apply-net.pid -x /bin/sh -- /tmp/iac-apply-net.sh
      changed_when: true
      when: _trocar_rede | bool

    - name: Reconectar o AP no endereço e porta novos
      tags: rede
      when: _trocar_rede | bool
      block:
        # ⚠️ A CONFIRMAÇÃO TEM DE VIR DE CONEXÃO NOVA. Uma sessão SSH já
        # estabelecida continua fluindo mesmo depois de a interface mudar de
        # VLAN — confirmar por ela provaria que o socket antigo sobreviveu,
        # não que o endereço novo funciona.
        - name: Encerrar a conexão antiga com o AP
          ansible.builtin.meta: reset_connection

        - name: Apontar o inventário em memória para o endereço novo
          ansible.builtin.set_fact:
            ansible_host: "{{ openwrt_mgmt_ip }}"
            ansible_port: "{{ openwrt_ssh_port }}"

        # Do nó de controle, não do AP: prova que o caminho de rede inteiro
        # funciona, inclusive o roteamento do firewall até a VLAN nova.
        - name: Esperar o AP atender no endereço da VLAN de gerência
          ansible.builtin.wait_for:
            host: "{{ openwrt_mgmt_ip }}"
            port: "{{ openwrt_ssh_port }}"
            timeout: "{{ (openwrt_failsafe_seconds | int) - 30 }}"
            delay: 10
          delegate_to: localhost

        - name: Confirmar o acesso e cancelar o failsafe do OpenWrt
          ansible.builtin.raw: |
            touch {{ openwrt_failsafe_confirm_file }}
            start-stop-daemon -K -p /tmp/iac-net-failsafe.pid 2>/dev/null
            ip -4 addr show br-lan.{{ openwrt_mgmt_vlan }} | grep inet
          changed_when: true

      rescue:
        - name: Avisar que o failsafe vai restaurar o AP sozinho
          ansible.builtin.debug:
            msg: >-
              ⚠️ O AP não respondeu em {{ openwrt_mgmt_ip }}:{{ openwrt_ssh_port }}.
              O failsafe NÃO foi cancelado, então ele restaura a configuração
              anterior e reinicia o equipamento dentro da janela de
              {{ openwrt_failsafe_seconds }}s contada a partir do momento em que
              foi armado. Causa mais provável: a VLAN {{ openwrt_mgmt_vlan }} não
              está tagueada na porta do switch/firewall que recebe o cabo do AP.
              Verifique o outro lado do trunk antes de repetir.

        - name: Esperar o AP voltar no endereço anterior depois do failsafe
          ansible.builtin.wait_for:
            host: "{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}"
            port: 22
            timeout: "{{ (openwrt_failsafe_seconds | int) + 180 }}"
            delay: 15
          delegate_to: localhost
          failed_when: false

        - name: Falhar informando que a transição foi revertida
          ansible.builtin.fail:
            msg: >-
              Transição de rede revertida pelo failsafe. O AP deve estar de volta
              no endereço anterior. Nada foi perdido — o backup em
              {{ openwrt_failsafe_backup_dir }} foi restaurado e o equipamento
              reiniciado.

    # =====================================================================
    # ETAPA `wifi` — move os CLIENTES, e é a segunda metade da fase do AP
    # =====================================================================
    # Separada de `rede` de propósito. As duas juntas mudavam, no mesmo
    # instante, o endereço do AP e a rede de todo cliente sem fio da casa —
    # e uma queda não distinguia trunk quebrado de política errada.
    #
    # ⚠️ Entre `--tags rede` e `--tags wifi` o Wi-Fi fica FORA DO AR, e isso é
    # esperado: o `/etc/config/wireless` antigo aponta para redes que a etapa
    # `rede` acabou de destruir (`lan` plana e `br-guest`). Rode a segunda
    # logo depois de verificar a primeira; a janela é o tempo da verificação.
    #
    # Uma execução sem `--tags` faz as duas na ordem, como antes.
    - name: Conferir quais VLANs de SSID a rede do AP já declara
      tags: wifi
      ansible.builtin.raw: |
        ausentes=""
        for t in {{ openwrt_trunk_vlans | reject('equalto', openwrt_mgmt_vlan) | join(' ') }}; do
          uci -q get network.vlan$t >/dev/null 2>&1 || ausentes="$ausentes $t"
        done
        echo "AUSENTES:$ausentes"
      register: _vlans_ssid
      changed_when: false
      failed_when: false

    - name: Abortar se a rede do AP ainda não declara as VLANs dos SSIDs
      tags: wifi
      ansible.builtin.assert:
        that:
          # A sentinela existe porque `raw` traz banner e ruído de shell junto:
          # procurar por lista vazia no stdout inteiro daria falso positivo.
          - "'AUSENTES:' in _vlans_ssid.stdout"
          - (_vlans_ssid.stdout.split('AUSENTES:')[1] | trim) == ''
        fail_msg: >-
          A rede do AP não declara as VLANs
          {{ (_vlans_ssid.stdout.split('AUSENTES:')[1] | default('?')) | trim }}.
          Os SSIDs apontam para elas com `option network`; escrever o
          wireless agora sobe rádio apontando para rede inexistente — o SSID
          aparece, o cliente associa e não recebe endereço, que é o modo de
          falha mais caro de diagnosticar. Rode antes a etapa `rede`
          (`--tags rede`). Ver .local/docs/TODO-E-ROADMAP.md, item 1.1.8.
        success_msg: "A rede do AP declara todas as VLANs dos SSIDs."

    # no_log: o template renderizado contém as 4 PSKs de Wi-Fi em texto puro.
    - name: Aplicar configuração de Wi-Fi e SSIDs Segregados em /etc/config/wireless
      tags: wifi
      ansible.builtin.raw: |
        cat << 'EOF' > /etc/config/wireless
        {{ lookup('template', '../../templates/network/openwrt_wireless.j2') }}
        EOF
      changed_when: true
      no_log: true

    - name: Recarregar o Wi-Fi do OpenWrt
      tags: wifi
      ansible.builtin.raw: "wifi reload"
      changed_when: true

    - name: Desativar daemons dnsmasq e odhcpd no inicialização do OpenWrt
      ansible.builtin.raw: "/etc/init.d/dnsmasq disable && /etc/init.d/odhcpd disable && /etc/init.d/dnsmasq stop && /etc/init.d/odhcpd stop"
      changed_when: true

    - name: Agendar reboot semanal automático nos domingos às 04:00 AM via Crontab
      ansible.builtin.raw: >-
        (crontab -l 2>/dev/null; echo "0 4 * * 0 /sbin/reboot") | sort -u | crontab -
        && /etc/init.d/cron enable && /etc/init.d/cron restart
      changed_when: true

    - name: Aplicar otimizações de Kernel sysctl (TCP BBR, Sockets 16MB, txqueuelen)
      ansible.builtin.raw: >-
        sysctl -w net.ipv4.tcp_congestion_control=bbr net.core.rmem_max=16777216
        net.core.wmem_max=16777216 net.core.netdev_max_backlog=10000 && sysctl -p
      changed_when: true

    # -------------------------------------------------------------------------
    # Sinalização de saúde nos LEDs frontais (led-health)
    # -------------------------------------------------------------------------
    # ⚠️ A ORDEM DESTAS TAREFAS IMPORTA, e a razão está no boot do OpenWrt:
    # `/etc/init.d/done` (START=95) acende o `led-running` do device tree,
    # `/etc/init.d/led` (START=96) aplica as seções `config led` escritas no
    # `/etc/config/system` mais acima, e só então o led-health (START=97)
    # assume o painel. Reiniciar o init de LED antes de subir o daemon
    # reproduz essa ordem sem exigir reboot.
    - name: Instalar o daemon de sinalização de saúde nos LEDs do OpenWrt
      ansible.builtin.raw: |
        cat << 'EOF' > {{ openwrt_led_health_path | default('/usr/bin/led-health') }}
        {{ lookup('template', '../../templates/network/openwrt_led_health.sh.j2') }}
        EOF
        chmod +x {{ openwrt_led_health_path | default('/usr/bin/led-health') }}
      changed_when: true
      when: openwrt_led_health_enabled | default(true) | bool

    - name: Instalar o init procd do led-health no OpenWrt
      ansible.builtin.raw: |
        cat << 'EOF' > /etc/init.d/led-health
        {{ lookup('template', '../../templates/network/openwrt_led_health_init.j2') }}
        EOF
        chmod +x /etc/init.d/led-health
      changed_when: true
      when: openwrt_led_health_enabled | default(true) | bool

    - name: Aplicar as seções config led e ativar o led-health no OpenWrt
      ansible.builtin.raw: >-
        /etc/init.d/led restart
        && /etc/init.d/led-health enable
        && /etc/init.d/led-health restart
      changed_when: true
      when: openwrt_led_health_enabled | default(true) | bool

    # Desativar é um estado suportado, não um esquecimento: o trap do daemon
    # restaura o azul fixo de fábrica ao parar, então o painel não fica escuro.
    - name: Desativar o led-health no OpenWrt quando pedido
      ansible.builtin.raw: >-
        /etc/init.d/led-health stop 2>/dev/null;
        /etc/init.d/led-health disable 2>/dev/null;
        rm -f /etc/init.d/led-health
      changed_when: true
      when: not (openwrt_led_health_enabled | default(true) | bool)

    # O `wifi reload` saiu daqui: ele pertence à etapa `wifi`, que é quem
    # escreve o wireless. Mantê-lo nos dois lugares fazia o rádio recarregar
    # duas vezes numa execução completa, sem ganho.
    - name: Recarregar serviços de Log e Firewall do OpenWrt
      ansible.builtin.raw: "/etc/init.d/log restart && reload_config"
      changed_when: true

    - name: Exibir confirmação do OpenWrt
      ansible.builtin.debug:
        msg: >-
          📶 OpenWrt ({{ openwrt_hostname | default('openwrt-ap') }}) padronizado:
          syslog para {{ syslog_server_ip }}:{{ syslog_server_port_rfc3164 }}, SSIDs
          segregados, dhcp/odhcpd desativados e reboot semanal agendado.
