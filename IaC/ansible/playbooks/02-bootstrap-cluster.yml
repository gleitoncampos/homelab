---
- name: "02.1 - Inicialização do Swarm Manager (Nó 1)"
  hosts: homelab_managers
  become: true
  tasks:
    - name: Inicializar o Docker Swarm no Nó Manager
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ ansible_host }}"

    # no_log: o token de join concede entrada no cluster. O stdout_callback yaml
    # imprimiria o valor registrado em -v ou em qualquer falha subsequente.
    - name: Obter o token de Join de Worker do Swarm
      ansible.builtin.command: "docker swarm join-token worker -q"
      register: swarm_worker_token_cmd
      changed_when: false
      no_log: true

    - name: Definir fato global para o token de worker
      ansible.builtin.set_fact:
        swarm_worker_token: "{{ swarm_worker_token_cmd.stdout }}"
        swarm_manager_ip: "{{ ansible_host }}"
      no_log: true

- name: "02.2 - Join dos Nós Workers no Cluster Swarm (Nó 2 e adicionais)"
  hosts: homelab_workers
  become: true
  tasks:
    - name: Garantir que o play do Manager já foi executado
      ansible.builtin.fail:
        msg: >-
          hostvar 'swarm_worker_token' não está definida em
          {{ groups['homelab_managers'][0] }}. Execute este playbook no grupo
          homelab_managers (ou sem --limit) antes de rodar com
          --limit homelab_workers.
      when: hostvars[groups['homelab_managers'][0]]['swarm_worker_token'] is not defined

    - name: Dar Join no cluster Swarm como Worker
      community.docker.docker_swarm:
        state: join
        join_token: "{{ hostvars[groups['homelab_managers'][0]]['swarm_worker_token'] }}"
        remote_addrs:
          - "{{ hostvars[groups['homelab_managers'][0]]['swarm_manager_ip'] }}:2377"
      when: hostvars[groups['homelab_managers'][0]]['swarm_worker_token'] is defined
      no_log: true

- name: "02.3 - Deploy das Stacks Base do Cluster (Portainer & Traefik Ingress)"
  hosts: homelab_managers
  become: true
  vars:
    # ⚠️ TRÊS níveis: playbooks/ -> ansible/ -> IaC/ -> raiz do repositório.
    # Com dois, isto resolvia para `IaC/docker`, que não existe — e a cópia do
    # compose do Portainer abaixo falhava por arquivo inexistente. Passou
    # despercebido porque a stack já estava no ar e ninguém reexecutou o play.
    docker_dir: "{{ playbook_dir }}/../../../docker"
    portainer_url: "http://localhost:9000"
  pre_tasks:
    - name: Validar segredos do Vault exigidos por este play
      ansible.builtin.include_tasks: "../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - portainer_admin_password
          - portainer_agent_secret
          - cloudflare_email
          - cloudflare_api_token
          - homelab_domain

    # Antes do Portainer subir com o label `rede-admin@file`: sem a lista, o
    # render das rotas falharia depois, longe da causa; como string, o laço do
    # template percorreria caractere por caractere.
    - name: Exigir traefik_admin_cidrs para o middleware rede-admin
      ansible.builtin.assert:
        that:
          - traefik_admin_cidrs is defined
          - traefik_admin_cidrs is not string
          - traefik_admin_cidrs | length > 0
        fail_msg: >-
          traefik_admin_cidrs não definida (ou não é lista). Sem ela o
          middleware rede-admin barra todo acesso às GUIs de equipamento e ao
          Portainer pelo Traefik. Rode `make bootstrap`, que a gera em
          group_vars/all/99-local.yml.
  tasks:
    - name: Criar rede overlay externa traefik_public
      community.docker.docker_network:
        name: "{{ swarm_network_name }}"
        driver: overlay
        state: present
        attachable: true

    - name: Criar diretório do manifest do Portainer no nó Manager
      ansible.builtin.file:
        path: "{{ stack_manifest_dir }}/portainer"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Publicar o compose do Portainer no nó Manager
      ansible.builtin.copy:
        src: "{{ docker_dir }}/portainer/swarm/compose.yml"
        dest: "{{ stack_manifest_dir }}/portainer/compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Subir a Stack do Portainer via Docker CLI/Stack Native
      community.docker.docker_stack:
        name: portainer
        compose:
          - "{{ stack_manifest_dir }}/portainer/compose.yml"
        state: present
      environment:
        FQDN: "{{ fqdn_portainer }}"
        # Consumida pelo portainer-agent e pelo portainer no mesmo compose.
        # Sem ela o agent aceita qualquer cliente na overlay, ver compose.
        PORTAINER_AGENT_SECRET: "{{ portainer_agent_secret }}"
      # O valor do segredo entra em `environment`, que o módulo pode expor em
      # log de erro — mesmo tratamento que os outros consumidores de vault.
      no_log: true

    - name: Aguardar o Portainer ficar pronto para conexões de API
      ansible.builtin.uri:
        url: "{{ portainer_url }}/api/status"
        method: GET
        status_code: 200
      register: portainer_status
      until: portainer_status.status == 200
      retries: 24
      delay: 5

    - name: Exibir confirmação do Portainer Online
      ansible.builtin.debug:
        msg: "✅ Portainer ativo (Versão {{ portainer_status.json.Version }})! Iniciando deploy do Traefik..."

    - name: Autenticar na API do Portainer
      ansible.builtin.include_tasks: "../tasks/portainer_login.yml"

    # ⚠️ As rotas precisam existir ANTES de o Traefik subir. O file provider
    # relê o diretório sozinho, mas subir com ele vazio publica um proxy sem
    # nenhuma rota para equipamento — e é exatamente o estado que o
    # repositório entregava até aqui, porque o bind mount existia no compose e
    # o conteúdo, não.
    - name: Recusar identidade de exemplo nas rotas do Traefik
      ansible.builtin.assert:
        that:
          - not (hostvars[item].opnsense_hostname | default('') | string).endswith('.example')
        fail_msg: >-
          {{ item }} ainda está com a identidade de exemplo
          ({{ hostvars[item].opnsense_hostname | default('(indefinido)') }}).
          A rota do Traefik sairia com Host() apontando para um nome que
          ninguém atende — regra que não casa nada é regra válida, e o Traefik
          não reclama. Defina opnsense_hostname em group_vars/network/99-local.yml.
      loop: "{{ groups['opnsense'] | default([]) }}"

    - name: Recusar identidade de exemplo no ponto de acesso
      ansible.builtin.assert:
        that:
          - not (hostvars[item].openwrt_hostname | default('') | string).endswith('.example')
        fail_msg: >-
          {{ item }} ainda está com a identidade de exemplo
          ({{ hostvars[item].openwrt_hostname | default('(indefinido)') }}).
      loop: "{{ groups['openwrt'] | default([]) }}"

    - name: Renderizar as rotas do Traefik para back-ends fora do Swarm
      ansible.builtin.template:
        src: "{{ docker_dir }}/traefik/swarm/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: "{{ traefik_sidecar_files }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Subir a Stack do Traefik Ingress via Portainer (create-or-update)
      ansible.builtin.include_tasks: "../tasks/portainer_stack.yml"
      vars:
        stack_name: "traefik"
        stack_repo_url: "{{ github_repo_url }}"
        stack_repo_ref: "{{ github_repo_branch }}"
        # Relativo ao repo git, não a `docker_dir` (que é caminho do control
        # node): a API do Portainer clona o repositório e resolve o compose a
        # partir da raiz dele, igual aos playbooks 04/05.
        stack_compose_path: "docker/traefik/swarm/compose.yml"
        stack_env:
          - name: "CLOUDFLARE_EMAIL"
            value: "{{ cloudflare_email }}"
          - name: "CLOUDFLARE_TOKEN"
            value: "{{ cloudflare_api_token }}"
          - name: "ACME_CASERVER"
            value: "{{ acme_caserver }}"
        portainer_endpoint_id: "{{ endpoint_id }}"
      no_log: true

    # ⚠️ O compose do Traefik vem do GitHub (`github_repo_branch`), não desta
    # árvore: o gate render_traefik.py lê o compose local, não o implantado.
    # Com o ref ainda em modo ingress, o Traefik vê o IP da malha, o
    # rede-admin devolve 403 a todo mundo e o playbook terminaria verde.
    - name: Conferir que o Traefik implantado publica 80/443 em mode host
      ansible.builtin.command:
        cmd: >-
          docker service inspect traefik_traefik
          --format '{{ "{{" }}range .Endpoint.Spec.Ports{{ "}}" }}{{ "{{" }}.PublishMode{{ "}}" }} {{ "{{" }}end{{ "}}" }}'
      register: _traefik_portas
      changed_when: false
      until: _traefik_portas.stdout.split() == ['host', 'host']
      retries: 12
      delay: 5

    - name: Exibir confirmação do Bootstrap de Infraestrutura
      ansible.builtin.debug:
        msg: "🚀 Bootstrap de Infraestrutura concluído com sucesso! Cluster Swarm ativo (Manager + Workers) + Portainer + Traefik online e prontos!"
