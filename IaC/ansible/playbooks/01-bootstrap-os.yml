---
- name: "01 - Bootstrap & Hardening do SO (Debian 12/13)"
  hosts: homelab
  become: true
  pre_tasks:
    - name: Validar segredos do Vault exigidos por este play
      ansible.builtin.include_tasks: "../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - ssh_public_key
          - system_user
  tasks:
    - name: Configurar fuso horário (Timezone)
      community.general.timezone:
        name: "{{ timezone }}"

    # ⚠️ Assíncrona de propósito: o upgrade da libc re-executa o systemd e
    # reinicia o systemd-networkd do CT, a conexão SSH da task morre e o play
    # ficava pendurado sem timeout (13/10/2026). Com async, cada consulta de
    # andamento abre conexão nova. Trava em tests/gates_node_bootstrap.py.
    - name: Atualizar cache do APT e atualizar pacotes do sistema
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      async: 1800
      poll: 15

    - name: Instalação de pacotes base do sistema
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present

    # --- Instalação Oficial do Docker ---
    - name: Criar diretório para chaves GPG de repositórios
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixar chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    # `arch=` é nome do dpkg (amd64), não do kernel: `ansible_architecture`
    # dava `x86_64`, o apt ignorava a linha e `docker-ce` sumia (13/10/2026).
    # Trava em tests/gates_node_bootstrap.py.
    - name: Ler a arquitetura do dpkg
      ansible.builtin.command: dpkg --print-architecture
      register: _dpkg_arch
      changed_when: false

    # A linha errada que a versão anterior gravava fica no docker.list — o
    # apt_repository só gerencia a linha que conhece.
    - name: Remover a linha do repositório do Docker com arch do kernel
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        state: absent
        filename: docker
      when: ansible_architecture != _dpkg_arch.stdout

    - name: Adicionar repositório oficial do Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ _dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Instalar Docker CE, CLI, Containerd e plugins Compose/Buildx
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    # ⚠️ ANTES de o Docker subir pela primeira vez, de propósito. O driver
    # `json-file` é o padrão e, sem `log-opts`, cresce sem limite nenhum:
    # medido neste nó, 3,7 GB em /var/lib/docker/containers, num disco de 32 GB
    # que chegou a 94%. O log já está centralizado no Loki — a cópia local é
    # buffer, não arquivo, e não tem por que guardar tudo.
    #
    # `log-opts` vale por CONTAINER, no momento em que ele é criado: containers
    # que já existem mantêm a configuração antiga até serem recriados, o que
    # acontece sozinho no próximo `docker service update` de cada stack.
    - name: Limitar o tamanho do log de container do Docker
      ansible.builtin.copy:
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "{{ docker_log_max_size | default('10m') }}",
              "max-file": "{{ docker_log_max_file | default('3') }}"
            }
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      register: docker_daemon_config

    - name: Garantir que o serviço do Docker esteja ativo e no boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # ⚠️ Reiniciar o Docker DERRUBA todos os containers do nó — num Swarm de nó
    # único, é a produção inteira fora do ar por alguns segundos. Por isso não é
    # automático: o playbook avisa e você escolhe a janela. Numa instalação do
    # zero nada disso importa, porque o arquivo é escrito antes do primeiro
    # start e o daemon já sobe com o limite.
    - name: "Avisar que o daemon do Docker precisa reiniciar para aplicar o limite de log"
      ansible.builtin.debug:
        msg: >-
          ⚠️ /etc/docker/daemon.json mudou e o daemon NÃO foi reiniciado.
          O limite de log só passa a valer depois de `systemctl restart docker`,
          que derruba todos os containers deste nó. Rode na janela que você
          escolher, ou aplique com `-e docker_allow_restart=true`.
      when:
        - docker_daemon_config.changed
        - not (docker_allow_restart | default(false) | bool)

    - name: Reiniciar o Docker para aplicar o limite de log
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when:
        - docker_daemon_config.changed
        - docker_allow_restart | default(false) | bool

    # O journal do systemd não tem teto por padrão: ele usa até 10% do disco.
    # Medido neste nó, 2,7 GB — encostado no teto de um disco de 32 GB. Reiniciar
    # o journald não derruba nada.
    - name: Garantir o diretório de drop-in do journald
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Limitar o tamanho do journal do systemd
      ansible.builtin.copy:
        content: |
          # Gerado pelo Ansible (01-bootstrap-os.yml). Não editar à mão.
          [Journal]
          SystemMaxUse={{ journald_max_use | default('500M') }}
          SystemMaxFileSize={{ journald_max_file_size | default('50M') }}
        dest: /etc/systemd/journald.conf.d/99-homelab.conf
        owner: root
        group: root
        mode: '0644'
      notify: Aplicar o limite do journal

    - name: Adicionar usuário ao grupo docker
      ansible.builtin.user:
        name: "{{ system_user }}"
        groups: docker
        append: true

    - name: Configurar Chave SSH Pública do Administrador para os usuários root e {{ system_user }}
      ansible.posix.authorized_key:
        user: "{{ item }}"
        state: present
        key: "{{ ssh_public_key }}"
      loop:
        - "root"
        - "{{ system_user }}"
      when: ssh_public_key is defined and ssh_public_key != ""

    # SSH só por chave (15/10/2026), igual ao Proxmox, ao NAS e ao firewall. O
    # Debian deixa PasswordAuthentication no padrão (yes). DEPOIS da task da
    # chave; que a chave funciona está provado pela própria conexão do Ansible,
    # que chega aqui sem senha. O sudo é NOPASSWD, então o become não depende
    # de senha de SSH. Prefixo `20-` pelo mesmo motivo do Proxmox: o sshd usa o
    # primeiro valor que lê, e o Include vem antes do resto do sshd_config.
    - name: Fechar o SSH dos nós para login por senha
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/20-so-chave.conf
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
        owner: root
        group: root
        mode: '0644'
      notify: Recarregar o sshd

    # Aqui, e não no fim do play: a configuração nova tem de valer antes de
    # qualquer task seguinte (o handler explica por que é restart).
    - name: Recarregar o sshd agora
      ansible.builtin.meta: flush_handlers

    - name: Conferir no sshd efetivo que senha e root por senha estão fechados
      ansible.builtin.command: /usr/sbin/sshd -T
      register: _sshd_efetivo
      changed_when: false
      check_mode: false
      failed_when: >-
        'passwordauthentication no' not in _sshd_efetivo.stdout_lines
        or 'kbdinteractiveauthentication no' not in _sshd_efetivo.stdout_lines
        or 'permitrootlogin without-password' not in _sshd_efetivo.stdout_lines

    # --- Estrutura de Diretórios de Dados (/srv/containers) ---
    # 0750, e não 0755: o mesmo modo que a varredura de remediação abaixo
    # aplica. Com 0755 aqui, as duas tasks brigavam pelo mesmo caminho a cada
    # execução — esta punha 0755, a varredura tirava o "outros", e ambas
    # reportavam `changed` para sempre. Nada precisa atravessar este diretório
    # como "outros": o dono é {{ system_user }}, o grupo é docker, e o daemon
    # do Docker resolve os bind mounts como root.
    - name: Criar diretório base de dados /srv/containers
      ansible.builtin.file:
        path: "{{ containers_base_dir }}"
        state: directory
        owner: "{{ system_user }}"
        group: docker
        mode: '0750'

    # Remediação: os 82 de 87 caminhos em 777 encontrados na coleta de
    # produção incluem subdiretórios que os PRÓPRIOS CONTAINERS criam em
    # runtime (cache, media, uploads — ex.: paperless-ngx/data/media,
    # nextcloud/config/data), que não aparecem em nenhum `loop:` abaixo. As
    # tasks seguintes usam `ansible.builtin.file` com `state: directory`, que
    # é idempotente mas só atua nos caminhos que cada loop lista — não alcança
    # o que foi criado por fora dele, seja por um `chmod -R` manual, seja por
    # uma imagem que cria sua própria subpasta na primeira escrita. Sem uma
    # task que varra a árvore inteira, esses caminhos continuam em 777 para
    # sempre, porque nada nunca os visita de novo.
    #
    # Escolhido `recurse: yes` em vez de `find` + loop: o volume de dados de
    # cada serviço já vive inteiro sob um path só (`{{ containers_base_dir }}`),
    # então uma árvore recursiva cobre tudo numa task idempotente só.
    #
    # Só MODE, sem owner/group: aplicar owner recursivamente reatribuiria tudo
    # ao mesmo dono, e um serviço que grava como UID próprio (ex.:
    # Grafana/472, Loki/10001, ver task adiante) quebraria no próximo start.
    # Mode não tem esse efeito colateral: restringe quem pode ler/escrever,
    # não muda quem já tem acesso ao que já é seu.
    #
    # Notação simbólica `u=rwX,g=rX,o=`, não octal (`0750`): `recurse: yes`
    # com mode octal aplicaria o MESMO modo a arquivos e diretórios — um
    # binário ou script executável dentro de `/srv/containers` perderia o bit
    # de execução, e ficaria não-executável até o próximo `chmod` manual. O
    # `X` maiúsculo só liga execução em diretórios e em arquivos que já eram
    # executáveis; `o=` remove leitura/escrita/execução de "outros" em tudo,
    # que é o defeito real.
    #
    # ⚠️ Roda ANTES das tasks específicas, não depois. `g=rX` é ATRIBUIÇÃO, não
    # máscara: aplicada sobre um diretório em 0700 ela ELEVA o modo para 0750,
    # e um arquivo em 0600 (o acme.json do Traefik, com as chaves privadas dos
    # certificados) para 0640. Enquanto esta varredura rodava por último, ela
    # desfazia em silêncio o endurecimento que as tasks abaixo tinham acabado
    # de aplicar — e o comentário que estava aqui garantia o contrário,
    # afirmando que "0700 e 0750 já satisfazem `o=`". Rodando primeiro, cada
    # task específica aplica seu valor final DEPOIS da varredura, e o valor
    # final é o que fica.
    #
    # ⚠️ Desligada por padrão. Não é variável de topologia (que este
    # repositório exige declarar sem `default()`), é interruptor de uma
    # operação destrutiva: a varredura mexe na árvore de dados de TODO serviço
    # de uma vez, incluindo subpasta criada por container em runtime, e é a
    # mudança de maior risco desta fase. O item do runbook que manda rodar
    # este mesmo play para aplicar as regras de firewall não pode carregá-la
    # de carona. Ligar explicitamente, serviço por serviço:
    #
    #   ansible-playbook playbooks/01-bootstrap-os.yml \
    #     -e srv_permissions_remediation=true
    - name: "Remediar recursivamente qualquer diretório/arquivo com escrita para outros dentro de /srv/containers"
      ansible.builtin.file:
        path: "{{ containers_base_dir }}"
        state: directory
        recurse: true
        mode: u=rwX,g=rX,o=
      when: srv_permissions_remediation | default(false) | bool

    - name: Criar diretório de manifestos das stacks (compose.yml copiado pelo Portainer antes do deploy)
      ansible.builtin.file:
        path: "{{ stack_manifest_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # 0750, não 0755. A coleta de produção encontrou 82 de 87 caminhos em 777
    # — incluindo traefik/data, onde vive o acme.json com as chaves privadas
    # dos certificados. Diretório 777 (ou 755 com grupo/outros amplos) permite
    # renomear e substituir arquivo dentro dele independentemente da permissão
    # do próprio arquivo; 0750 restringe a dono e grupo docker, sem "outros".
    - name: Criar subpastas de serviços em /srv/containers
      ansible.builtin.file:
        path: "{{ containers_base_dir }}/{{ item }}"
        state: directory
        owner: "{{ system_user }}"
        group: docker
        mode: '0750'
      loop:
        - traefik/config
        - portainer
        - monitoring
        - alloy
        - prometheus
        - grafana
        - loki
        - nextcloud
        - paperless-ngx
        - vikunja
        - actual-budget
        - firefly3
        - wallos
        - thrifty
        - obsidian
        - stirling-pdf
        - linkwarden
        - bytestash
        - it-tools
        - glance
        - organizr
        - cronicle
        - jdownloader
        - kasm
        - zoneminder

    - name: Restringir ownership do diretório de dados do Traefik (contém certificados/ACME)
      ansible.builtin.file:
        path: "{{ containers_base_dir }}/traefik/data"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # O modo do acme.json passa a ser declarado, e não herdado do que o
    # Traefik criou. A varredura recursiva acima aplica `g=rX` a arquivos
    # também: sem esta task, uma execução com a remediação ligada deixaria o
    # arquivo das chaves privadas dos certificados em 0640 — legível pelo
    # grupo — e nada nunca o traria de volta a 0600, porque a task acima só
    # trata o diretório. `state: file` condicionado ao stat porque em host
    # novo o arquivo ainda não existe (o Traefik o cria no primeiro ACME), e
    # `state: file` contra caminho ausente é erro.
    - name: Conferir se o acme.json do Traefik já existe
      ansible.builtin.stat:
        path: "{{ containers_base_dir }}/traefik/data/acme.json"
      register: traefik_acme_file

    - name: Restringir o acme.json a 0600 (chaves privadas dos certificados)
      ansible.builtin.file:
        path: "{{ containers_base_dir }}/traefik/data/acme.json"
        state: file
        owner: root
        group: root
        mode: '0600'
      when: traefik_acme_file.stat.exists

    # Ownership dedicado dos volumes de dados de monitoring/observabilidade,
    # no lugar do antigo workaround "chmod 777" que ainda aparece como
    # comentário no compose.yml da stack monitoring. Os UIDs abaixo são os
    # que cada imagem usa internamente para gravar em disco; usamos o
    # número (não o nome de usuário) porque 10001 e 472 não existem como
    # usuário no host — passar o nome faria o chown falhar com "failed to
    # look up user". O Alloy roda como root dentro do container, então seu
    # diretório de dados não precisa de chown (root já é o dono padrão).
    - name: Ajustar ownership dos diretórios de dados de monitoring/observabilidade
      ansible.builtin.file:
        path: "{{ containers_base_dir }}/{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "prometheus/data", owner: "65534", group: "docker", mode: "0750" }
        - { path: "grafana/data", owner: "472", group: "docker", mode: "0750" }
        - { path: "loki/data", owner: "10001", group: "docker", mode: "0750" }
        - { path: "alloy/data", owner: "root", group: "docker", mode: "0750" }
      loop_control:
        label: "{{ item.path }}"

    # --- Firewall & Hardening (UFW & Fail2ban) ---
    # ATENÇÃO ao limite do UFW no Docker Swarm: o routing mesh do Swarm faz
    # DNAT na chain nat/PREROUTING do iptables, que é avaliada ANTES da
    # chain filter onde o UFW aplica `policy: deny` para tráfego de entrada.
    # Ou seja: uma porta publicada por `ports:` em um serviço Swarm chega ao
    # container mesmo com o UFW em "deny incoming" — o DNAT já decidiu o
    # destino do pacote antes da regra de negação ser avaliada. Por isso todo
    # serviço é exposto só via Traefik/overlay interna, e as portas que
    # precisam de `ports:` (9000 do Portainer, 1514/1515 do syslog do Alloy)
    # são fechadas por faixa em DOCKER-USER (tasks/docker_user_rules.yml). O
    # InfluxDB saiu da stack em 13/10/2026 (sem uso).
    - name: Liberar portas TCP no UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: Liberar portas UDP no UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: udp
      loop: "{{ allowed_udp_ports }}"

    # Portas de control plane do cluster Swarm (gerência de nós, gossip da
    # rede overlay e VXLAN dos containers). Diferente das portas acima, estas
    # NUNCA podem ser liberadas para "Anywhere": são liberadas apenas com
    # `src` no IP de cada peer do cluster, derivado do inventário (nunca IP
    # literal). Sem esta regra a rede overlay não atravessa os nós porque o
    # tráfego de cluster de um peer é bloqueado pela política "deny incoming".
    - name: Liberar portas de cluster do Swarm no UFW apenas para os peers do inventário
      community.general.ufw:
        rule: allow
        port: "{{ item.0.port }}"
        proto: "{{ item.0.proto }}"
        src: "{{ hostvars[item.1].ansible_host }}"
      loop: "{{ swarm_cluster_ports | product(groups['homelab'] | difference([inventory_hostname])) | list }}"
      loop_control:
        label: "{{ item.0.proto }}/{{ item.0.port }} <- {{ item.1 }}"

    - name: Ativar UFW Firewall com política padrão de negar conexões de entrada
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Garantir que o serviço Fail2ban esteja ativo e no boot
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true

    # --- Syncthing ---
    - name: Garantir que o serviço Syncthing esteja ativo para o usuário
      ansible.builtin.systemd:
        name: "syncthing@{{ system_user }}"
        state: started
        enabled: true

    # --- Firewall (DOCKER-USER) ---
    # Complementar ao UFW acima, não substituto: o UFW continua responsável por
    # toda porta que NÃO é publicada pelo Docker (SSH, cluster do Swarm etc.).
    # Para porta publicada via `ports:` de um serviço Swarm, o DNAT do Docker em
    # nat/PREROUTING roda antes da chain filter onde o UFW decide — por isso a
    # 9000 (Portainer) e a 1514 (syslog do Alloy) só ficam de fato restritas com
    # uma regra em DOCKER-USER, consultada antes das regras que o próprio Docker
    # gera nessa mesma chain.
    - name: Aplicar regras DOCKER-USER nas portas administrativas
      ansible.builtin.include_tasks: ../tasks/docker_user_rules.yml
      # noqa: no-relative-paths
      # O caminho é relativo porque `tasks/` é irmão de `playbooks/`, e o
      # repositório não usa roles — mesma convenção de tasks/portainer_stack.yml.

  handlers:
    # RESTART, não reload (15/10/2026). Nos nós o SSH sobe pelo ssh.socket
    # (Accept=no, imagem Debian 13 do CT): o systemd segura a porta 22 e
    # entrega o descritor ao sshd. No reload (HUP) o sshd se reexecuta, tenta
    # abrir a porta sozinho e morre com "Cannot bind any address"; o systemd
    # então apaga o /run/sshd e o `sshd -T` da conferência quebra — foi o que
    # aconteceu no node2. O restart para só o processo principal
    # (KillMode=process: as sessões abertas, inclusive a do Ansible, ficam) e o
    # serviço volta recebendo o descritor do socket.
    - name: Recarregar o sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    # Reiniciar o journald não derruba serviço nenhum: ele reabre os arquivos e
    # aplica o teto novo. Diferente do daemon do Docker, que é por isso que o
    # reinício dele fica atrás de `docker_allow_restart` lá em cima.
    - name: Aplicar o limite do journal
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
