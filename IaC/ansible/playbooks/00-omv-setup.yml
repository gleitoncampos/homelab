---
- name: "00 - OpenMediaVault (OMV) NAS Host Setup, Hardening e Performance Enterprise"
  hosts: omv
  become: true

  vars:
    # OMV 8 roda sobre Debian 13 (trixie), a mesma suíte do PVE 9 — os dois
    # sobem de versão juntos, e é por isso que a variável tem o mesmo nome nos
    # dois playbooks. Trocar de suíte é uma linha aqui.
    omv_debian_suite: trixie
    # Codinome da linha do OMV, não do Debian. OMV 8 ("sandworm") acompanha o
    # Debian 13; os dois sobem de versão juntos.
    omv_release: sandworm
    omv_keyring_url: https://packages.openmediavault.org/public/archive.key
    # Usuário SMB com que o Proxmox monta o share de backup. O nome tem de
    # bater com o `username` do templates/proxmox/proxmox_storage.j2, e a senha
    # com a que o 00-proxmox-setup.yml grava em
    # /etc/pve/priv/storage/<id>.pw — as duas saem da mesma chave do vault.
    omv_backup_user: smb

  pre_tasks:
    - name: Validar segredos do Vault exigidos por este play
      ansible.builtin.include_tasks: "../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - ssh_public_key
          - proxmox_backup_share_password
  tasks:
    # Mesmo racional do 00-proxmox-setup.yml: o Debian 13 usa deb822, e manter
    # o `sources.list` antigo com o mesmo repositório declarado nos dois
    # formatos faz o apt avisar de entrada duplicada — além de deixar viva uma
    # suíte que este playbook acredita ter trocado.
    - name: Esvaziar o /etc/apt/sources.list legado (o formato válido no Debian 13 é deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        content: |
          # Intencionalmente vazio — gerenciado por Ansible.
          # Os repositórios vivem em /etc/apt/sources.list.d/*.sources (deb822).
        owner: root
        group: root
        mode: '0644'

    - name: "Declarar os repositórios oficiais do Debian em deb822, suíte {{ omv_debian_suite }}"
      ansible.builtin.deb822_repository:
        name: debian
        types: [deb]
        uris: https://deb.debian.org/debian
        suites: "{{ omv_debian_suite }} {{ omv_debian_suite }}-updates"
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: "Declarar o repositório de segurança do Debian em deb822, suíte {{ omv_debian_suite }}"
      ansible.builtin.deb822_repository:
        name: debian-security
        types: [deb]
        uris: https://security.debian.org/debian-security
        suites: "{{ omv_debian_suite }}-security"
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: Atualizar cache do APT e pacotes no OMV Host
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Instalar pacotes de suporte, microcódigo, Fail2ban, SMART, ZRAM e ferramentas CLI
      ansible.builtin.apt:
        name:
          - intel-microcode
          - amd64-microcode
          - fail2ban
          - smartmontools
          - cpufrequtils
          - chrony
          # Explícito: o Debian 13 não o instala por padrão, e sem ele não
          # existe /etc/rsyslog.d — a task de envio de log para o Alloy, mais
          # abaixo, falharia por diretório inexistente.
          - rsyslog
          - zram-tools
          - btop
          - ncdu
          - ripgrep
          - fzf
          - tmux
          - htop
          - lm-sensors
          - sysstat
          - curl
          - git
          - rsync
          - ethtool
          - hdparm
          # `deb822_repository`, usado logo abaixo, é um módulo Python que faz
          # `from debian.deb822 import Deb822`. Sem este pacote ele falha com
          # missing_required_lib.
          - python3-debian
        state: present

    # ------------------------------------------------------------------------
    # Instalação do OpenMediaVault
    # ------------------------------------------------------------------------
    # ⚠️ Até aqui este playbook NÃO instalava o OMV. Ele configurava apt,
    # fail2ban, sysctl e aliases sobre um Debian puro e imprimia um banner de
    # sucesso — enquanto a instalação de verdade era trabalho de console que
    # nenhum playbook cobria. Pior: o `00-proxmox-setup.yml` decide se aplica o
    # storage de backup sondando a porta 445 deste host, ou seja, dependia de
    # alguém ter clicado numa UI. Era exatamente o estado manual que a detecção
    # de dependências existe para dispensar.
    #
    # Repositório declarado, e não o `curl | bash` do script de instalação
    # oficial: o mecanismo já está aqui, é auditável, e não executa código
    # remoto não verificado como root.
    - name: "Declarar o repositório do OpenMediaVault ({{ omv_release }})"
      ansible.builtin.deb822_repository:
        name: openmediavault
        types: [deb]
        uris: https://packages.openmediavault.org/public
        suites: "{{ omv_release }}"
        components: [main]
        signed_by: "{{ omv_keyring_url }}"
        state: present

    - name: Instalar o OpenMediaVault
      ansible.builtin.apt:
        name: openmediavault
        state: present
        update_cache: true
        # O pacote roda os próprios scripts de pós-instalação, que mexem em
        # rede e serviços; sem isto o dpkg pode parar num prompt de conffile e
        # travar o playbook até o timeout.
        force_apt_get: true
      environment:
        DEBIAN_FRONTEND: noninteractive
        APT_LISTCHANGES_FRONTEND: none

    # `omv-confdbadm populate` semeia o banco de configuração do OMV. É
    # idempotente, mas só existe depois de o pacote instalar — daí o `stat`, que
    # também torna a task honesta num host onde a instalação falhou.
    - name: Verificar se as ferramentas do OMV estão presentes
      ansible.builtin.stat:
        path: /usr/sbin/omv-confdbadm
      register: omv_bin

    - name: Semear o banco de configuração do OMV
      ansible.builtin.command: omv-confdbadm populate
      when: omv_bin.stat.exists
      changed_when: true

    # ------------------------------------------------------------------------
    # Usuário e compartilhamento SMB do backup
    # ------------------------------------------------------------------------
    # A outra metade do trabalho de console: sem estes dois, o storage que o
    # `00-proxmox-setup.yml` declara no hipervisor aponta para um share que não
    # existe, e o `pvesm status` o reporta inativo — onde o 06-backup.yml
    # aborta, dois passos adiante e com a causa fora de vista.
    #
    # ⚠️ Via `omv-rpc`, que é a interface que a própria UI do OMV usa. Os nomes
    # de método são estáveis há várias versões, mas NÃO foram exercitados contra
    # um OMV 8 real a partir deste repositório: se algum tiver mudado, a task
    # falha alto, com a saída do comando — nunca em silêncio.
    - name: Levantar os usuários do OMV
      ansible.builtin.command: omv-rpc -u admin 'UserMgmt' 'enumerateUsers'
      register: omv_users
      changed_when: false
      check_mode: false
      when: omv_bin.stat.exists

    - name: "Criar o usuário SMB do backup ({{ omv_backup_user }})"
      ansible.builtin.command:
        argv:
          - omv-rpc
          - -u
          - admin
          - UserMgmt
          - setUser
          - >-
            {"name":"{{ omv_backup_user }}",
             "password":"{{ proxmox_backup_share_password }}",
             "shell":"/usr/sbin/nologin","groups":[],"comment":"Backup do Proxmox",
             "email":"","disallowusermod":true,"sshpubkeys":[]}
      when:
        - omv_bin.stat.exists
        - omv_backup_user not in (omv_users.stdout | default('[]') | from_json
                                  | map(attribute='name') | list)
      changed_when: true
      no_log: true

    - name: Aplicar a configuração de usuários e do Samba
      ansible.builtin.command: "omv-salt deploy run {{ item }}"
      loop:
        - systemd-networkd
        - samba
      when: omv_bin.stat.exists
      changed_when: true

    # Ver a nota em 00-proxmox-setup.yml: servidor interno opcional seguido das
    # públicas, para que o host não fique sem fonte de tempo se o firewall
    # ainda não servir NTP.
    - name: Configurar Chrony NTP
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        content: |
          {% for servidor in ntp_servers %}
          server {{ servidor }} iburst
          {% endfor %}
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar Chrony NTP
      ansible.builtin.systemd:
        name: chrony
        state: restarted
        enabled: true

    - name: Configurar ZRAM Swap Comprimido em RAM com algoritmo lz4
      ansible.builtin.copy:
        dest: /etc/default/zramswap
        content: |
          ALGO=lz4
          PERCENT=25
          PRIORITY=100
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar serviço ZRAM Swap
      ansible.builtin.systemd:
        name: zramswap
        state: restarted
        enabled: true

    - name: Configurar Fail2ban para proteção do SSH no OMV
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/omv-sshd.conf
        content: |
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          maxretry = 3
          findtime = 600
          bantime = 3600
        owner: root
        group: root
        mode: '0644'

    - name: Garantir serviço do Fail2ban ativo e habilitado
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true

    - name: Configurar CPU Performance Governor no OMV Host
      ansible.builtin.copy:
        dest: /etc/default/cpufrequtils
        content: |
          GOVERNOR="performance"
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Blacklist de módulos de Kernel não utilizados (bluetooth, firewire)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-unused.conf
        content: |
          blacklist bluetooth
          blacklist firewire-core
          blacklist appletalk
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Timeout de Shell Ocioso, Aliases QoL e Histórico Bash no OMV
      ansible.builtin.copy:
        dest: /etc/profile.d/homelab-qol.sh
        content: |
          export TMOUT=900
          export HISTTIMEFORMAT="%F %T "
          export HISTSIZE=50000
          export HISTFILESIZE=100000
          alias omv-top='btop'
          alias disk-map='ncdu /'
          alias zram-stats='zramctl'
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Sysctl Enterprise do Kernel (swappiness=10, dirty memory, fq_codel, somaxconn, eBPF, suid_dumpable)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-omv-tuning.conf
        content: |
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          vm.max_map_count = 262144
          vm.dirty_ratio = 10
          vm.dirty_background_ratio = 5
          fs.file-max = 2097152
          fs.inotify.max_user_watches = 524288
          fs.suid_dumpable = 0
          net.core.default_qdisc = fq_codel
          net.core.somaxconn = 65535
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.core.netdev_max_backlog = 10000
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.ip_early_demux = 1
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.icmp_echo_ignore_broadcasts = 1
          net.ipv6.conf.all.accept_redirects = 0
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.unprivileged_bpf_disabled = 1
        owner: root
        group: root
        mode: '0644'

    - name: Aplicar sysctl no OMV Host
      ansible.builtin.command: "sysctl --system"
      changed_when: true

    - name: Configurar Regra de I/O Scheduler para SSDs e HDDs (mq-deadline / bfq)
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-scheduler.rules
        content: |
          ACTION=="add|change", KERNEL=="sd[a-z]|nvme[0-n]n[1-9]", ATTR{queue/scheduler}="mq-deadline"
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Envio Centralizado de Logs Syslog do OMV para o Grafana Alloy (UDP 1514)
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/50-remote-alloy-syslog.conf
        content: |
          *.* @{{ syslog_server_ip }}:{{ syslog_server_port | default('1514') }}
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar rsyslog no OMV
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
        enabled: true

    - name: Agendar fstrim semanal nos domingos às 02:00 AM para manutenção dos SSDs
      ansible.builtin.raw: '(crontab -l 2>/dev/null; echo "0 2 * * 0 /sbin/fstrim -av") | sort -u | crontab -'
      changed_when: false

    - name: Configurar Otimizações de Desempenho no Samba/CIFS em /etc/samba/smb.conf.d/tuning.conf
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf.d/tuning.conf
        content: |
          [global]
          use sendfile = yes
          aio read size = 16384
          aio write size = 16384
          socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Aumento de Threads do Servidor Kernel NFS (16 Threads) em /etc/nfs.conf
      community.general.ini_file:
        path: /etc/nfs.conf
        section: nfsd
        option: threads
        value: '16'
        mode: '0644'

    - name: Configurar Spin-Down de HDDs Mecânicos (20 minutos) em /etc/hdparm.conf
      ansible.builtin.copy:
        dest: /etc/hdparm.conf
        content: |
          command_line_options {
            spindown_time = 240
          }
        owner: root
        group: root
        mode: '0644'

    # O `sed` anterior não era idempotente: cada execução acrescentava outro par
    # de opções, produzindo `defaults,noatime,nodiratime,noatime,nodiratime`. O
    # lookahead negativo garante que só as entradas ainda sem a opção são tocadas.
    - name: Forçar opções noatime e nodiratime nas partições montadas em /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '\bdefaults(?!,noatime)'
        replace: 'defaults,noatime,nodiratime'

    - name: Configurar Chave SSH Pública do Administrador no OpenMediaVault NAS Host
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ ssh_public_key }}"

    - name: Exibir confirmação do OMV NAS Host
      ansible.builtin.debug:
        msg: >-
          💾 OpenMediaVault padronizado: Samba com aio/sendfile, NFS em 16 threads,
          spindown de HDD, fstab com noatime, Chrony apontando para o gateway,
          Fail2ban e envio de syslog para o Alloy.
