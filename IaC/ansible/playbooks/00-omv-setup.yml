---
- name: "00 - OpenMediaVault (OMV) NAS Host Setup, Hardening e Performance Enterprise"
  hosts: omv
  become: true

  vars:
    # OMV 8 roda sobre Debian 13 (trixie), a mesma suíte do PVE 9 — os dois
    # sobem de versão juntos, e é por isso que a variável tem o mesmo nome nos
    # dois playbooks. Trocar de suíte é uma linha aqui.
    omv_debian_suite: trixie
    # Codinome da linha do OMV, não do Debian. OMV 8 é "synchrony", lançado em
    # 24/12/2025 sobre o Debian 13; os dois sobem de versão juntos. O valor
    # anterior aqui era "sandworm", que é a linha do OMV *7* sobre o Debian 12 —
    # e o par trixie+sandworm declararia o repositório do OMV 7 sobre uma base
    # Debian 13. Corrigido em 25/08/2026, depois de o garimpo do NAS mostrar
    # que a produção roda exatamente esse par antigo (OMV 7.7.2 / bookworm).
    omv_release: synchrony
    omv_keyring_url: https://packages.openmediavault.org/public/archive.key

    # ------------------------------------------------------------------------
    # Script de instalação do OMV — fixado por commit E por checksum
    # ------------------------------------------------------------------------
    # A URL aponta para um COMMIT, nunca para `master`. Um caminho de commit é
    # imutável, então o checksum abaixo não quebra sozinho quando o upstream
    # publica uma revisão nova — subir de versão é trocar estas duas linhas de
    # propósito, com o diff do script lido antes.
    #
    # O checksum é o que preserva a objeção original a `curl | bash`: se o
    # conteúdo servido não bater, o playbook FALHA em vez de executar código
    # desconhecido como root. É a diferença entre "script de terceiro" e
    # "script de terceiro que eu revisei nesta revisão exata".
    #
    # Revisão fixada: 6983f480 (21/06/2026), 27618 bytes.
    omv_install_script_commit: 6983f480513e23e8362a0f043879745df557cab7
    omv_install_script_sha256: 908e7b4170d5d1bd334184fc779e564b0b8c72ca23efe9c33c800b191c6dfc0e

    # Plugins do OMV a declarar EXPLICITAMENTE. Conferidos contra os índices
    # `Packages.gz` da suíte `synchrony` em 25/08/2026 — nenhum destes nomes é
    # suposição:
    #
    #   - `openmediavault-clamav`   vem do repositório OFICIAL (main)
    #   - `openmediavault-mergerfs` vem do repositório da COMUNIDADE (omvextras)
    #   - `openmediavault-snapraid` vem do repositório da COMUNIDADE (omvextras)
    #
    # ⚠️ Dois plugins que a produção tem NÃO entram nesta lista, e por motivos
    # diferentes:
    #
    #   - `openmediavault-omvextrasorg` é instalado pelo próprio script, a
    #     partir de um .deb que ele baixa. É ele quem cria o
    #     `/etc/apt/sources.list.d/omvextras.sources`, e portanto quem torna os
    #     dois plugins da comunidade acima alcançáveis pelo apt. Declará-lo aqui
    #     não adiantaria: antes de o script rodar, ele não existe em repositório
    #     nenhum.
    #
    #   - `openmediavault-flashmemory` MUDOU DE NOME no OMV 8: chama-se
    #     `openmediavault-writecache`. O nome antigo não existe na suíte
    #     `synchrony` — pedi-lo aqui faria o apt falhar. E o novo também não
    #     entra na lista, porque o script já o instala por padrão (`flash=
    #     "writecache"`, só pulado com a flag `-f`).
    #
    # `openmediavault-sharerootfs` também fica de fora: é dependência, entra
    # sozinho.
    omv_plugins:
      - openmediavault-clamav
      - openmediavault-mergerfs
      - openmediavault-snapraid

    # ------------------------------------------------------------------------
    # Pools do mergerfs — ver tasks/mergerfs_pools.yml para a topologia
    # ------------------------------------------------------------------------
    # Prefixo sob o qual o OMV monta todo filesystem que ele conhece. É o
    # recorte que separa "disco de dados do NAS" de "disco de boot": o disco
    # raiz desta VM é virtual e também reporta `rota: false`, então filtrar só
    # por rotacional elegeria os 16 G de boot como SSD de cache.
    mergerfs_omv_mount_prefix: /srv/dev-disk-by-uuid-
    # ⚠️ 3,5 TB é a linha que separa os três discos de 4 TB (que entram no pool)
    # do de 2,7 TB (que fica fora, por decisão de 25/08/2026). Mexer neste
    # número muda quais discos formam o pool — é limiar de topologia, não de
    # desempenho.
    mergerfs_hdd_min_bytes: 3500000000000
    mergerfs_expected_hdd_count: 3
    mergerfs_base_pool_name: DATA_NOCACHE
    mergerfs_cache_pool_name: DATA
    mergerfs_cache_dir_name: cache
    # Espaço livre abaixo do qual o mergerfs para de criar arquivo na branch.
    # No pool base é folga de manobra; no de cache é o piso que faz a escrita
    # cair direto no HDD se o mover tiver ficado para trás.
    mergerfs_base_minfreespace: 25
    mergerfs_cache_minfreespace: 20
    # ⚠️ `category.create` NÃO entra aqui. O RPC do plugin arranca qualquer
    # `category.create=` desta string (`preg_grep(..., PREG_GREP_INVERT)`) e o
    # template Jinja da unit arranca de novo — a política tem campo próprio, e é
    # diferente em cada pool. `nonempty`, `use_ino` e `allow_other` também são
    # descartados em silêncio pelo RPC; não vale declará-los.
    mergerfs_common_options: cache.files=partial,dropcacheonclose=true,moveonenospc=true,readahead=1024
    # Uso do SSD acima do qual a drenagem roda: 80% usado = 20% livre.
    mergerfs_mover_max_used_percent: 80
    mergerfs_mover_oncalendar: "*-*-* 03:00:00"
    # Constante do OMV para "objeto de configuração novo"
    # (OMV_CONFIGOBJECT_NEW_UUID em /etc/default/openmediavault). É o que faz o
    # RPC criar em vez de atualizar, e é ele que dispara a criação automática do
    # mntent do pool via FsTab.set.
    mergerfs_new_object_uuid: fa4b1c66-ef79-11e5-87a0-0002b3a176b4
    # Usuário SMB com que o Proxmox monta o share de backup. O nome tem de
    # bater com o `username` do templates/proxmox/proxmox_storage.j2, e a senha
    # com a que o 00-proxmox-setup.yml grava em
    # /etc/pve/priv/storage/<id>.pw — as duas saem da mesma chave do vault.
    omv_backup_user: smb

    # Segundo administrador do NAS, além do `admin` que o OMV cria. Vive no
    # grupo `openmediavault-admin`, que é o que dá acesso à interface de
    # administração — não é o `sudo` do sistema.
    #
    # ⚠️ Ele existe no playbook por um motivo específico: a conta mora no
    # `/etc/openmediavault/config.xml`, que a recriação da VM destrói. Sem esta
    # task, uma reconstrução deixaria o NAS com um administrador a menos e
    # ninguém teria decidido isso.
    omv_admin_user: gleiton
    # Shell de verdade, ao contrário do usuário de compartilhamento: este é um
    # administrador humano, e administrar um NAS eventualmente exige console.
    omv_admin_shell: /usr/bin/bash

  pre_tasks:
    - name: Validar segredos do Vault exigidos por este play
      ansible.builtin.include_tasks: "../tasks/validate_vault.yml"
      vars:
        required_secrets:
          - ssh_public_key
          - proxmox_backup_share_password
          - omv_admin_password
  tasks:
    # Mesmo racional do 00-proxmox-setup.yml: o Debian 13 usa deb822, e manter
    # o `sources.list` antigo com o mesmo repositório declarado nos dois
    # formatos faz o apt avisar de entrada duplicada — além de deixar viva uma
    # suíte que este playbook acredita ter trocado.
    - name: Esvaziar o /etc/apt/sources.list legado (o formato válido no Debian 13 é deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        content: |
          # Intencionalmente vazio — gerenciado por Ansible.
          # Os repositórios vivem em /etc/apt/sources.list.d/*.sources (deb822).
        owner: root
        group: root
        mode: '0644'

    - name: "Declarar os repositórios oficiais do Debian em deb822, suíte {{ omv_debian_suite }}"
      ansible.builtin.deb822_repository:
        name: debian
        types: [deb]
        uris: https://deb.debian.org/debian
        suites: "{{ omv_debian_suite }} {{ omv_debian_suite }}-updates"
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: "Declarar o repositório de segurança do Debian em deb822, suíte {{ omv_debian_suite }}"
      ansible.builtin.deb822_repository:
        name: debian-security
        types: [deb]
        uris: https://security.debian.org/debian-security
        suites: "{{ omv_debian_suite }}-security"
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    # A imagem genericcloud vem com /var/lib/apt/lists vazio; no --check o
    # update_cache abaixo não roda e toda instalação falha com "No package
    # matching". Baixar o índice não muda configuração do host.
    - name: Popular o índice do APT também no --check
      ansible.builtin.apt:
        update_cache: true
      check_mode: false
      changed_when: false
      when: ansible_check_mode

    - name: Atualizar cache do APT e pacotes no OMV Host
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Instalar pacotes de suporte, Fail2ban, SMART, ZRAM e ferramentas CLI
      ansible.builtin.apt:
        name:
          # Sem microcódigo: o NAS é VM, e convidado não carrega microcódigo —
          # quem o aplica é o hipervisor (00-proxmox-setup.yml).
          - fail2ban
          - smartmontools
          # Sem `cpufrequtils`: saiu do Debian 13 ("No package matching"), e
          # numa VM o governor é do hipervisor, não do convidado.
          - chrony
          # A imagem genericcloud do Debian NÃO traz o agente (manifesto
          # oficial conferido em 12/10/2026), e sem ele o Terraform espera o
          # timeout inteiro a cada refresh da VM 300.
          - qemu-guest-agent
          # Explícito: o Debian 13 não o instala por padrão, e sem ele não
          # existe /etc/rsyslog.d — a task de envio de log para o Alloy, mais
          # abaixo, falharia por diretório inexistente.
          - rsyslog
          - zram-tools
          - btop
          - ncdu
          - ripgrep
          - fzf
          - tmux
          - htop
          - lm-sensors
          - sysstat
          - curl
          - git
          - rsync
          - ethtool
          - hdparm
          # `deb822_repository`, usado logo abaixo, é um módulo Python que faz
          # `from debian.deb822 import Deb822`. Sem este pacote ele falha com
          # missing_required_lib.
          - python3-debian
        state: present

    # No --check os pacotes acima não são instalados de fato, e as tasks de
    # systemd mais abaixo falham com "Could not find the requested service".
    # Elas passam a rodar no --check só quando o serviço já existe no host.
    - name: Levantar os serviços existentes (gate das tasks de systemd no --check)
      ansible.builtin.service_facts:

    # ------------------------------------------------------------------------
    # Instalação do OpenMediaVault
    # ------------------------------------------------------------------------
    # ⚠️ Até aqui este playbook NÃO instalava o OMV. Ele configurava apt,
    # fail2ban, sysctl e aliases sobre um Debian puro e imprimia um banner de
    # sucesso — enquanto a instalação de verdade era trabalho de console que
    # nenhum playbook cobria. Pior: o `00-proxmox-setup.yml` decide se aplica o
    # storage de backup sondando a porta 445 deste host, ou seja, dependia de
    # alguém ter clicado numa UI. Era exatamente o estado manual que a detecção
    # de dependências existe para dispensar.
    #
    # ⚠️ MUDANÇA DE ABORDAGEM, 25/08/2026. Este bloco declarava o repositório do
    # OMV com `deb822_repository` e instalava `openmediavault` com `apt`,
    # justamente para NÃO usar o script da comunidade. Passou a usar o script,
    # por decisão registrada, e o motivo é que a produção foi construída assim —
    # o garimpo do NAS achou o `./install -n` no `.bash_history`. Manter o
    # caminho do apt significaria que o playbook nunca reproduziria a máquina
    # que existe.
    #
    # A objeção original ao `curl | bash` continua válida e continua atendida:
    # o script é baixado de um COMMIT fixo, com CHECKSUM conferido, e só então
    # executado. Ver os comentários de `omv_install_script_commit` no `vars:`.
    #
    # ⚠️ O repositório oficial do OMV NÃO é mais declarado aqui. O script
    # escreve `/etc/apt/sources.list.d/openmediavault.list` por conta própria
    # (linha 418 da revisão fixada). Declarar em paralelo criaria dois arquivos
    # apontando para o mesmo repositório, com duas suítes que divergem no
    # próximo major — exatamente a duplicação de fonte da verdade que este
    # repositório existe para evitar. A variável `omv_release` sobreviveu, mas
    # mudou de papel: em vez de DECLARAR a suíte, ela agora CONFERE a que o
    # script escreveu.
    - name: Verificar se o OMV já está instalado
      ansible.builtin.command: dpkg-query -W -f=${Status} openmediavault
      register: omv_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Baixar o script de instalação do OMV no commit fixado
      ansible.builtin.get_url:
        url: >-
          https://raw.githubusercontent.com/OpenMediaVault-Plugin-Developers/installScript/{{
          omv_install_script_commit }}/install
        dest: /usr/local/src/omv-install-{{ omv_install_script_commit[:8] }}.sh
        checksum: "sha256:{{ omv_install_script_sha256 }}"
        owner: root
        group: root
        # 0700: o script roda como root e o host tem usuários com shell
        # (o usuário de compartilhamento SMB entre eles). Ver o achado de
        # propriedade do binário do node_exporter no garimpo de 25/08/2026.
        mode: "0700"
      when: "'install ok installed' not in omv_installed.stdout"

    # ⚠️ A flag `-n` pula a configuração de rede do script. Em amd64 ela é, hoje,
    # redundante: a revisão fixada sai com `exit 0` na linha 711, antes do bloco
    # de rede da linha 769. Ela é passada assim mesmo por duas razões — é o que
    # a produção usou, e o bloco que ela desarma faz
    # `apt purge network-manager dhcpcd5 cloud-init` seguido de
    # `omv-salt deploy run systemd-networkd`. Neste host a rede INTEIRA é o
    # `50-cloud-init.yaml` de uma imagem cloud do Debian; se o `exit 0` de amd64
    # sair do script um dia, a diferença entre passar e não passar `-n` é a
    # máquina voltar sem rede. O checksum acima é o que torna esse "um dia" um
    # evento visível em vez de uma surpresa.
    #
    # `-r` pula o reboot. Também está dentro do bloco de rede, portanto também
    # redundante hoje, e passado pelo mesmo motivo: quem reinicia este host é o
    # operador, com o playbook mostrando no log que reiniciou.
    - name: Instalar o OMV pelo script fixado (rede e reboot desarmados)
      ansible.builtin.command:
        cmd: /usr/local/src/omv-install-{{ omv_install_script_commit[:8] }}.sh -n -r
      register: omv_install_run
      changed_when: true
      when:
        - "'install ok installed' not in omv_installed.stdout"
        - not ansible_check_mode
      environment:
        DEBIAN_FRONTEND: noninteractive
        APT_LISTCHANGES_FRONTEND: none

    - name: "Relatar o que a instalação do OMV faria (modo --check)"
      ansible.builtin.debug:
        msg: >-
          O OMV seria instalado pelo script no commit
          {{ omv_install_script_commit[:8] }}, com as flags -n -r.
      when:
        - "'install ok installed' not in omv_installed.stdout"
        - ansible_check_mode

    # A conferência que a declaração de repositório deixou de fazer. Se o script
    # escrever uma suíte diferente da esperada, é porque o par Debian/OMV mudou
    # debaixo do playbook — e é melhor parar aqui do que instalar plugins da
    # linha errada dois passos adiante.
    - name: Ler o repositório do OMV que o script declarou
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/openmediavault.list
      register: omv_sources
      when: not ansible_check_mode

    - name: "Conferir que a suíte declarada é a esperada ({{ omv_release }})"
      ansible.builtin.assert:
        that:
          - omv_release in (omv_sources.content | b64decode)
        fail_msg: >-
          O script declarou uma suíte do OMV diferente de '{{ omv_release }}'.
          Conteúdo: {{ omv_sources.content | b64decode | trim }}. Confira o par
          Debian/OMV antes de seguir — os plugins abaixo saem desta suíte.
      when: not ansible_check_mode

    # `omv-confdbadm populate` semeia o banco de configuração do OMV. É
    # idempotente, mas só existe depois de o pacote instalar — daí o `stat`.
    - name: Verificar se as ferramentas do OMV estão presentes
      ansible.builtin.stat:
        path: /usr/sbin/omv-confdbadm
      register: omv_bin

    # ⚠️ Isto é um assert, e não um `when:` que pula em silêncio. O script tem
    # muitos caminhos de saída, e um `when: omv_bin.stat.exists` faria o play
    # seguir sem semear o banco, sem instalar plugin nenhum, e ainda imprimir o
    # banner de sucesso no fim. Sucesso relatado sem efeito é o modo de falha
    # mais caro que já apareceu neste repositório; aqui ele para.
    - name: Confirmar que a instalação do OMV realmente aconteceu
      ansible.builtin.assert:
        that:
          - omv_bin.stat.exists
        fail_msg: >-
          /usr/sbin/omv-confdbadm não existe: o script de instalação do OMV não
          concluiu. Leia o log do script no host antes de rodar de novo — as
          tasks seguintes (banco de configuração, plugins, usuário SMB) dependem
          desta e seriam puladas em silêncio.
      when: not ansible_check_mode

    - name: Semear o banco de configuração do OMV
      ansible.builtin.command: omv-confdbadm populate
      when: omv_bin.stat.exists
      changed_when: true

    # ------------------------------------------------------------------------
    # Plugins do OMV
    # ------------------------------------------------------------------------
    # ⚠️ Plugin do OMV é pacote apt puro. A página de plugins da console web é
    # frontend de apt, e não faz nada além dele: o postinst de cada pacote semeia
    # o próprio schema no `config.xml`. Foi assim que os seis plugins da produção
    # entraram — pela UI — e é por isso que `ansible.builtin.apt` os reproduz sem
    # precisar de `omv-rpc`.
    #
    # A ordem aqui é obrigatória e não é óbvia: estes pacotes só existem para o
    # apt DEPOIS de o script ter instalado o `openmediavault-omvextrasorg`, que
    # é quem escreve o `omvextras.sources`. Por isso este bloco vem depois da
    # instalação, e não junto dos outros pacotes lá em cima.
    #
    # ⚠️ Sem versão fixada, de propósito. A suíte já limita o major, que é o que
    # importa — plugin da linha errada não instala. Fixar o patch quebraria no
    # primeiro `omv-upgrade` disparado pela UI, que é a via normal de atualização
    # desta máquina: o `apt/history.log` dos últimos nove meses não contém outro
    # comando. A regra de tag fixa do CLAUDE.md é sobre imagem Docker, não sobre
    # pacote apt de distribuição.
    #
    # ⚠️ O `mergerfs` (pacote base, não o plugin) estava fixado à mão na produção
    # em `2.39.0~debian-bookworm`, um build do upstream. O pin CAI aqui, e não
    # por preferência: aquela string de versão é de bookworm e não resolve em
    # trixie. O plugin `openmediavault-mergerfs` puxa o `mergerfs` do Debian
    # como dependência, e o trixie traz 2.40.2-5 — mais novo que o pin que saiu.
    - name: Atualizar o cache do APT com os repositórios que o OMV acrescentou
      ansible.builtin.apt:
        update_cache: true
      when: not ansible_check_mode

    - name: "Instalar os plugins do OMV ({{ omv_plugins | join(', ') }})"
      ansible.builtin.apt:
        name: "{{ omv_plugins }}"
        state: present
        # Os plugins rodam `omv-salt` no pós-instalação e mexem em serviços;
        # sem isto o dpkg pode parar num prompt de conffile e travar o playbook
        # até o timeout.
        force_apt_get: true
      environment:
        DEBIAN_FRONTEND: noninteractive
        APT_LISTCHANGES_FRONTEND: none
      when: omv_bin.stat.exists

    # ⚠️ Antes dos pools, e a ordem é requisito: a eleição das branches lê os
    # pontos de montagem reais sob /srv/dev-disk-by-uuid-*, que só existem
    # depois que o OMV registra os filesystems.
    - name: Registrar os filesystems de dados que já existem nos discos
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/omv_mount_filesystems.yml"
      when: omv_bin.stat.exists

    - name: Configurar os pools do mergerfs e a drenagem do cache
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/mergerfs_pools.yml"
      when: omv_bin.stat.exists

    # ------------------------------------------------------------------------
    # Usuário e compartilhamento SMB do backup
    # ------------------------------------------------------------------------
    # A outra metade do trabalho de console: sem estes dois, o storage que o
    # `00-proxmox-setup.yml` declara no hipervisor aponta para um share que não
    # existe, e o `pvesm status` o reporta inativo — onde o 06-backup.yml
    # aborta, dois passos adiante e com a causa fora de vista.
    #
    # ⚠️ Via `omv-rpc`, que é a interface que a própria UI do OMV usa. Os nomes
    # de método são estáveis há várias versões, mas NÃO foram exercitados contra
    # um OMV 8 real a partir deste repositório: se algum tiver mudado, a task
    # falha alto, com a saída do comando — nunca em silêncio.
    - name: Levantar os usuários do OMV
      ansible.builtin.command: omv-rpc -u admin 'UserMgmt' 'enumerateUsers'
      register: omv_users
      changed_when: false
      check_mode: false
      when: omv_bin.stat.exists

    - name: "Criar o usuário SMB do backup ({{ omv_backup_user }})"
      ansible.builtin.command:
        argv:
          - omv-rpc
          - -u
          - admin
          - UserMgmt
          - setUser
          - >-
            {"name":"{{ omv_backup_user }}",
             "password":"{{ proxmox_backup_share_password }}",
             "shell":"/usr/sbin/nologin","groups":[],"comment":"Backup do Proxmox",
             "email":"","disallowusermod":true,"sshpubkeys":[]}
      when:
        - omv_bin.stat.exists
        - omv_backup_user not in (omv_users.stdout | default('[]') | from_json
                                  | map(attribute='name') | list)
      changed_when: true
      no_log: true

    # ⚠️ `groups` recebe `openmediavault-admin`, e é só isso que separa este
    # usuário do de compartilhamento: é o grupo que dá acesso à interface de
    # administração do OMV. `disallowusermod: false` porque um administrador
    # precisa poder trocar a própria senha — o oposto da conta de serviço acima.
    - name: "Criar o segundo administrador do NAS ({{ omv_admin_user }})"
      ansible.builtin.command:
        argv:
          - omv-rpc
          - -u
          - admin
          - UserMgmt
          - setUser
          - >-
            {"name":"{{ omv_admin_user }}",
             "password":"{{ omv_admin_password }}",
             "shell":"{{ omv_admin_shell }}",
             "groups":["openmediavault-admin"],
             "comment":"Segundo administrador",
             "email":"","disallowusermod":false,"sshpubkeys":[]}
      when:
        - omv_bin.stat.exists
        - omv_admin_user not in (omv_users.stdout | default('[]') | from_json
                                 | map(attribute='name') | list)
      changed_when: true
      no_log: true

    - name: Aplicar a configuração de usuários e do Samba
      ansible.builtin.command: "omv-salt deploy run {{ item }}"
      loop:
        - systemd-networkd
        - samba
      when: omv_bin.stat.exists
      changed_when: true

    # Ver a nota em 00-proxmox-setup.yml: servidor interno opcional seguido das
    # públicas, para que o host não fique sem fonte de tempo se o firewall
    # ainda não servir NTP.
    - name: Configurar Chrony NTP
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        content: |
          {% for servidor in ntp_servers %}
          server {{ servidor }} iburst
          {% endfor %}
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar Chrony NTP
      ansible.builtin.systemd:
        name: chrony
        state: restarted
        enabled: true
      when: not ansible_check_mode or 'chrony.service' in ansible_facts.services

    - name: Configurar ZRAM Swap Comprimido em RAM com algoritmo lz4
      ansible.builtin.copy:
        dest: /etc/default/zramswap
        content: |
          ALGO=lz4
          PERCENT=25
          PRIORITY=100
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar serviço ZRAM Swap
      ansible.builtin.systemd:
        name: zramswap
        state: restarted
        enabled: true
      when: not ansible_check_mode or 'zramswap.service' in ansible_facts.services

    - name: Configurar Fail2ban para proteção do SSH no OMV
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/omv-sshd.conf
        content: |
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          maxretry = 3
          findtime = 600
          bantime = 3600
        owner: root
        group: root
        mode: '0644'

    - name: Garantir serviço do Fail2ban ativo e habilitado
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true
      when: not ansible_check_mode or 'fail2ban.service' in ansible_facts.services

    - name: Configurar Blacklist de módulos de Kernel não utilizados (bluetooth, firewire)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-unused.conf
        content: |
          blacklist bluetooth
          blacklist firewire-core
          blacklist appletalk
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Timeout de Shell Ocioso, Aliases QoL e Histórico Bash no OMV
      ansible.builtin.copy:
        dest: /etc/profile.d/homelab-qol.sh
        content: |
          export TMOUT=900
          export HISTTIMEFORMAT="%F %T "
          export HISTSIZE=50000
          export HISTFILESIZE=100000
          alias omv-top='btop'
          alias disk-map='ncdu /'
          alias zram-stats='zramctl'
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Sysctl Enterprise do Kernel (swappiness=10, dirty memory, fq_codel, somaxconn, eBPF, suid_dumpable)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-omv-tuning.conf
        content: |
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          vm.max_map_count = 262144
          vm.dirty_ratio = 10
          vm.dirty_background_ratio = 5
          fs.file-max = 2097152
          fs.inotify.max_user_watches = 524288
          fs.suid_dumpable = 0
          net.core.default_qdisc = fq_codel
          net.core.somaxconn = 65535
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.core.netdev_max_backlog = 10000
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.ip_early_demux = 1
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.icmp_echo_ignore_broadcasts = 1
          net.ipv6.conf.all.accept_redirects = 0
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.unprivileged_bpf_disabled = 1
        owner: root
        group: root
        mode: '0644'

    - name: Aplicar sysctl no OMV Host
      ansible.builtin.command: "sysctl --system"
      changed_when: true

    - name: Configurar Regra de I/O Scheduler para SSDs e HDDs (mq-deadline / bfq)
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-scheduler.rules
        content: |
          ACTION=="add|change", KERNEL=="sd[a-z]|nvme[0-n]n[1-9]", ATTR{queue/scheduler}="mq-deadline"
        owner: root
        group: root
        mode: '0644'

    # ⚠️ O alvo declara o encaminhamento em `rsyslog.d/50-remote-alloy-syslog.conf`.
    # Qualquer linha de encaminhamento no `/etc/rsyslog.conf` principal é, por
    # definição, divergência — e divergência aqui não é inofensiva: o host passa
    # a enviar para DOIS destinos, e o antigo continua recebendo sem que nada
    # acuse. Encontrado assim em produção em 06/09/2026, com
    # `*.* @<coletor-antigo>:514` acrescentado à mão no fim do arquivo.
    #
    # Removida, e não preservada, pelo princípio do CLAUDE.md: configuração
    # feita à mão que o IaC não parametriza DEVE ser perdida.
    - name: Remover encaminhamento de syslog fora do arquivo que este play controla
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.conf
        regexp: '^\s*\*\.\*\s+@'
        state: absent

    # ⚠️ O OMV tem um encaminhamento de syslog PRÓPRIO, e a task acima não o
    # alcança. Ele não mora em `/etc/rsyslog.conf`: o OMV o guarda no banco de
    # configuração dele e GERA
    # `/etc/rsyslog.d/openmediavault-remote.conf` a cada deploy, com o aviso
    # "Do not edit this file, your changes will get lost" no cabeçalho. Apagar
    # o arquivo não resolve — o próximo `omv-salt deploy` o traz de volta.
    #
    # Medido no NAS em 07/09/2026: `conf.system.syslog.remote` estava com
    # `enable: true` apontando para o coletor antigo na 514, ao lado do arquivo
    # que este play escreve. Sem desligar isto, o NAS envia para DOIS destinos
    # depois da reconstrução.
    #
    # ⚠️ E a alternativa "apontar o próprio OMV para o Alloy" NÃO serve: a linha
    # que ele gera não leva template, então sai em RFC3164, e o ouvinte da 1514
    # declara RFC5424 — a mensagem chega e é descartada em silêncio. Mandá-la
    # para a 1515 funcionaria, mas ali `use_incoming_timestamp` está desligado
    # de propósito, e o NAS passaria a ser o único equipamento com horário de
    # PROCESSAMENTO em vez de horário de origem.
    - name: Ler o encaminhamento de syslog nativo do OMV
      ansible.builtin.command:
        cmd: omv-confdbadm read conf.system.syslog.remote
      register: omv_syslog_remoto
      changed_when: false
      failed_when: false

    - name: Desligar o encaminhamento de syslog nativo do OMV
      ansible.builtin.command:
        cmd: >-
          omv-confdbadm update conf.system.syslog.remote
          '{"enable":false,"host":"","port":514,"protocol":"udp"}'
      # ⚠️ O teste de `{` não é paranoia: `from_json` sobre saída que não é JSON
      # estoura o play inteiro, e este comando pode responder com texto de
      # ajuda se o nome do modelo mudar entre versões do OMV. Melhor não
      # desligar nada do que derrubar o play na leitura.
      when:
        - omv_syslog_remoto.rc == 0
        - omv_syslog_remoto.stdout | trim is match('^\{')
        - (omv_syslog_remoto.stdout | from_json).enable | default(false) | bool
      changed_when: true
      notify: Reimplantar o rsyslog do OMV

    # O handler roda ANTES da escrita do nosso arquivo? Não: `meta` força o
    # flush aqui, de propósito. O `omv-salt deploy` reescreve o diretório
    # `/etc/rsyslog.d/` a partir do banco do OMV, e precisa acontecer antes de
    # colocarmos o nosso arquivo lá — na ordem inversa, o deploy rodaria no fim
    # do play e o nosso arquivo sobreviveria por sorte, não por desenho.
    - name: Aplicar a reimplantação do rsyslog antes de escrever o nosso arquivo
      ansible.builtin.meta: flush_handlers

    - name: Configurar Envio Centralizado de Logs Syslog do OMV para o Grafana Alloy (UDP 1514)
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/50-remote-alloy-syslog.conf
        content: |
          # ⚠️ O template NÃO é opcional. Sem ele o rsyslog usa o
          # `RSYSLOG_TraditionalForwardFormat`, que é RFC3164, e o ouvinte do
          # Alloy na 1514 declara RFC5424 — a mensagem chega e é descartada em
          # silêncio, sem erro em ponta nenhuma.
          *.* @{{ syslog_server_ip }}:{{ syslog_server_port }};RSYSLOG_SyslogProtocol23Format
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar rsyslog no OMV
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
        enabled: true
      when: not ansible_check_mode or 'rsyslog.service' in ansible_facts.services

    - name: Agendar fstrim semanal nos domingos às 02:00 AM para manutenção dos SSDs
      ansible.builtin.raw: '(crontab -l 2>/dev/null; echo "0 2 * * 0 /sbin/fstrim -av") | sort -u | crontab -'
      changed_when: false

    - name: Configurar Otimizações de Desempenho no Samba/CIFS em /etc/samba/smb.conf.d/tuning.conf
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf.d/tuning.conf
        content: |
          [global]
          use sendfile = yes
          aio read size = 16384
          aio write size = 16384
          socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
        owner: root
        group: root
        mode: '0644'

    - name: Configurar Aumento de Threads do Servidor Kernel NFS (16 Threads) em /etc/nfs.conf
      community.general.ini_file:
        path: /etc/nfs.conf
        section: nfsd
        option: threads
        value: '16'
        mode: '0644'

    - name: Configurar Spin-Down de HDDs Mecânicos (20 minutos) em /etc/hdparm.conf
      ansible.builtin.copy:
        dest: /etc/hdparm.conf
        content: |
          command_line_options {
            spindown_time = 240
          }
        owner: root
        group: root
        mode: '0644'

    # O `sed` anterior não era idempotente: cada execução acrescentava outro par
    # de opções, produzindo `defaults,noatime,nodiratime,noatime,nodiratime`. O
    # lookahead negativo garante que só as entradas ainda sem a opção são tocadas.
    - name: Forçar opções noatime e nodiratime nas partições montadas em /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '\bdefaults(?!,noatime)'
        replace: 'defaults,noatime,nodiratime'

    - name: Configurar Chave SSH Pública do Administrador no OpenMediaVault NAS Host
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ ssh_public_key }}"

    # ⚠️ O NAS tinha o node_exporter instalado À MÃO, e o IaC não dizia nada
    # sobre isso — o binário existia, o repositório o ignorava, e a divergência
    # sobrevivia a qualquer apply. Confirmado ao vivo em 02/09/2026: binário em
    # /usr/local/bin pertencendo ao usuário SMB (que tem shell), executado como
    # root por uma unit sem `User=`. Escalonamento de privilégio local.
    #
    # A task inclui a REMOÇÃO da instalação manual antes de instalar o pacote.
    # Tag própria pelo mesmo motivo do playbook do Proxmox: o playbook completo
    # do OMV instala o próprio OMV e mexe em fstab, samba e sysctl. Ligar um
    # exporter não pode exigir esse alcance junto.
    - name: Instalar e verificar o node_exporter
      tags: node_exporter
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/node_exporter.yml"
        apply:
          tags: node_exporter

    - name: Exibir confirmação do OMV NAS Host
      ansible.builtin.debug:
        msg: >-
          💾 OpenMediaVault padronizado: Samba com aio/sendfile, NFS em 16 threads,
          spindown de HDD, fstab com noatime, Chrony apontando para o gateway,
          Fail2ban e envio de syslog para o Alloy.

  handlers:
    # `omv-salt deploy run rsyslog` regenera o diretório /etc/rsyslog.d/ a
    # partir do banco de configuração do OMV. É o único caminho que faz o
    # `openmediavault-remote.conf` refletir o valor novo: editar o arquivo à
    # mão é desfeito no deploy seguinte, e o próprio cabeçalho dele avisa isso.
    - name: Reimplantar o rsyslog do OMV
      ansible.builtin.command:
        cmd: omv-salt deploy run rsyslog
      changed_when: true
