---
# Fixture do teste de render. NÃO é a topologia real: usa as faixas de
# documentação da RFC 5737 e a faixa de MAC de documentação da IANA, para que
# o arquivo possa ser versionado sem acionar o gate.
#
# ⚠️ Nenhuma coleção pode ficar vazia. Um laço sobre lista vazia rende igual
# nos dois lados do diff e prova exatamente nada.

opnsense_hostname: "fw.example"
opnsense_root_password_hash: "$2y$10$FIXTURE0000000000000000000000000000000000000000000000"
opnsense_admin_username: "adminfixture"
opnsense_admin_fullname: "Admin Fixture"
opnsense_admin_password_hash: "$2y$10$FIXTURE1111111111111111111111111111111111111111111111"
# Vazio é o estado normal: a chave de registro não mora em arquivo.
# Ver o comentário em _tailscale.xml.j2.
opnsense_tailscale_preauth_key: ""
opnsense_tailscale:
  enabled: '1'
  login_server: https://controlplane.tailscale.com
  login_timeout: '10'
  listen_port: '41641'
  accept_dns: '0'
  advertise_exit_node: '1'
  accept_subnet_routes: '0'
  enable_ssh: '0'
  disable_snat: '0'
  subnets:
    - uuid: 00000000-0000-4000-8000-00000000ts01
      subnet: "192.0.2.0/24"
      description: LAN
opnsense_admin_authorizedkeys_b64: "c3NoLWVkMjU1MTkgQUFBQUZJWFRVUkU9IGZpeHR1cmVAZXhhbXBsZQo="
opnsense_webgui_althostname: "fw.example"

opnsense_pppoe_username: "fixture@isp.example"
opnsense_pppoe_password_b64: "Zml4dHVyZQo="
opnsense_gui_cert_crt_b64: "RklYVFVSRS1DUlQK"
opnsense_gui_cert_key_b64: "RklYVFVSRS1LRVkK"
opnsense_etpro_telemetry_token: "fixture-tok"

netflow_collector_ip: "192.0.2.11"
netflow_collector_port: "2056"
geoip_license_key: ""
syslog_server_ip: "192.0.2.10"
syslog_server_port: "1514"
syslog_server_port_rfc3164: "1515"

opnsense_dns_redirect_uuid: "a1000000-0000-4000-8000-00000000d015"
opnsense_dns_redirect_enabled: true
opnsense_dns_redirect_target: "192.0.2.1"
dns_redirect_bypass_ips:
  - "192.0.2.20"
  - "192.0.2.21"

parent_interface: "vtnet0"

# Interface LAN nativa (não confundir com as VLANs abaixo) e o range de UPnP
# permitido: literais que saíram do template em direção a variável (ver
# opnsense_config.xml.j2 e group_vars/network/ de cada ambiente). RFC 5737,
# não a rede real do lab.
lan_ipaddr: "192.0.2.1"
lan_dhcp_range_from: "192.0.2.170"
lan_dhcp_range_to: "192.0.2.254"
upnp_allowed_source: "198.51.100.0/24"

# Listas de domínio do DNSBL (_dns.xml.j2) — sobrescrevem o default vazio de
# group_vars/network/10-defaults.yml para exercitar o caminho não-vazio do
# template, mesmo padrão de opnsense_wan_monitor_ipv4 abaixo. Domínio de
# documentação (RFC 2606, sufixo .example), nunca o site ou dispositivo real
# de ninguém.
opnsense_dnsbl_allowlists: "shop.example,bank.example"
opnsense_dnsbl_blocklists: "iot-vendor.example,privaterelay.example"

# Constantes de PROTOCOLO (Suricata HOME_NET / lista de privatização do
# Unbound): em _common/opnsense.yml elas guardam o RFC1918 completo — o
# default de qualquer instalação OPNsense, não a topologia deste lab. Aqui o
# fixture as SOBRESCREVE com um subconjunto RFC 5737, só para não precisar de
# isenção nova no gate de segredo. A divergência de VALOR entre os dois
# arquivos é proposital nestas duas chaves — não é o mesmo caso do
# opnsense_tunables removido abaixo, que era cópia idêntica.
opnsense_ids_homenet: "198.51.100.0/24,203.0.113.0/24"
opnsense_unbound_privateaddress: "192.0.2.0/24,198.51.100.0/24,203.0.113.0/24"

# D4: sobrescreve o default de _common/opnsense.yml (1.1.1.1) para exercitar o
# caminho não-default do template, mesmo padrão de opnsense_webgui_althostname
# acima. RFC 5737, não IP real.
opnsense_wan_monitor_ipv4: "192.0.2.9"

# 2ª WAN (CLARO): NIC física e IPs de monitor dos gateways novos. Os IPs de
# monitor são anycast PÚBLICO (Cloudflare/Google), não topologia — batem com o
# 10-defaults.yml versionado, que os carrega reais pelo mesmo motivo. A NIC é
# nomenclatura de device (RFC não se aplica), espelha passthrough_wan_interface.
passthrough_wan2_interface: "enp4s0"
opnsense_wan_monitor_ipv6: "2606:4700:4700::1111"
opnsense_wan2_monitor_ipv4: "8.8.8.8"
opnsense_wan2_monitor_ipv6: "2001:4860:4860::8888"

vlans:
  - tag: 10
    name: "MGMT"
    descr: "Gerenciamento"
    ip: "198.51.100.1"
    subnet: 24
    # As duas fixtures cobrem os dois lados de cada ramo do gerador. Esta
    # alcança a `lan` e bloqueia a outra VLAN: precisa das DUAS coisas ao
    # mesmo tempo, senão as checagens de ORDEM (liberação antes de bloqueio,
    # bloqueio antes da saída para a internet) não têm o que comparar e passam
    # sem testar nada. A de baixo é o extremo oposto: sem alcance, sem
    # internet, sem gerência.
    politica:
      internet: true
      alcanca: [lan]
      gerencia: true
      # Exceção por host na fixture: exercita o ramo `excecoes` e, junto com a
      # VLAN de baixo que não tem nenhuma, os dois lados do laço. O destino é
      # uma VLAN que `alcanca` NÃO libera — se fosse uma já liberada, a regra
      # gerada seria indistinguível da de rede e o teste não provaria nada.
      excecoes:
        - descr: "host de administracao"
          origem: "198.51.100.10"
          alcanca: [20]
  - tag: 20
    name: "HOMELAB"
    descr: "Servidores"
    ip: "203.0.113.1"
    subnet: 24
    # A fixture precisa de UMA VLAN com DHCP e uma SEM: as duas metades do
    # `if vlan.dhcp_enabled` de config.xml.j2 (Kea). Sem isto o laço nunca emite
    # nada e o render aprova um template que poderia estar quebrado.
    dhcp_enabled: true
    dhcp_start: "203.0.113.100"
    dhcp_end: "203.0.113.200"
    # `alcanca` NÃO vazio junto de `gerencia: false` é o par que exercita a
    # checagem de ordem entre os dois: Management_Ports contém 80 e 443, então
    # um bloqueio de gerência antes da liberação mataria HTTP para onde
    # `alcanca` liberou de propósito. Sem esta fixture, a checagem passa sem
    # ter o que comparar.
    politica:
      internet: false
      alcanca: [lan]
      gerencia: false

dhcp_static_maps:
  - mac: "00:00:5e:00:53:01"
    hostname: "host-um"
    ipaddr: "192.0.2.201"
    descr: "Fixture um"
  - mac: "00:00:5e:00:53:02"
    hostname: "host-dois"
    ipaddr: "192.0.2.202"
    descr: "Fixture dois"

unbound_host_overrides:
  - hostname: "*"
    domain: "lab.example"
    server: "192.0.2.30"
  - hostname: "nas"
    domain: "lab.example"
    server: "192.0.2.31"
