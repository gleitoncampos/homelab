---
# Variáveis Globais de Dispositivos de Rede (OPNsense / OpenWrt) — CAMADA
# VERSIONADA.
#
# ⚠️ TODO ENDEREÇO NESTE ARQUIVO É FICTÍCIO, E A INCOERÊNCIA É DELIBERADA.
#
# Os nomes de VLAN (LAN, MGMT, HOMELAB, MAIN, IOT, GUEST, MEDIA), as tags, as
# descrições e a estrutura são reais: é assim que a rede é segmentada, e quem
# lê o repositório precisa disso para entender o desenho. Já as faixas são de
# documentação. Um leitor atento vai estranhar ver "MAIN" apontando para uma
# rede que não existe em lugar nenhum — é exatamente o efeito pretendido. A
# faixa real vive no arquivo irmão `99-local.yml`, que o `.gitignore` barra e
# que, carregado depois deste por ordem alfabética, sobrescreve o que estiver
# aqui.
#
# Sem o `99-local.yml` — o caso de um clone de terceiro — o inventário
# continua válido e completo. Ele apenas descreve uma rede de documentação em
# vez desta rede. Nada aqui pode ser `null`, ausente ou vazio, ou o clone
# quebra em vez de degradar.
#
# As faixas usadas:
#   - RFC 5737 (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) onde bastam
#     três redes distintas;
#   - RFC 2544/6890 (198.18.0.0/15, reservada para benchmarking e proibida na
#     Internet pública) nas VLANs, porque são seis e a RFC 5737 só oferece
#     três /24. O terceiro octeto espelha a tag da VLAN — 198.18.30.1 é a
#     VLAN 30 — para que o arquivo continue legível e obviamente fictício.

# syslog_server_ip e netflow_collector_ip NÃO ficam aqui: este group_vars tem
# precedência MAIOR que `group_vars/all/` para hosts do grupo `network`
# (opnsense, openwrt) — um literal aqui sombrearia silenciosamente a derivação
# de `inventories/_common/all.yml:106-107` justo para os hosts que a consomem.
# Só porta/protocolo, que não têm equivalente derivado, ficam neste arquivo.
syslog_server_port: "1514"
syslog_protocol: "udp"

# Coletor NetFlow (Akvorado / ElastiFlow)
netflow_collector_port: "2055"

# Configurações de Fuso Horário e NTP
network_timezone: "America/Sao_Paulo"
ntp_servers:
  - "a.st1.ntp.br"
  - "b.st1.ntp.br"
  - "c.st1.ntp.br"
  - "d.st1.ntp.br"

# -------------------------------------------------------------
# ARQUITETURA DE SEGMENTAÇÃO DE REDE (VLANs)
# -------------------------------------------------------------
# Nomes de interface física: reais, e ficam reais. Não são topologia — são
# nomenclatura de dispositivo, não dizem em que endereço nada responde.
parent_interface: "vtnet0" # Interface física pai no OPNsense (Trunk vmbr0 Proxmox)
passthrough_wan_interface: "enp5s0" # Interface física de rede dedicada via PCIe Pass-through (VT-d) no Proxmox Host
passthrough_wan2_interface: "enp4s0" # 2ª WAN (CLARO): NIC física dedicada via PCIe Pass-through. Nomenclatura de device, não topologia — mesmo critério de passthrough_wan_interface. Valor real no 99-local.

# IPs de monitor (dpinger): v6 da WAN1 (WAN_PPPOEV6) e v4+v6 da CLARO. São
# anycast PÚBLICO (Cloudflare/Google), não topologia — por isso têm valor real
# aqui, ao contrário do resto do arquivo. O v4 da WAN1 (WAN_GW) NÃO está aqui:
# usa opnsense_wan_monitor_ipv4, cujo default público (1.1.1.1/Cloudflare) mora
# em _common/opnsense.yml.
opnsense_wan_monitor_ipv6: "2606:4700:4700::1111"
opnsense_wan2_monitor_ipv4: "8.8.8.8"         # CLARO_DHCP
opnsense_wan2_monitor_ipv6: "2001:4860:4860::8888"  # CLARO_DHCP6

# Interface LAN nativa do OPNsense (não é uma das VLANs abaixo — é a rede sem
# tag, hoje usada pela gestão do próprio firewall e dos nós que ainda não
# migraram para VLAN). Eram literais em opnsense_config.xml.j2 até virarem
# variável: template não deve carregar a topologia real de um repositório
# público.
lan_ipaddr: "192.0.2.1"
lan_dhcp_range_from: "192.0.2.170"
lan_dhcp_range_to: "192.0.2.254"

# Rede (CIDR) correspondente a lan_ipaddr acima. Não é redundante com ele:
# lan_ipaddr é o endereço do host (o gateway), este é o endereço de rede —
# nenhum dos vlans[].subnet cobre a LAN nativa, que fica fora da lista.
# Consumida por openwrt_firewall.j2 (regra "Guest - Block Lan Access"), num
# dispositivo diferente do OPNsense — o grupo [openwrt], que também herda
# este arquivo via [network:children].
lan_network_cidr: "192.0.2.0/24"

# Faixa de origem liberada no UPnP/NAT-PMP (upnpd.internal_iface=vlan30 no
# template) — a VLAN 30 "MAIN" abaixo, de uso diário.
upnp_allowed_source: "198.18.30.0/24"

# Listas de domínio do DNSBL do Unbound (_dns.xml.j2). Vazias aqui de
# propósito: nome de domínio não aciona nenhum padrão de segredo do gate — é
# dado público por definição — mas ainda assim identifica o operador (que
# site de compra ou banco ele libera, qual marca de dispositivo IoT está na
# LAN e que ele "telefona pra casa"). A lista real vive só em `99-local.yml`,
# gitignorado.
opnsense_dnsbl_allowlists: ""
opnsense_dnsbl_blocklists: ""

# ⚠️ `vlans` é LISTA, e YAML não funde lista entre arquivos: o `99-local.yml`
# redeclara a lista INTEIRA, não um item. Ao acrescentar uma VLAN aqui,
# acrescente no arquivo local também, ou ela desaparece na máquina que tem os
# dois.
vlans:
  - tag: 10
    name: "MGMT"
    descr: "Gerenciamento de Infraestrutura (OPNsense, Proxmox, Swarm)"
    ip: "198.18.10.1"
    subnet: 24
    dhcp_enabled: false

  - tag: 20
    name: "HOMELAB"
    descr: "Servidores, Docker Swarm & Storage NAS"
    ip: "198.18.20.1"
    subnet: 24
    dhcp_enabled: false

  - tag: 30
    name: "MAIN"
    descr: "Rede Principal (PCs de Uso Diário, Notebooks, Smartphones)"
    ip: "198.18.30.1"
    subnet: 24
    dhcp_enabled: true
    dhcp_start: "198.18.30.100"
    dhcp_end: "198.18.30.254"

  - tag: 40
    name: "IOT"
    descr: "Dispositivos Inteligentes, Câmeras NVR & Automação"
    ip: "198.18.40.1"
    subnet: 24
    dhcp_enabled: true
    dhcp_start: "198.18.40.100"
    dhcp_end: "198.18.40.254"

  - tag: 50
    name: "GUEST"
    descr: "Rede de Visitantes (Apenas Acesso à Internet)"
    ip: "198.18.50.1"
    subnet: 24
    dhcp_enabled: true
    dhcp_start: "198.18.50.100"
    dhcp_end: "198.18.50.254"

  - tag: 60
    name: "MEDIA"
    descr: "Smart TVs e Dispositivos de Vídeo (Acesso ao Homelab Mídia, QoS Vídeo, 5GHz Exclusivo)"
    ip: "198.18.60.1"
    subnet: 24
    dhcp_enabled: true
    dhcp_start: "198.18.60.100"
    dhcp_end: "198.18.60.254"

# =============================================================================
# Sinalizacao de saude nos LEDs do AP OpenWrt (led-health)
# =============================================================================
# Consumido por templates/network/openwrt_led_health.sh.j2 e pelo
# openwrt_system.j2 (as seccoes `config led` que silenciam os LEDs de
# atividade wifi).
#
# NAO ha dado sensivel aqui, e por isso este bloco fica na camada versionada
# inteira: nomes de LED sao nomenclatura de hardware, e os alvos de ping sao
# anycast publico -- mesmo criterio ja aplicado aos monitores de WAN acima.
#
# O vocabulario resultante, incluindo os estados de FABRICA que este daemon
# nao controla:
#   laranja piscando <=200ms  boot / failsafe / GRAVANDO FIRMWARE (/etc/diag.sh)
#   azul fixo                 sistema no ar, daemon nao reportando
#   branco fixo               2.4G ok, 5G ok e internet ok
#   azul piscando             algum radio fora
#   laranja piscando          sem internet alem da carencia
openwrt_led_health_enabled: true
openwrt_led_health_path: "/usr/bin/led-health"

# Os dois LEDs de status dividem o MESMO difusor: acesos juntos a luz sai
# esbranquicada, e e dai que sai o "branco". Nao existe um LED branco.
openwrt_led_blue: "blue:status"
openwrt_led_yellow: "yellow:status"

openwrt_led_radios:
  - "radio0"
  - "radio1"

# Dois alvos para que um deles parar de responder ICMP nao vire alarme falso.
# Anycast publico, nao topologia. NAO usar nome DNS: falha de resolucao nao e
# falha de internet e viraria falso positivo.
openwrt_led_ping_targets:
  - "1.1.1.1"
  - "8.8.8.8"
openwrt_led_ping_timeout: 2

openwrt_led_poll_interval: 3

# Carencia antes de acusar internet fora. Dimensionada para a janela do
# failover da segunda WAN no firewall: alarmar dentro dela seria ruido
# garantido a cada troca de operadora.
openwrt_led_net_grace: 10

# ⚠️ RITMOS LENTOS DE PROPOSITO. O OpenWrt de fabrica pisca o MESMO LED
# amarelo em 50ms (failsafe), 100ms (preinit) e 200ms (upgrade). Um valor
# nosso perto de 200ms faria "gravando firmware" e "internet caiu" parecerem
# iguais, e confundir os dois faz desligar o aparelho na hora errada.
# Regra: fabrica e rapido (<=200ms), este daemon e lento (>=600ms).
openwrt_led_blink_radio_ms: 1000
openwrt_led_blink_net_ms: 600

# Reescreve o estado mesmo sem mudanca, a cada N ciclos. Escrever so na
# mudanca deixa o painel sequestravel por qualquer ator externo: o daemon
# acha que ja escreveu e nunca corrige.
openwrt_led_reaffirm_cycles: 20

# =============================================================================
# Rede do AP OpenWrt — trunk, VLANs e transição de gerência
# =============================================================================
# ⚠️ ESTE BLOCO DECIDE SE O AP CONTINUA ALCANÇÁVEL. A gerência sai da rede
# plana e vai para uma VLAN tagueada; se ela não chegar tagueada no outro lado
# do cabo, o equipamento some. O playbook arma um failsafe antes de aplicar.
#
# ORDEM ENTRE EQUIPAMENTOS: o OPNsense precisa estar tagueando estas VLANs na
# porta que recebe o cabo do AP ANTES de isto ser aplicado — ele é o outro
# lado do trunk. Aplicar o AP primeiro isola o AP.

# Porta física que recebe o cabo do switch/firewall, como trunk 802.1q.
# ⚠️ `wan` é NOME DE DEVICE TREE, não marcação de gabinete: este modelo não
# tem marcação nenhuma, e o firmware original descobre a WAN sozinho. As
# quatro portas são do mesmo switch DSA (p0..p3), então a escolha é de
# convenção, não de capacidade. A correspondência entre este nome e a posição
# física do conector está no INVENTARIO (seção 2.0) — sem ela ninguém reproduz
# a instalação com o cabo na mão: `wan` = p0 = a primeira porta da esquerda
# para a direita, olhando o roteador POR TRÁS.
openwrt_uplink_port: "wan"

# Portas deixadas FORA do bridge. Porta física dentro de um bridge que carrega
# a VLAN de gerência é acesso privilegiado para quem alcançar o aparelho
# fisicamente.
openwrt_unused_ports:
  - "lan2"
  - "lan3"

# VLANs tagueadas no trunk. A 20 (HOMELAB) não entra: o AP não a consome.
# 10 é gerência; 30/40/50/60 são as quatro SSIDs de openwrt_wireless.j2.
openwrt_trunk_vlans: [10, 30, 40, 50, 60]
openwrt_mgmt_vlan: 10

# ⚠️ Endereços FICTÍCIOS, como todo o resto deste arquivo. O real vive no
# 99-local.yml ao lado.
openwrt_mgmt_ip: "198.18.10.2"
openwrt_mgmt_netmask: "255.255.255.0"
openwrt_mgmt_gateway: "198.18.10.1"
openwrt_mgmt_dns:
  - "198.18.10.1"

# ULA gerado por equipamento. Fictício aqui; o real está no 99-local.yml.
openwrt_ula_prefix: "fd00:db8:1::/48"

# SSH do AP depois da transição. A porta e a interface do dropbear são
# variáveis porque a transição precisa saber para ONDE reconectar — e porque
# `Interface` apontando para uma interface inexistente não deixa o dropbear
# subir listener nenhum (/etc/init.d/dropbear:145-152).
openwrt_ssh_port: "2222"
openwrt_ssh_password_auth: "off"
openwrt_ssh_root_password_auth: "off"
openwrt_ssh_root_key_only: "1"

# Failsafe da transição de rede.
# ⚠️ A janela precisa caber a reconexão inteira: o AP reiniciar a rede, o
# firewall aprender o novo vizinho, e o nó de controle abrir uma conexão NOVA.
# 120s é folgado para isso e curto o bastante para não deixar o equipamento
# inalcançável por muito tempo se der errado.
openwrt_failsafe_seconds: 120
openwrt_failsafe_backup_dir: "/root/iac-failsafe"
openwrt_failsafe_confirm_file: "/tmp/openwrt-net-ok"
openwrt_failsafe_files: ["network", "system", "wireless", "firewall", "dhcp"]
