    categories: ''
    description: Porta 853 (DNS-over-QUIC em UDP, DNS-over-TLS em TCP)
  # Espaço de endereçamento privado da RFC 1918. É CONSTANTE de protocolo, não
  # topologia: vale igual em prod, em dev e em qualquer rede do mundo, por isso
  # fica aqui e não em group_vars/network/.
  #
  # ⚠️ NÃO confundir com bogons. Bogon é endereço que não deveria aparecer na
  # internet pública, e é o que o `blockbogons` da WAN usa. Aqui o alvo é o
  # oposto: o que é INTERNO. As duas listas se sobrepõem e não são a mesma.
  #
  # Não reaproveita `opnsense_unbound_privateaddress`: aquela lista existe para
  # a proteção contra rebind do Unbound e carrega faixas de documentação,
  # loopback e IPv6 que não têm o que fazer numa regra de filtro.
  # ⚠️ Destinos de RUÍDO de segmento compartilhado, e o ponto é que eles se
  # definem pelo DESTINO, não pela origem. Medido em 07/09/2026 na WAN que está
  # atrás do NAT do provedor: 908 de 1.012 bloqueios em 21 horas eram broadcast
  # e multicast de outros assinantes no mesmo segmento — 607 de IGMP para
  # 224.0.0.1, 201 de broadcast, 12 de SSDP.
  #
  # Isso NÃO é problema de blocklist: sem ela o tráfego cairia no deny padrão,
  # que também loga. Por isso a resposta é uma regra de silêncio por destino, e
  # não mexer no conteúdo de lista nenhuma.
  #
  # Só constantes universais aqui: `224.0.0.0/4` é todo o espaço multicast
  # (cobre 224.0.0.1 e 239.255.255.250) e `255.255.255.255` é o broadcast
  # limitado. O broadcast DIRIGIDO da sub-rede (`x.x.x.255`) fica de fora de
