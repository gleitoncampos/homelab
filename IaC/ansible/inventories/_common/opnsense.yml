  #
  # 1. Estava errada. `destination_net: any` com `destination_port:
  #    Management_Ports` — alias que contém 80 e 443 — não bloqueava a GUI dos
  #    gateways: bloqueava a web inteira de IOT e GUEST. Nunca foi exercida,
  #    porque foi escrita à mão para VLANs que não existem.
