# REGRAS DE FILTRO — política de segurança, vale para prod e dev
# =============================================================================
# As 11 regras do Firewall > Filter. Cada uma guarda só os campos que o
# OPNsense de fato grava para aquele tipo de regra — por isso o conjunto de
# chaves varia de uma regra para outra, e _filter.xml.j2 itera as chaves do
# próprio dado em vez de uma lista fixa.
#
# Exceção documentada: a regra uuid 3aacd6cd (`LAN > Redireciona DNS para o
# FW`) tinha, no template original, `{{ lan_ipaddr }}` embutido no texto de
# <destination_net> — é o IP do próprio firewall, ou seja, topologia, não
# política. _filter.xml.j2 faz o caso especial por uuid; o campo
# destination_net abaixo fica vazio de propósito.
