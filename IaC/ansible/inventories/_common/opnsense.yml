# =============================================================================
# SYSTEM — grupo administrativo e usuários (system/group, system/user)
# =============================================================================
# Campos por registro variam entre root e admin (privilégios, shell, dashboard
# salvo), por isso _system.xml.j2 itera as chaves do próprio dado em vez de
# lista fixa — mesmo padrão de opnsense_aliases e opnsense_rules.
#
# password, name (do admin) e authorizedkeys (do admin) ficam vazios aqui de
# propósito: são segredo/dado pessoal e o partial os substitui por caso
# especial por uuid, lendo o vault — nunca hardcoded num arquivo rastreado.
# dashboard é o layout salvo do widget da GUI (posição/tamanho de cada
# widget), não é segredo; mantido idêntico ao que a caixa grava hoje.
# =============================================================================
# TAILSCALE — VPN de acesso remoto (roadmap §3.7, decidido em 03/09/2026)
# =============================================================================
# Plano Personal (gratuito), plano de controle HOSPEDADO pela Tailscale. O
# firewall sai para alcançá-lo, então não há porta aberta na WAN nem DDNS.
#
# ⚠️ A chave de autenticação NÃO mora aqui: é segredo, e o partial a lê de
# `opnsense_tailscale_preauth_key`, no vault — mesmo caminho da senha do admin.
# Anti-portscan: passagem TCP para a internet COM limite de taxa, gerada em
# _filter.xml.j2 (sequence 55 — depois dos bloqueios ao lab, antes da saída
# geral). Quem abrir mais de `conexoes` em `segundos` cai na tabela
# `virusprot`, que a regra nativa do OPNsense bloqueia. São DOIS inteiros no
# modelo (max-src-conn-rate / max-src-conn-rates): o "50/10" num campo só da
# regra antiga não era valor válido. Substitui a regra d9e8f7a6, que bloqueava
# todo o TCP (14/10/2026). Trava em tests/render_opnsense_antiportscan.py.
opnsense_limite_conexoes:
  conexoes: 50
  segundos: 10
  vlans: [40, 50]

opnsense_tailscale:
  enabled: '1'
  login_server: https://controlplane.tailscale.com
  login_timeout: '10'
  listen_port: '41641'
  # ⚠️ 0, e o modelo do plugin entrega 1. Aceitar o DNS da tailnet aqui
  # sequestraria o Unbound deste equipamento, que serve DNSBL e os overrides
  # curinga para a rede inteira. Quem consome o DNS de casa são os PEERS, e
  # isso se configura no console (nameserver global), não neste campo.
  accept_dns: '0'
  # Decidido em 03/09/2026: o exit node é o próprio firewall.
  advertise_exit_node: '1'
  # Este nó ANUNCIA rotas; não absorve as de terceiros.
  accept_subnet_routes: '0'
  enable_ssh: '0'
  # 0 = o tailscaled faz o SNAT antes de entregar ao pf, e é por isso que a
  # geração automática de NAT de saída basta. Ligar exigiria regra outbound
  # manual, que hoje NÃO existe e não deve ser criada — ver _nat.xml.j2.
  disable_snat: '0'
  subnets:
    - uuid: 3d0bc697-16a0-4364-9770-1b09566b8ded
      subnet: "{{ lan_network_cidr }}"
      description: LAN

