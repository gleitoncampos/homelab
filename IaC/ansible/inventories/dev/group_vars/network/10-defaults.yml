---
# Dev não gerencia nenhum dispositivo de rede (sem OPNsense/OpenWrt próprio),
# então este arquivo NÃO replica `inventories/prod/group_vars/network/`
# (syslog/netflow, NTP, parent_interface etc.) — só a VLAN usada pelo CT 210.
#
# ⚠️ O endereço abaixo é fictício, e a incoerência é deliberada: a tag, o nome
# e a descrição são os reais, a faixa é de documentação. A faixa real vive no
# `99-local.yml` ao lado, gitignorado, carregado depois por ordem alfabética.
# Sem ele o inventário continua válido — descreve uma rede de documentação em
# vez desta. Mesmo desenho de `inventories/prod/group_vars/network/`.

# IPs de monitor (dpinger) da 2ª WAN e NIC física dela. Dev não tem OPNsense
# (grupo [opnsense] vazio), então nenhum host consome estas — ficam só para
# manter as duas camadas 10-defaults.yml da rede paralelas. Anycast público,
# não topologia; NIC é nomenclatura de device.
passthrough_wan2_interface: "enp4s0"
opnsense_wan2_monitor_ipv4: "8.8.8.8"
opnsense_wan2_monitor_ipv6: "2001:4860:4860::8888"

vlans:
  - tag: 20
    name: "HOMELAB"
    descr: "Servidores, Docker Swarm & Storage NAS"
    ip: "198.18.20.1"
    subnet: 24
    dhcp_enabled: false

# =============================================================================
# Sinalizacao de saude nos LEDs do AP OpenWrt (led-health)
# =============================================================================
# Consumido por templates/network/openwrt_led_health.sh.j2 e pelo
# openwrt_system.j2 (as seccoes `config led` que silenciam os LEDs de
# atividade wifi).
#
# NAO ha dado sensivel aqui, e por isso este bloco fica na camada versionada
# inteira: nomes de LED sao nomenclatura de hardware, e os alvos de ping sao
# anycast publico -- mesmo criterio ja aplicado aos monitores de WAN acima.
#
# O vocabulario resultante, incluindo os estados de FABRICA que este daemon
# nao controla:
#   laranja piscando <=200ms  boot / failsafe / GRAVANDO FIRMWARE (/etc/diag.sh)
#   azul fixo                 sistema no ar, daemon nao reportando
#   branco fixo               2.4G ok, 5G ok e internet ok
#   azul piscando             algum radio fora
#   laranja piscando          sem internet alem da carencia
openwrt_led_health_enabled: true
openwrt_led_health_path: "/usr/bin/led-health"

# Os dois LEDs de status dividem o MESMO difusor: acesos juntos a luz sai
# esbranquicada, e e dai que sai o "branco". Nao existe um LED branco.
openwrt_led_blue: "blue:status"
openwrt_led_yellow: "yellow:status"

openwrt_led_radios:
  - "radio0"
  - "radio1"

# Dois alvos para que um deles parar de responder ICMP nao vire alarme falso.
# Anycast publico, nao topologia. NAO usar nome DNS: falha de resolucao nao e
# falha de internet e viraria falso positivo.
openwrt_led_ping_targets:
  - "1.1.1.1"
  - "8.8.8.8"
openwrt_led_ping_timeout: 2

openwrt_led_poll_interval: 3

# Carencia antes de acusar internet fora. Dimensionada para a janela do
# failover da segunda WAN no firewall: alarmar dentro dela seria ruido
# garantido a cada troca de operadora.
openwrt_led_net_grace: 10

# ⚠️ RITMOS LENTOS DE PROPOSITO. O OpenWrt de fabrica pisca o MESMO LED
# amarelo em 50ms (failsafe), 100ms (preinit) e 200ms (upgrade). Um valor
# nosso perto de 200ms faria "gravando firmware" e "internet caiu" parecerem
# iguais, e confundir os dois faz desligar o aparelho na hora errada.
# Regra: fabrica e rapido (<=200ms), este daemon e lento (>=600ms).
openwrt_led_blink_radio_ms: 1000
openwrt_led_blink_net_ms: 600

# Reescreve o estado mesmo sem mudanca, a cada N ciclos. Escrever so na
# mudanca deixa o painel sequestravel por qualquer ator externo: o daemon
# acha que ja escreveu e nunca corrige.
openwrt_led_reaffirm_cycles: 20

# =============================================================================
# Rede do AP OpenWrt — trunk, VLANs e transição de gerência
# =============================================================================
# ⚠️ ESTE BLOCO DECIDE SE O AP CONTINUA ALCANÇÁVEL. A gerência sai da rede
# plana e vai para uma VLAN tagueada; se ela não chegar tagueada no outro lado
# do cabo, o equipamento some. O playbook arma um failsafe antes de aplicar.
#
# ORDEM ENTRE EQUIPAMENTOS: o OPNsense precisa estar tagueando estas VLANs na
# porta que recebe o cabo do AP ANTES de isto ser aplicado — ele é o outro
# lado do trunk. Aplicar o AP primeiro isola o AP.

# Porta física que recebe o cabo do switch/firewall, como trunk 802.1q.
# ⚠️ `wan` é NOME DE DEVICE TREE, não marcação de gabinete: este modelo não
# tem marcação nenhuma, e o firmware original descobre a WAN sozinho. As
# quatro portas são do mesmo switch DSA (p0..p3), então a escolha é de
# convenção, não de capacidade. A correspondência entre este nome e a posição
# física do conector está no INVENTARIO — sem ela ninguém reproduz a
# instalação com o cabo na mão.
openwrt_uplink_port: "wan"

# `path` de cada rádio no device tree. Sem ele o netifd não associa o
# wifi-device a um phy e nenhum SSID sobe (13/10/2026). Valores do Xiaomi
# AX3000T (mediatek/filogic); outro modelo: `cat /etc/config/wireless` de
# fábrica, ou `wifi config`.
#
# ⚠️ O caminho MUDA com o kernel: na 23.05 era `platform/18000000.wifi`; na
# 24.10 o nó foi para baixo de `soc/`. Com o valor antigo, o setup pós-upgrade
# derrubou os dois rádios (14/10/2026). O playbook confere o caminho no AP
# antes de gravar o wireless (`/sys/devices/<path sem o +N>`) e aborta.
openwrt_radio0_path: "platform/soc/18000000.wifi"
openwrt_radio1_path: "platform/soc/18000000.wifi+1"

# Portas deixadas FORA do bridge. Porta física dentro de um bridge que carrega
# a VLAN de gerência é acesso privilegiado para quem alcançar o aparelho
# fisicamente.
openwrt_unused_ports:
  - "lan2"
  - "lan3"

# VLANs tagueadas no trunk. A 20 (HOMELAB) não entra: o AP não a consome.
# 10 é gerência; 30/40/50/60 são as quatro SSIDs de openwrt_wireless.j2.
openwrt_trunk_vlans: [10, 30, 40, 50, 60]
openwrt_mgmt_vlan: 10

# ⚠️ Endereços FICTÍCIOS, como todo o resto deste arquivo. O real vive no
# 99-local.yml ao lado.
openwrt_mgmt_ip: "198.18.10.2"
openwrt_mgmt_netmask: "255.255.255.0"
openwrt_mgmt_gateway: "198.18.10.1"
openwrt_mgmt_dns:
  - "198.18.10.1"

# ULA gerado por equipamento. Fictício aqui; o real está no 99-local.yml.
openwrt_ula_prefix: "fd00:db8:1::/48"

# SSH do AP depois da transição. A porta e a interface do dropbear são
# variáveis porque a transição precisa saber para ONDE reconectar — e porque
# `Interface` apontando para uma interface inexistente não deixa o dropbear
# subir listener nenhum (/etc/init.d/dropbear:145-152).
openwrt_ssh_port: "2222"
openwrt_ssh_password_auth: "off"
openwrt_ssh_root_password_auth: "off"
openwrt_ssh_root_key_only: "1"

# Failsafe da transição de rede.
# ⚠️ A janela precisa caber a reconexão inteira: o AP reiniciar a rede, o
# firewall aprender o novo vizinho, e o nó de controle abrir uma conexão NOVA.
# 120s é folgado para isso e curto o bastante para não deixar o equipamento
# inalcançável por muito tempo se der errado.
openwrt_failsafe_seconds: 120
openwrt_failsafe_backup_dir: "/root/iac-failsafe"
openwrt_failsafe_confirm_file: "/tmp/openwrt-net-ok"
openwrt_failsafe_files: ["network", "system", "wireless", "firewall", "dhcp", "dropbear"]
