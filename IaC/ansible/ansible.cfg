[defaults]
# Default aponta para PRODUÇÃO de propósito. Sem default, um `-i` esquecido não
# casa host nenhum e o play "passa" com "no hosts matched" — falha silenciosa,
# pior que um default alto. Dev é sempre explícito:
#   ansible-playbook -i inventories/dev/hosts.ini <playbook>
inventory = inventories/prod/hosts.ini

# ⚠️ `.ini` sai da lista de extensões ignoradas e `.example` entra. Sem isto, a
# forma DIRETÓRIO do inventário (`-i inventories/prod`) roda contra dados de
# mentira, em silêncio.
#
# O default do Ansible ignora `.ini` — está na lista de fábrica, junto de `.bak`
# e `.retry`. Então, ao apontar `-i` para o diretório, ele PULA o `hosts.ini`
# real e lê o `hosts.ini.example`, cuja extensão não é ignorada. Medido nesta
# base em 01/09/2026: `--list-hosts` do playbook do firewall devolvia
# `hosts (0)`, e `node1` vinha com `ansible_host` = o literal `<IP-DO-MANAGER>`
# do modelo.
#
# ⚠️ O modo de falha ruim NÃO é o "0 hosts" — esse aparece. É o host de exemplo
# existir com endereço-placeholder: a conexão falha com erro de rede, que se lê
# como problema de infraestrutura e não como inventário errado.
#
# Trocar a lista faz as DUAS formas funcionarem (`-i inventories/prod` e
# `-i inventories/prod/hosts.ini`), em vez de fazer a forma diretório falhar
# alto — que era a alternativa. O resto da lista é o default de fábrica,
# copiado literalmente: esta opção SUBSTITUI a lista, não acrescenta a ela, e
# omitir um item aqui passa a parsear arquivo que o Ansible pulava.
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .cfg, .retry, .example
host_key_checking = False
retry_files_enabled = False
# `stdout_callback = community.general.yaml` (o valor óbvio) NÃO funciona mais:
# o plugin foi removido na community.general 12.0.0. A saída YAML virou opção do
# callback nativo. Errar aqui aborta TODO playbook antes da primeira task, e
# `--syntax-check` não pega — ele não carrega callback.
stdout_callback = default
result_format = yaml
callbacks_enabled = timer, profile_tasks

# Senha do Ansible Vault. Caminho relativo ao diretório de execução (ansible/),
# mesma convenção do `inventory` acima. O arquivo é gitignorado — crie com:
#   echo 'SUA-SENHA' > .ansible_vault_pass && chmod 600 .ansible_vault_pass
# Sem ele, qualquer playbook falha na largada: é intencional. Ver README.md.
vault_password_file = .ansible_vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# ServerAlive: sem ele, conexão que morre do outro lado (CT que reinicia a
# rede no upgrade da libc, firewall que perde o estado no reload) deixa o
# mestre do ControlPersist em ~/.ansible/cp/ pendurado para sempre — e TODA
# execução seguinte trava no `Gathering Facts` reusando o socket morto, até
# um `pkill -f .ansible/cp/` (13/10/2026, duas vezes). Com 15 s × 4, a
# conexão morta cai em ~1 min e o mestre sai. O resto repete o default.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
