services:
  dozzle:
    image: amir20/dozzle:v10.7.1
    environment:
      # Modo agente desligado: um nó só, leitura direta do socket local.
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      # Somente leitura: o Dozzle só precisa ler logs e listar containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dozzle.rule=Host(\"${FQDN}\")"
        - "traefik.http.routers.dozzle.entrypoints=websecure"
        - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
        - "traefik.http.routers.dozzle.service=dozzle"
        - "traefik.http.routers.dozzle.tls.certresolver=cloudflare"
        - "traefik.http.routers.dozzle.middlewares=dozzle-auth"
        - "traefik.http.middlewares.dozzle-auth.basicauth.users=${DOZZLE_BASICAUTH}"
        # O Dozzle lê o log de TODO container, e log de container carrega token
        # que vaza em mensagem de erro. Sem autenticação, quem alcança a rota lê
        # tudo que qualquer serviço já registrou.
        #
        # ⚠️ O hash bcrypt entra em DOZZLE_BASICAUTH SEM os `$` dobrados.
        # Dobrar é a fuga da interpolação do Compose, e vale para hash escrito
        # literalmente aqui; o que vem de variável não é reinterpolado, então
        # `$$2y$$05$$...` chegaria assim mesmo ao Traefik — não é bcrypt
        # válido, e o middleware passaria a negar toda senha, inclusive a
        # certa. Gerar com `htpasswd -nbB admin 'SENHA'`, sem `sed`.
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  traefik_public:
    external: true
