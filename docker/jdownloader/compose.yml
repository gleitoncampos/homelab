version: "3"
services:
    jdownloader-2:
        image: jlesage/jdownloader-2
        container_name: jdownloader-2
        restart: until-stopped
        ports:
            - 5800:5800
            - 3129:3129
        volumes:
            - ./config:/config:rw
            - ./Downloads:/output:rw
        environment:
            TZ: "America/Sao_Paulo"
            DARK_MODE: 1
            WEB_AUTHENTICATION: 1
            # Único controle de acesso da UI, que permite download em caminho
            # arbitrário. Definir no Portainer.
            WEB_AUTHENTICATION_USERNAME: "${JD_WEB_USERNAME}"
            WEB_AUTHENTICATION_PASSWORD: "${JD_WEB_PASSWORD}"
            SECURE_CONNECTION: 1

            
