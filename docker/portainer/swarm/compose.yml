services:
  portainer-agent:
    # ":lts" é tag flutuante — CLAUDE.md §6 proíbe em produção. "lts" aponta
    # hoje para 2.39.5; o Renovate abre PR quando ela mudar.
    image: portainer/agent:2.39.5
    environment:
      # Sem isto o agent aceita qualquer cliente que alcance a 9001 — e ele
      # monta o socket do Docker em escrita. É a porta dos fundos que anula
      # qualquer socket proxy feito nos outros serviços.
      AGENT_SECRET: "${PORTAINER_AGENT_SECRET}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      # Overlay dedicada: `traefik_public` é alcançável por TODO serviço
      # roteado, o que torna a autenticação a única barreira. Com rede própria,
      # são duas.
      - portainer_internal
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        # `any`, não `on-failure`: restart limpo do dockerd (exit 0) deixava a
        # task `Complete` e o Swarm não a recriava (13/10/2026, Traefik 0/1).
        condition: any

  portainer:
    image: portainer/portainer-ce:2.39.5
    # --tlsskipverify: cobre só a criptografia do canal com o agent, não a
    # autenticação do certificado do outro lado — AGENT_SECRET acima autentica
    # o cliente, mas nada aqui valida quem apresenta o certificado. Emitir
    # mTLS de verdade para o agent é trabalho separado, ainda pendente.
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    environment:
      AGENT_SECRET: "${PORTAINER_AGENT_SECRET}"
    # Esta porta existe por um motivo só: os playbooks 02/03/04/05 chamam a API
    # em "http://localhost:9000" a partir do próprio manager. O Traefik alcança
    # o container pela overlay `traefik_public` (label abaixo), não por aqui. A
    # porta 8000 (túnel do Edge Agent) foi removida: nada neste repo usa Edge.
    #
    # `mode: host` publica direto no nó que roda a task (com replicas: 1 +
    # constraint de manager, é sempre o mesmo nó) em vez de passar pela malha de
    # roteamento ingress, que abriria a 9000 em TODOS os nós.
    #
    # ⚠️ O bind é nas interfaces todas do manager, não só em loopback. `host_ip:
    # 127.0.0.1` seria o certo e é Compose Spec válido, mas o schema do
    # `docker stack deploy` não conhece o campo e REJEITA o arquivo inteiro
    # ("Additional property host_ip is not allowed") — Swarm não tem como
    # restringir o bind a loopback pelo stack file. UFW também não fecha isso:
    # o publish do Docker faz DNAT em nat/PREROUTING, antes da chain filter.
    # O fecho real é uma regra em DOCKER-USER, e ela já existe:
    # IaC/ansible/tasks/docker_user_rules.yml, incluída por
    # playbooks/01-bootstrap-os.yml. Ela libera só `mgmt_allowed_cidrs` na 9000
    # e descarta o resto.
    ports:
      - target: 9000
        published: 9000
        mode: host
    volumes:
      - /srv/containers/portainer:/data
    networks:
      - traefik_public
      - portainer_internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        # `any`, não `on-failure`: restart limpo do dockerd (exit 0) deixava a
        # task `Complete` e o Swarm não a recriava (13/10/2026, Traefik 0/1).
        condition: any
      labels:
        # Frontend
        - "traefik.enable=true"
        - "traefik.http.routers.portainer.rule=Host(\"${FQDN}\")"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        - "traefik.http.routers.portainer.service=portainer"
        - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
        # Só as redes de gerência e a MAIN (lista em docker/traefik/swarm/rotas.yml.j2).
        - "traefik.http.routers.portainer.middlewares=rede-admin@file"

  # Âncora da `traefik_public`: overlay só existe no nó que tem container
  # nela. O Portainer manda o deploy de stack por `tasks.portainer-agent`, que
  # sorteia entre os agentes; caindo num worker sem container na rede, o
  # Docker responde "network traefik_public ... could not be found" e o deploy
  # dá HTTP 500 (13/10/2026). Global = um container parado por nó, inclusive
  # nos que entrarem depois. Sem porta, sem volume, sem label do Traefik.
  # Trava em IaC/ansible/tests/gates_node_bootstrap.py.
  traefik-public-anchor:
    image: registry.k8s.io/pause:3.10
    networks:
      - traefik_public
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.01'
          memory: 8M
      restart_policy:
        condition: any
networks:
  traefik_public:
    external: true
  portainer_internal:
    driver: overlay
    # Não `attachable`: nada além destes dois serviços precisa entrar.
