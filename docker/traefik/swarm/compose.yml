services:
  traefik:
    # v3.6+: o Docker 29 recusa a API 1.24 que a v3.5 usava no provider
    # Swarm ("client version 1.24 is too old", 13/10/2026); a v3.6 negocia.
    image: traefik:v3.6
    command:
      - --api.insecure=false  #Enable the API dashboard access
      - --log.level=INFO
      # Versão nova chega pelo Renovate; a checagem e o uso anônimo só mandavam
      # versão e IP de saída para fora (e consultas DNS à DNSBL) a troco de nada.
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      # SEM insecureSkipVerify global (15/10/2026): ele desligava a verificação
      # de certificado para TODO back-end HTTPS. Quem precisa (firewall e
      # hipervisores, autoassinados) tem serversTransport próprio em rotas.yml.j2;
      # back-end HTTPS novo publicado por label declara o seu.
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      #- --providers.docker.constraints=Label(\"traefik.enable=true\")
      - --providers.swarm.network=traefik_public #Defina a mesma rede que você criou para o traefik
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      #Enable use files as providers. Used to redirect to static sites/hosts
      - --providers.file.directory=/config
      - --providers.file.watch=true
      ###################################
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Enable a dns challenge named "cloudflare"
      - --certificatesResolvers.cloudflare.acme.dnschallenge=true
      # Tell which provider to use
      - --certificatesResolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      # The email to provide to let's encrypt
      - --certificatesResolvers.cloudflare.acme.email=${CLOUDFLARE_EMAIL} ## Passar essa env no Portainer
      - --certificatesResolvers.cloudflare.acme.storage=/data/acme.json # Tell to store the certificate on a path under our volume
      - --certificatesResolvers.cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      # ACME_CASERVER vem do Ansible por ambiente: CA real (prod) x staging (dev/test) - evita queimar o rate limit do Let's Encrypt (5 certificados/dominio/semana)
      - --certificatesResolvers.cloudflare.acme.caserver=${ACME_CASERVER}
      # Global HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entrypoint.permanent=true
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_TOKEN} ## Passar essa env no Portainer

    # `mode: host` (15/10/2026): no formato curto as portas iam pela malha
    # ingress, e o Traefik via o IP interno dela, não o do cliente — o
    # `ipAllowList` do middleware `rede-admin` (rotas.yml.j2) não teria como
    # funcionar. Em host, a porta abre só no nó da task (o manager, pela
    # constraint abaixo).
    # ⚠️ Premissas: update `stop-first` (o padrão do Swarm; `start-first`
    # prende a porta com duas tasks no mesmo nó) e manager único (o curinga
    # do Unbound aponta para groups['homelab_managers'][0]; um segundo manager
    # pode receber a task e o DNS seguir no primeiro).
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      #- 8080:8080 # Dashboard port

    volumes:
      - /srv/containers/traefik/data/:/data #Certificate storage
      - /srv/containers/traefik/config:/config:ro #Configuration storage
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        # `any`, não `on-failure`: restart limpo do dockerd (exit 0) deixava a
        # task `Complete` e o Swarm não a recriava (13/10/2026, Traefik 0/1).
        condition: any
    networks:
      - traefik_public
networks:
  traefik_public:
    external: true
