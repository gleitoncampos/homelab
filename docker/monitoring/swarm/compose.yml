services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Vêm do inventário pelo `env` da stack no Portainer. Estavam cravados
      # aqui enquanto `prometheus_retention_time` e `prometheus_retention_size`
      # existiam no inventário sem consumidor: duas verdades, e quem editava o
      # inventário não mudava nada.
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}"
      - "--log.level=info"
    volumes:
      - /srv/containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /srv/containers/prometheus/data:/prometheus
    # Sem roteamento publico: Prometheus nao tem autenticacao propria.
    # forwardAuth de SSO nao serve aqui - o portal de login redireciona para
    # HTML e quebraria o Grafana e o Alloy, que sao clientes de maquina (nao
    # navegador). So o Grafana precisa ser publico; Prometheus fica acessivel
    # apenas na overlay "monitoring", de onde o Grafana o consome como
    # datasource.
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
      restart_policy:
        condition: on-failure
    networks:
      - monitoring

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command:
      - '--path.rootfs=/host'
      - --collector.processes
    volumes:
      - '/:/host:ro,rslave'
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    volumes:
      - /:/rootfs:ro
      # Só o socket, somente-leitura — não `/var/run` inteiro em rw, que era o
      # que estava aqui. Em Debian /var/run é symlink para /run, onde vive o
      # docker.sock: o mount antigo dava API do Docker em escrita ao cAdvisor.
      #
      # ⚠️ O `:ro` NÃO protege a API — socket é endpoint, não arquivo, e
      # `connect(2)` não é bloqueado por MS_RDONLY. Ele impede apenas que o
      # container substitua o arquivo de socket. A proteção real vem do socket
      # proxy, em fase posterior.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.8
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      # Telemetria desligada, e o motivo é medido, não preferência: o Grafana
      # consulta `stats.grafana.org` de forma contínua, o nome está na DNSBL do
      # resolver da casa e responde `0.0.0.0`, e o Grafana trata isso como falha
      # transitória e repete. A auditoria de 04/09/2026 mediu 29.422 consultas
      # em 24h vindas deste host e do CT de rsyslog — 35% de TODO o DNS da rede,
      # e o cache hit do Unbound no chão (13%). O bloqueio está certo; quem
      # estava errado era o serviço que insiste. A correção é na origem.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
    volumes:
      - /srv/containers/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - /srv/containers/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      # Dois mounts, e a separação é de propósito: `dashboards.yml` é
      # CONFIGURAÇÃO (declara o provider e onde procurar), os JSON são
      # CONTEÚDO. Funcionaria com tudo no mesmo diretório — o provider só lê
      # `.json` de `options.path` e ignoraria o `.yml` ao lado. O motivo de
      # separar é outro: o conteúdo pertence ao IaC e não pode morar em
      # /var/lib/grafana/data, que é ESTADO do Grafana (grafana.db, plugins,
      # render). Limpar estado apagaria dashboard versionado, e backup de
      # estado passaria a carregar arquivo do repositório.
      - /srv/containers/grafana/dashboards:/var/lib/grafana/dashboards
      - /srv/containers/grafana/data:/var/lib/grafana
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(\"${FQDN_GRAFANA}\")" #Define in Portainer
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.http.routers.grafana.service=grafana"
        - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
    networks:
      - monitoring
      - traefik_public

  influxdb:
    image: influxdb:2.7.12
    volumes:
      - /srv/containers/influxdb/config:/etc/influxdb2
      - /srv/containers/influxdb/db:/var/lib/influxdb2
    # Sem roteamento publico e sem publicacao de porta: porta publicada em
    # Swarm passa por DNAT em nat/PREROUTING, antes da chain filter, entao o
    # UFW nao a fecha. InfluxDB fica acessivel apenas na overlay "monitoring".
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
      restart_policy:
        condition: on-failure
    networks:
      - monitoring

  prometheus-pve-exporter:
    image: prompve/prometheus-pve-exporter:3.5.5
    environment:
      PVE_TOKEN_NAME: "${PVE_TOKEN_NAME}"
      PVE_TOKEN_VALUE: "${PVE_TOKEN_VALUE}"
      PVE_VERIFY_SSL: "false"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
    # Só a overlay `monitoring`: nada aqui é roteado pelo Traefik.
    networks:
      - monitoring

  # Exportador do nobreak: fala o protocolo NUT (TCP 3493) com o `upsd` do nó
  # que tem o cabo USB e traduz as variáveis para métricas do Prometheus.
  # Não roteado pelo Traefik e sem porta publicada: o Prometheus o alcança pela
  # overlay `monitoring`.
  nut_exporter:
    image: ghcr.io/druggeri/nut_exporter:3.3.0
    environment:
      NUT_EXPORTER_SERVER: "${NUT_SERVER}"
      # Sem usuário e sem senha: o `upsd` não exige autenticação para ler
      # variável — `upsd.users` governa ação e papel do upsmon, não leitura.
      # Verificado contra o nobreak real: as 14 variáveis vieram sem credencial.
      # A lista padrão do exporter cobre só 7 variáveis e deixa de fora tudo o
      # que o driver deste nobreak publica de saída e temperatura. Enumerada
      # aqui de propósito: lista vazia exportaria toda variável numérica, o que
      # muda a série temporal sem aviso quando o driver ganhar campos novos.
      #
      # ⚠️ UMA LINHA SÓ, sem escalar dobrado. Com `>-` o YAML dobra a quebra de
      # linha em ESPAÇO, e o exporter compara o nome da variável com
      # `sliceContains` literal, sem `TrimSpace`: " ups.load" não casa com
      # "ups.load" e a métrica some sem erro nenhum, do exporter ao Grafana.
      NUT_EXPORTER_VARIABLES: "battery.charge,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,output.voltage,output.voltage.nominal,output.current,output.frequency,ups.load,ups.power.nominal,ups.realpower.nominal,ups.temperature,ups.status"
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
      restart_policy:
        condition: on-failure
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.6
    volumes:
      - /srv/containers/loki/loki-config.yml:/mnt/config/loki-config.yml
      - /srv/containers/loki/data:/tmp/loki
    command:
      - "-config.file=/mnt/config/loki-config.yml"
    # Sem roteamento publico: Loki nao tem autenticacao propria e o Alloy faz
    # remote_write para ele apenas via overlay "monitoring" (forwardAuth de
    # SSO quebraria o Alloy, que e cliente de maquina, nao navegador).
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.18.1
    volumes:
      - /srv/containers/alloy/config.alloy:/etc/alloy/config.alloy
      - /srv/containers/alloy/data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "1514:1514/udp" # Remote Syslog UDP (OpenWrt, OPNsense, Proxmox, NAS)
      - "1514:1514/tcp" # Remote Syslog TCP
    # `--disable-reporting`: mesmo motivo do Grafana acima — o Alloy também
    # reporta uso para `stats.grafana.org`, que a DNSBL bloqueia, e ele também
    # repete. Ver o comentário no serviço `grafana`.
    command: "run --disable-reporting --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy"
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
    # Só a overlay `monitoring`: nada aqui é roteado pelo Traefik. A porta 1514
    # é publicada acima diretamente (syslog vem de fora da rede overlay).
    networks:
      - monitoring

networks:
  traefik_public:
    external: true
  monitoring:
    driver: overlay
    name: monitoring
