services:
  scraper:
    image: amerkurev/scrapper:v1.0.0
    networks:
      - pricebuddy
    #ports:
    #  - 3030:3000 # Opcional, só para acessar a API do scraper a partir do host
    deploy:
      placement:
        constraints: [node.role == manager]

  database:
    image: mariadb:12.0.2-noble
    environment:
      MARIADB_DATABASE: pricebuddy
      MARIADB_USER: pricebuddy
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - /srv/containers/pricebuddy/db:/var/lib/mysql
    networks:
      - pricebuddy
    deploy:
      placement:
        constraints: [node.role == manager]

  pricebuddy:
    image: jez500/pricebuddy:v1.0.54
    #ports:
    #  - 8080:80
    volumes:
      - /srv/containers/pricebuddy/storage:/app/storage
      - /srv/containers/pricebuddy/storage/.env:/app/.env
    environment:
      DB_HOST: tasks.pricebuddy_database # Nome do serviço de banco
      DB_USERNAME: pricebuddy # Igual ao MARIADB_USER do serviço database
      DB_PASSWORD: ${DB_PASSWORD} # Igual ao MARIADB_PASSWORD do serviço database
      DB_DATABASE: pricebuddy # Igual ao MARIADB_DATABASE do serviço database
      # A conta semeada persiste depois do primeiro boot. Definir no Portainer.
      APP_USER_EMAIL: ${PB_ADMIN_EMAIL}
      APP_USER_PASSWORD: ${PB_ADMIN_PASSWORD}
      SCRAPER_BASE_URL: http://tasks.pricebuddy_scraper:3000 # URL do serviço scraper
      AFFILIATE_ENABLED: "true" # Ver https://pricebuddy.jez.me/support-project.html
      APP_DEBUG: "true"
      APP_ENV: "local"
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pricebuddy.rule=Host(\"${FQDN}\")" # Definir no Portainer
        - "traefik.http.routers.pricebuddy.entrypoints=websecure"
        - "traefik.http.services.pricebuddy.loadbalancer.server.port=80"
        - "traefik.http.routers.pricebuddy.service=pricebuddy"
        - "traefik.http.routers.pricebuddy.tls.certresolver=cloudflare"
    networks:
      - pricebuddy
      - traefik_public

networks:
  traefik_public:
    external: true
  pricebuddy:
    driver: overlay
    name: pricebuddy
