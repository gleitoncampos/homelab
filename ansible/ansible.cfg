[defaults]
# Default aponta para PRODUÇÃO de propósito. Sem default, um `-i` esquecido não
# casa host nenhum e o play "passa" com "no hosts matched" — falha silenciosa,
# pior que um default alto. Dev é sempre explícito:
#   ansible-playbook -i inventories/dev/hosts.ini <playbook>
inventory = inventories/prod/hosts.ini
host_key_checking = False
retry_files_enabled = False
# `stdout_callback = community.general.yaml` (o valor óbvio) NÃO funciona mais:
# o plugin foi removido na community.general 12.0.0. A saída YAML virou opção do
# callback nativo. Errar aqui aborta TODO playbook antes da primeira task, e
# `--syntax-check` não pega — ele não carrega callback.
stdout_callback = default
result_format = yaml
callbacks_enabled = timer, profile_tasks

# Senha do Ansible Vault. Caminho relativo ao diretório de execução (ansible/),
# mesma convenção do `inventory` acima. O arquivo é gitignorado — crie com:
#   echo 'SUA-SENHA' > .ansible_vault_pass && chmod 600 .ansible_vault_pass
# Sem ele, qualquer playbook falha na largada: é intencional. Ver README.md.
vault_password_file = .ansible_vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
