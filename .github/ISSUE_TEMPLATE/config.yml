# Issue em branco desativada: sem um formulário, o relato chega sem o caminho
# do arquivo, sem a mensagem de erro e — o que importa mais aqui — sem o aviso
# de anonimizar dado antes de colar log.
blank_issues_enabled: false

contact_links:
